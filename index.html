<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectTest - Pointillism</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #000;
    }

    .circle-frame {
      position: relative;
      width: min(70vw, 70vh);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      flex: none;
    }

    #artwork {
      display: block;
      width: 100%;
      height: 100%;
    }

    #source {
      display: none;
    }

    #source.fallback {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="circle-frame">
    <canvas id="artwork" role="img" aria-label="ภาพศิลปะสไตล์ Pointillism"></canvas>
    <img id="source" src="./images/obj01.jpg" alt="ภาพต้นฉบับ">
  </div>

  <script>
    const image = document.getElementById('source');
    const canvas = document.getElementById('artwork');
    const ctx = canvas.getContext('2d');

    function showOriginal() {
      canvas.style.display = 'none';
      image.classList.add('fallback');
    }

    function fitCanvas(width, height) {
      const scale = Math.min(
        (window.innerWidth * 0.7) / width,
        (window.innerHeight * 0.7) / height,
        1
      );

      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }

    function renderPointillism() {
      if (!image.naturalWidth || !image.naturalHeight || !ctx) {
        showOriginal();
        return;
      }

      try {
        const sourceWidth = image.naturalWidth;
        const sourceHeight = image.naturalHeight;
        const side = Math.min(sourceWidth, sourceHeight);
        const cropX = (sourceWidth - side) / 2;
        const cropY = (sourceHeight - side) / 2;
        const width = side;
        const height = side;

        canvas.width = width;
        canvas.height = height;
        fitCanvas(width, height);

        const sourceCanvas = document.createElement('canvas');
        sourceCanvas.width = width;
        sourceCanvas.height = height;

        const sourceContext = sourceCanvas.getContext('2d', {
          willReadFrequently: true
        });

        if (!sourceContext) {
          showOriginal();
          return;
        }

        sourceContext.drawImage(
          image,
          cropX, cropY, side, side,
          0, 0, width, height
        );
        const pixels = sourceContext.getImageData(0, 0, width, height).data;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        const spacing = Math.max(3, Math.round(Math.min(width, height) / 180));
        let seed = 9173;

        function random() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }

        for (let y = spacing / 2; y < height; y += spacing) {
          for (let x = spacing / 2; x < width; x += spacing) {
            const offset = (Math.floor(y) * width + Math.floor(x)) * 4;
            const alpha = pixels[offset + 3] / 255;
            if (alpha < 0.05) continue;

            const jitterX = (random() - 0.5) * spacing * 0.55;
            const jitterY = (random() - 0.5) * spacing * 0.55;
            const radius = spacing * (0.22 + random() * 0.18);

            ctx.beginPath();
            ctx.arc(x + jitterX, y + jitterY, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${pixels[offset]}, ${pixels[offset + 1]}, ${pixels[offset + 2]}, ${alpha})`;
            ctx.fill();
          }
        }

        // Stronger film grain: small, high-contrast noise that remains visible
        // at the image's on-screen size.
        const displayScale = Math.min(
          (window.innerWidth * 0.7) / width,
          (window.innerHeight * 0.7) / height,
          1
        );
        const grainSize = 1.1;
        const noiseWidth = Math.max(1, Math.ceil(width * displayScale / grainSize));
        const noiseHeight = Math.max(1, Math.ceil(height * displayScale / grainSize));
        const noiseCanvas = document.createElement('canvas');
        noiseCanvas.width = noiseWidth;
        noiseCanvas.height = noiseHeight;

        const noiseContext = noiseCanvas.getContext('2d');
        const noiseImage = noiseContext.createImageData(noiseWidth, noiseHeight);

        for (let i = 0; i < noiseImage.data.length; i += 4) {
          // Push grain toward black or white so the texture is not washed out.
          const grain = random() < 0.5 ? 0 : 255;
          noiseImage.data[i] = grain;
          noiseImage.data[i + 1] = grain;
          noiseImage.data[i + 2] = grain;
          noiseImage.data[i + 3] = 255;
        }

        noiseContext.putImageData(noiseImage, 0, 0);
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = 0.52;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(noiseCanvas, 0, 0, width, height);
        ctx.restore();

        image.classList.remove('fallback');
        canvas.style.display = 'block';
      } catch (error) {
        console.error('Pointillism rendering failed:', error);
        showOriginal();
      }
    }

    image.addEventListener('load', renderPointillism);
    image.addEventListener('error', showOriginal);

    if (image.complete) {
      if (image.naturalWidth) renderPointillism();
      else showOriginal();
    }

    window.addEventListener('resize', () => {
      if (image.naturalWidth && canvas.width) {
        const side = Math.min(image.naturalWidth, image.naturalHeight);
        fitCanvas(side, side);
      }
    });
  </script>
</body>
</html>
