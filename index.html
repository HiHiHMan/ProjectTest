<!DOCTYPE html>
<html lang="th">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectTest</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;

      min-height: 100vh;

      width: auto;
      height: auto;
      object-fit: contain;
    }

</head>
