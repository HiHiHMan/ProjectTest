<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectTest - Pointillism</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #000;
    }

    .circle-frame {
      position: relative;
      width: min(70vw, 70vh);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      flex: none;

    }

    .circle-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle,
        transparent 18%,
        rgb(0 0 0 / 22%) 32%,
        rgb(0 0 0 / 58%) 48%,
        rgb(0 0 0 / 88%) 62%,
        #000 76%
      );
    }

    #artwork {
      display: block;
      width: 100%;
      height: 100%;
      filter: blur(0.5px);
    }

    .ly-3-noise {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.85;
      mix-blend-mode: overlay;
    }

    #source {
      display: none;
    }

    #source.fallback {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      border-radius: 50%;
      filter: blur(0.5px);
    }
  </style>
</head>
<body>
  <div class="circle-frame">
    <canvas id="artwork" role="img" aria-label="ภาพศิลปะสไตล์ Pointillism"></canvas>
    <img id="source" src="./images/obj01.png" alt="ภาพต้นฉบับ">
    <canvas class="ly-3-noise" aria-hidden="true"></canvas>
  </div>

  <script>
    const image = document.getElementById('source');
    const canvas = document.getElementById('artwork');
    const ctx = canvas.getContext('2d');
    const noiseLayer = document.querySelector('.ly-3-noise');
    const noiseCtx = noiseLayer.getContext('2d');

    function renderNoise() {
      const rect = noiseLayer.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));

      if (noiseLayer.width !== width || noiseLayer.height !== height) {
        noiseLayer.width = width;
        noiseLayer.height = height;
      }

      // Generate the texture in physical pixels so browser zoom does not enlarge its grain.
      const tileSize = Math.max(1, Math.round(80 * dpr));
      const tile = document.createElement('canvas');
      tile.width = tileSize;
      tile.height = tileSize;

      const tileCtx = tile.getContext('2d');
      const imageData = tileCtx.createImageData(tileSize, tileSize);

      let seed = 18473;
      for (let i = 0; i < imageData.data.length; i += 4) {
        seed = (seed * 16807) % 2147483647;
        const value = Math.floor((seed - 1) / 2147483646 * 256);
        imageData.data[i] = value;
        imageData.data[i + 1] = value;
        imageData.data[i + 2] = value;
        imageData.data[i + 3] = 255;
      }

      tileCtx.putImageData(imageData, 0, 0);
      const pattern = noiseCtx.createPattern(tile, 'repeat');

      noiseCtx.clearRect(0, 0, width, height);
      noiseCtx.fillStyle = pattern;
      noiseCtx.fillRect(0, 0, width, height);
    }

    renderNoise();
    window.addEventListener('resize', renderNoise);

    function showOriginal() {
      canvas.style.display = 'none';
      image.classList.add('fallback');
    }

    function fitCanvas(width, height) {
      const scale = Math.min(
        (window.innerWidth * 0.7) / width,
        (window.innerHeight * 0.7) / height,
        1
      );

      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }

    function renderPointillism() {
      if (!image.naturalWidth || !image.naturalHeight || !ctx) {
        showOriginal();
        return;
      }

      try {
        const sourceWidth = image.naturalWidth;
        const sourceHeight = image.naturalHeight;
        const side = Math.min(sourceWidth, sourceHeight);
        const cropX = (sourceWidth - side) / 2;
        const cropY = (sourceHeight - side) / 2;
        const width = side;
        const height = side;

        canvas.width = width;
        canvas.height = height;
        fitCanvas(width, height);

        const sourceCanvas = document.createElement('canvas');
        sourceCanvas.width = width;
        sourceCanvas.height = height;

        const sourceContext = sourceCanvas.getContext('2d', {
          willReadFrequently: true
        });

        if (!sourceContext) {
          showOriginal();
          return;
        }

        sourceContext.drawImage(
          image,
          cropX, cropY, side, side,
          0, 0, width, height
        );
        const pixels = sourceContext.getImageData(0, 0, width, height).data;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        const spacing = Math.max(3, Math.round(Math.min(width, height) / 180));
        let seed = 9173;

        function random() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }

        for (let y = spacing / 2; y < height; y += spacing) {
          for (let x = spacing / 2; x < width; x += spacing) {
            const offset = (Math.floor(y) * width + Math.floor(x)) * 4;
            const alpha = pixels[offset + 3] / 255;
            if (alpha < 0.05) continue;

            const jitterX = (random() - 0.5) * spacing * 0.55;
            const jitterY = (random() - 0.5) * spacing * 0.55;
            const radius = spacing * (0.22 + random() * 0.18);

            ctx.beginPath();
            ctx.arc(x + jitterX, y + jitterY, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${pixels[offset]}, ${pixels[offset + 1]}, ${pixels[offset + 2]}, ${alpha})`;
            ctx.fill();
          }
        }

        image.classList.remove('fallback');
        canvas.style.display = 'block';
      } catch (error) {
        console.error('Pointillism rendering failed:', error);
        showOriginal();
      }
    }

    image.addEventListener('load', renderPointillism);
    image.addEventListener('error', showOriginal);

    if (image.complete) {
      if (image.naturalWidth) renderPointillism();
      else showOriginal();
    }

    window.addEventListener('resize', () => {
      if (image.naturalWidth && canvas.width) {
        const side = Math.min(image.naturalWidth, image.naturalHeight);
        fitCanvas(side, side);
      }
    });
  </script>
</body>
</html>
