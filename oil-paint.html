<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dc">
<title>Watercolor Studio</title>
<style>
:root{color-scheme:light;--ink:#373b3b;--muted:#777a75;--line:#ded9cd;--accent:#547d82}
*{box-sizing:border-box}body{margin:0;background:#eeece5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1440px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:clamp(23px,3vw,32px);margin:0;font-weight:650}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}
aside,.stage{background:#faf9f5;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 20px #514b3a0a}
aside{padding:18px;display:grid;gap:18px}.group{display:grid;gap:10px}.group-title{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #7774;cursor:pointer}.swatch.active{outline:2px solid var(--accent);outline-offset:3px}
input[type=range]{width:100%;accent-color:var(--accent)}.range-row{display:flex;justify-content:space-between;font-size:13px}
select,button{font:inherit}select{width:100%;padding:10px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:1px solid var(--line);background:#f1efe8;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--accent);background:#e9efeb}button.primary{background:#547d82;color:white;border-color:#547d82;font-weight:650}
button:disabled{opacity:.4;cursor:not-allowed}.stage{padding:14px;min-width:0}
.canvas-wrap{overflow:hidden;border-radius:8px;background:#f7f3e8;line-height:0;touch-action:none;box-shadow:inset 0 0 0 1px #b8ae9860}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;cursor:crosshair;touch-action:none}
.hint{display:flex;justify-content:space-between;gap:10px;padding:12px 3px 0;color:var(--muted);font-size:12px;line-height:1.5}.status{color:#547d82}
@media(max-width:760px){.app{padding:14px}.layout{grid-template-columns:1fr}aside{grid-template-columns:1fr 1fr}.group:first-child{grid-column:1/-1}.stage{padding:8px}}
@media(max-width:440px){aside{grid-template-columns:1fr}.group:first-child{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>Watercolor Studio</h1><p>ทดลองระบายสีน้ำแบบโปร่งแสง ซ้อนชั้นสี และสร้างขอบสีไหล</p></div><button id="saveBtn" class="primary">บันทึกภาพ PNG</button></header>
<div class="layout">
<aside>
<section class="group"><div class="group-title">ชุดสีสีน้ำ</div><div class="colors" id="palette"></div><label class="range-row" for="customColor">เลือกสีเอง</label><input id="customColor" type="color" value="#397f9c" style="width:100%;height:36px;border:0;background:none"></section>
<section class="group"><div class="group-title">ชนิดพู่กัน</div><select id="brush"><option value="wash">พู่กันกลม — ระบายฟุ้ง</option><option value="wet">สีน้ำเปียก — สีไหลซ้อน</option><option value="dry">พู่กันแห้ง — เห็นเส้นกระดาษ</option></select></section>
<section class="group">
<div class="range-row"><label for="size">ขนาดพู่กัน</label><output id="sizeValue">42 px</output></div><input id="size" type="range" min="5" max="130" value="42">
<div class="range-row"><label for="opacity">ความเข้มของสี</label><output id="opacityValue">35%</output></div><input id="opacity" type="range" min="5" max="85" value="35">
<div class="range-row"><label for="water">ปริมาณน้ำ</label><output id="waterValue">65%</output></div><input id="water" type="range" min="0" max="100" value="65">
</section>
<section class="group"><div class="group-title">จัดการภาพ</div><div class="actions"><button id="undoBtn" disabled>ย้อนกลับ</button><button id="clearBtn">ล้างผ้าใบ</button></div><button id="resetBtn">เริ่มผืนใหม่</button></section>
</aside>
<section class="stage"><div class="canvas-wrap"><canvas id="paint" width="1200" height="750" aria-label="พื้นที่ระบายสีน้ำ"></canvas></div><div class="hint"><span>ลากเมาส์หรือใช้นิ้วระบายสี · ลองระบายทับหลายชั้น</span><span class="status" id="status">พร้อมระบาย</span></div></section>
</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('paint'),ctx=canvas.getContext('2d');
const palette=['#285b78','#397f9c','#73a9b0','#a9c6bd','#345b43','#71915d','#c5a34a','#e1bd75','#c96e48','#a94c43','#855b82','#655d91','#35404a','#6d6559','#f0d9b6'];
const paletteEl=document.getElementById('palette'),size=document.getElementById('size'),opacity=document.getElementById('opacity'),water=document.getElementById('water'),brush=document.getElementById('brush');
let color='#397f9c',drawing=false,last=null,history=[];
const rand=(a,b)=>a+Math.random()*(b-a);
function paper(){
 ctx.fillStyle='#f7f3e8';ctx.fillRect(0,0,1200,750);
 // Cotton paper fibers and subtle tooth
 for(let i=0;i<42000;i++){const x=Math.random()*1200,y=Math.random()*750,a=rand(.012,.055);ctx.fillStyle=Math.random()>.5?'rgba(113,91,61,'+a+')':'rgba(255,255,255,'+a+')';ctx.fillRect(x,y,rand(.4,2.2),rand(.4,1.6));}
 for(let i=0;i<750;i++){ctx.strokeStyle='rgba(120,103,75,.025)';ctx.lineWidth=rand(.3,.8);ctx.beginPath();const x=Math.random()*1200,y=Math.random()*750;ctx.moveTo(x,y);ctx.lineTo(x+rand(2,14),y+rand(-1,1));ctx.stroke();}
}
function snapshot(){history.push(ctx.getImageData(0,0,1200,750));if(history.length>20)history.shift();document.getElementById('undoBtn').disabled=!history.length;}
function rgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgba(hex,a){const c=rgb(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*750/r.height,pressure:e.pressure||.5}}
function pigmentDab(p,prev){
 const radius=Number(size.value)*(.65+(p.pressure||.5)*.55),wet=Number(water.value)/100,alpha=Number(opacity.value)/100;
 const dx=prev?p.x-prev.x:0,dy=prev?p.y-prev.y,angle=Math.atan2(dy,dx);
 ctx.save();ctx.globalCompositeOperation='multiply';
 if(brush.value==='dry'){
   ctx.lineCap='round';for(let i=0;i<15;i++){const off=rand(-radius*.42,radius*.42);ctx.strokeStyle=rgba(color,alpha*rand(.12,.42));ctx.lineWidth=rand(.5,2.4);ctx.beginPath();ctx.moveTo(p.x+Math.cos(angle+Math.PI/2)*off,p.y+Math.sin(angle+Math.PI/2)*off);ctx.lineTo(p.x+Math.cos(angle+Math.PI/2)*off-dx*.9,p.y+Math.sin(angle+Math.PI/2)*off-dy*.9);ctx.stroke();}
 }else{
   const stretch=brush.value==='wet'?1.35:1;
   const g=ctx.createRadialGradient(p.x-radius*.12,p.y-radius*.18,radius*.04,p.x,p.y,radius*stretch);
   g.addColorStop(0,rgba(color,alpha*(.30+wet*.20)));g.addColorStop(.62,rgba(color,alpha*(.22+wet*.13)));g.addColorStop(.86,rgba(color,alpha*(.13+wet*.08)));g.addColorStop(1,rgba(color,0));
   ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,radius*stretch,radius*(.78+wet*.2),angle,0,Math.PI*2);ctx.fill();
   // Irregular pigment tide line, the darker edge typical of watercolor
   ctx.globalAlpha=alpha*(.12+wet*.13);ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,radius*.035);ctx.beginPath();
   for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,noise=1+Math.sin(a*5+p.x*.03)*.035+Math.sin(a*9+p.y*.02)*.025,x=p.x+Math.cos(a)*radius*stretch*noise,y=p.y+Math.sin(a)*radius*(.78+wet*.2)*noise;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();
   // Granulation: tiny pigment deposits inside the wash
   const count=Math.floor(radius*wet*.55);
   for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*radius*.88,x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r*.8;ctx.fillStyle=rgba(color,rand(.025,.12)*alpha);ctx.beginPath();ctx.arc(x,y,rand(.4,1.5),0,Math.PI*2);ctx.fill();}
   // Occasional water blooms / cauliflower edges
   if(brush.value==='wet'&&Math.random()<.16){ctx.globalAlpha=.11;ctx.strokeStyle='#fff';ctx.lineWidth=rand(2,6);ctx.beginPath();ctx.arc(p.x+rand(-radius*.3,radius*.3),p.y+rand(-radius*.3,radius*.3),radius*rand(.35,.7),0,Math.PI*2);ctx.stroke();}
 }
 ctx.restore();
}
function dab(p,prev){if(prev){const d=Math.hypot(p.x-prev.x,p.y-prev.y),spacing=Math.max(2,Number(size.value)*.09),steps=Math.max(1,Math.ceil(d/spacing));for(let i=1;i<=steps;i++){const t=i/steps;pigmentDab({x:prev.x+(p.x-prev.x)*t,y:prev.y+(p.y-prev.y)*t,pressure:p.pressure},prev)}}else pigmentDab(p,null)}
function start(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();snapshot();drawing=true;canvas.setPointerCapture(e.pointerId);last=point(e);dab(last,null);document.getElementById('status').textContent='กำลังระบาย…'}
function move(e){if(!drawing)return;e.preventDefault();const p=point(e);dab(p,last);last=p}
function end(){if(!drawing)return;drawing=false;last=null;document.getElementById('status').textContent='ระบายเสร็จแล้ว'}
palette.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.title=c;b.setAttribute('aria-label','เลือกสี '+c);b.onclick=()=>choose(c,b);paletteEl.appendChild(b)});
function choose(c,el){color=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('customColor').value=c}
document.getElementById('customColor').oninput=e=>choose(e.target.value,null);
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
[['size','sizeValue',' px'],['opacity','opacityValue','%'],['water','waterValue','%']].forEach(([id,out,suffix])=>document.getElementById(id).addEventListener('input',e=>document.getElementById(out).textContent=e.target.value+suffix));
document.getElementById('undoBtn').onclick=()=>{const img=history.pop();if(img)ctx.putImageData(img,0,0);document.getElementById('undoBtn').disabled=!history.length;document.getElementById('status').textContent='ย้อนกลับแล้ว'};
document.getElementById('clearBtn').onclick=()=>{snapshot();paper();document.getElementById('status').textContent='ล้างกระดาษแล้ว'};
document.getElementById('resetBtn').onclick=()=>{history=[];paper();document.getElementById('undoBtn').disabled=true;document.getElementById('status').textContent='เริ่มกระดาษใหม่แล้ว'};
document.getElementById('saveBtn').onclick=()=>{const a=document.createElement('a');a.download='watercolor-painting.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='บันทึกภาพแล้ว'};
paper();
})();
</script>
</body></html>
