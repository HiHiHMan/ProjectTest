<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>Oil Paint Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#171512;--panel:#24211d;--line:#39342d;--muted:#aaa197;--text:#f4eee5;--accent:#d8a65c}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% -20%,#393025 0,#171512 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    .app{max-width:1440px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    h1{font-size:clamp(22px,3vw,32px);margin:0;font-weight:650;letter-spacing:.02em}
    header p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
    aside,.stage{background:rgba(36,33,29,.94);border:1px solid var(--line);border-radius:16px}
    aside{padding:18px;display:grid;gap:18px}
    .group{display:grid;gap:10px}
    .group-title{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .colors{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
    .swatch{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #ffffff30;cursor:pointer;position:relative}
    .swatch.active{outline:2px solid var(--accent);outline-offset:3px}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .range-row{display:flex;justify-content:space-between;font-size:13px;color:#e8dfd4}
    select,button{font:inherit}
    select{width:100%;padding:10px;background:#171512;color:var(--text);border:1px solid var(--line);border-radius:9px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{border:1px solid var(--line);background:#302b25;color:var(--text);padding:10px 12px;border-radius:9px;cursor:pointer;transition:.15s}
    button:hover{border-color:var(--accent);background:#3a3228}
    button.primary{background:var(--accent);color:#21180d;border-color:var(--accent);font-weight:700}
    button:disabled{opacity:.35;cursor:not-allowed}
    .stage{padding:14px;min-width:0}
    .canvas-wrap{position:relative;overflow:hidden;border-radius:9px;background:#d8c9a8;line-height:0;touch-action:none}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;cursor:crosshair;touch-action:none}
    .hint{display:flex;justify-content:space-between;gap:10px;padding:12px 3px 0;color:var(--muted);font-size:12px;line-height:1.5}
    .status{color:#e2bd80}
    @media(max-width:760px){.app{padding:14px}.layout{grid-template-columns:1fr}aside{grid-template-columns:1fr 1fr}.group:first-child{grid-column:1/-1}.stage{padding:8px}.hint{font-size:11px}}
    @media(max-width:440px){aside{grid-template-columns:1fr}.group:first-child{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Oil Paint Studio</h1><p>ทดลองปาดสี สร้างชั้นสี และพื้นผิวแบบสีน้ำมัน</p></div>
      <button id="saveBtn" class="primary">บันทึกภาพ PNG</button>
    </header>
    <div class="layout">
      <aside>
        <section class="group">
          <div class="group-title">เลือกสี</div>
          <div class="colors" id="palette"></div>
          <label class="range-row" for="customColor">สีที่กำหนดเอง</label>
          <input id="customColor" type="color" value="#c94f32" style="width:100%;height:38px;background:none;border:0">
        </section>
        <section class="group">
          <div class="group-title">พู่กัน</div>
          <select id="brush">
            <option value="oil">สีน้ำมัน — สีหนา</option>
            <option value="flat">เกรียงปาดสี</option>
            <option value="dry">พู่กันแห้ง</option>
          </select>
        </section>
        <section class="group">
          <div class="range-row"><label for="size">ขนาดพู่กัน</label><output id="sizeValue">24 px</output></div>
          <input id="size" type="range" min="3" max="90" value="24">
          <div class="range-row"><label for="thickness">ความหนาของสี</label><output id="thickValue">65%</output></div>
          <input id="thickness" type="range" min="10" max="100" value="65">
        </section>
        <section class="group">
          <div class="group-title">จัดการภาพ</div>
          <div class="actions">
            <button id="undoBtn" disabled>ย้อนกลับ</button>
            <button id="clearBtn">ล้างผ้าใบ</button>
          </div>
          <button id="resetBtn">คืนค่าผ้าใบใหม่</button>
        </section>
      </aside>
      <section class="stage">
        <div class="canvas-wrap"><canvas id="paint" width="1200" height="750" aria-label="พื้นที่วาดภาพ"></canvas></div>
        <div class="hint"><span>ลากเมาส์หรือใช้นิ้วเพื่อวาด · กดค้างแล้วลากเพื่อปาดสี</span><span class="status" id="status">พร้อมวาด</span></div>
      </section>
    </div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('paint');
  const ctx = canvas.getContext('2d');
  const palette = ['#202a35','#315b72','#6c8b86','#d6b56d','#f0d9a5','#c94f32','#8f3028','#e18b42','#71834b','#f2eee2','#6e4c78','#49372e','#111111','#ffffff','#bd8f8a'];
  const paletteEl = document.getElementById('palette');
  const size = document.getElementById('size');
  const thickness = document.getElementById('thickness');
  const brush = document.getElementById('brush');
  const status = document.getElementById('status');
  let color = '#c94f32', drawing = false, last = null, history = [], strokes = [];
  let strokePoints = [];

  function makeCanvasTexture() {
    ctx.fillStyle = '#d8c9a8'; ctx.fillRect(0,0,canvas.width,canvas.height);
    // Subtle linen grain
    for(let i=0;i<18000;i++){
      const x=Math.random()*canvas.width, y=Math.random()*canvas.height;
      ctx.fillStyle = Math.random()>.5 ? 'rgba(89,67,39,.035)' : 'rgba(255,255,255,.07)';
      ctx.fillRect(x,y,Math.random()*2+.3,Math.random()*2+.3);
    }
    ctx.strokeStyle='rgba(110,83,49,.045)'; ctx.lineWidth=1;
    for(let y=0;y<canvas.height;y+=5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  }
  function saveHistory(){
    history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    if(history.length>15) history.shift();
    document.getElementById('undoBtn').disabled=history.length===0;
  }
  function point(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height,pressure:e.pressure||.5};
  }
  function hexRgb(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255]}
  function shade(hex,amount){const [r,g,b]=hexRgb(hex);return 'rgb('+[r,g,b].map(v=>Math.max(0,Math.min(255,v+amount))).join(',')+')'}
  function dab(p,prev){
    const base=Number(size.value), thick=Number(thickness.value)/100;
    const pressure=Math.max(.35,p.pressure||.5), radius=base*(.35+pressure*.65);
    const dx=prev?p.x-prev.x:0,dy=prev?p.y-prev.y:0;
    const angle=Math.atan2(dy,dx);
    ctx.save();
    if(brush.value==='flat'){
      ctx.translate(p.x,p.y);ctx.rotate(angle);
      ctx.shadowColor='rgba(30,20,10,.28)';ctx.shadowBlur=radius*.22;ctx.shadowOffsetY=radius*.12;
      ctx.fillStyle=color;
      ctx.beginPath();ctx.ellipse(0,0,radius*1.45,radius*.34,0,0,Math.PI*2);ctx.fill();
      ctx.shadowColor='transparent';
      ctx.strokeStyle=shade(color,Math.round(35*thick));ctx.lineWidth=Math.max(1,radius*.12);
      ctx.beginPath();ctx.moveTo(-radius,-radius*.06);ctx.lineTo(radius,.02*radius);ctx.stroke();
    } else if(brush.value==='dry'){
      for(let i=0;i<7;i++){
        const off=(i-3)*radius*.12;
        ctx.strokeStyle=i%2?shade(color,18):color;ctx.globalAlpha=.22+thick*.35;
        ctx.lineWidth=Math.max(1,radius*.10);
        ctx.beginPath();ctx.moveTo(p.x+Math.cos(angle+Math.PI/2)*off,p.y+Math.sin(angle+Math.PI/2)*off);
        ctx.lineTo(p.x+Math.cos(angle+Math.PI/2)*off-dx*.7,p.y+Math.sin(angle+Math.PI/2)*off-dy*.7);ctx.stroke();
      }
    } else {
      ctx.lineCap='round';ctx.lineJoin='round';
      if(prev){
        ctx.strokeStyle=color;ctx.lineWidth=radius*1.5;ctx.shadowColor='rgba(25,15,8,.38)';ctx.shadowBlur=radius*.22;ctx.shadowOffsetY=radius*.12;
        ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();
      }
      ctx.shadowColor='transparent';
      const g=ctx.createRadialGradient(p.x-radius*.25,p.y-radius*.3,1,p.x,p.y,radius*.8);
      g.addColorStop(0,shade(color,Math.round(45*thick)));g.addColorStop(.48,color);g.addColorStop(1,shade(color,-Math.round(32*thick)));
      ctx.fillStyle=g;ctx.globalAlpha=.78+thick*.22;
      ctx.beginPath();ctx.ellipse(p.x,p.y,radius*.72,radius*.48,angle,0,Math.PI*2);ctx.fill();
      // Raised paint ridges catch the light
      ctx.globalAlpha=.28+thick*.3;ctx.strokeStyle=shade(color,65);ctx.lineWidth=Math.max(1,radius*.09);
      ctx.beginPath();ctx.moveTo(p.x-Math.cos(angle)*radius*.42-Math.sin(angle)*radius*.15,p.y-Math.sin(angle)*radius*.42+Math.cos(angle)*radius*.15);
      ctx.lineTo(p.x+Math.cos(angle)*radius*.28-Math.sin(angle)*radius*.08,p.y+Math.sin(angle)*radius*.28+Math.cos(angle)*radius*.08);ctx.stroke();
    }
    ctx.restore();
  }
  function start(e){
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();saveHistory();drawing=true;canvas.setPointerCapture(e.pointerId);
    last=point(e);strokePoints=[last];dab(last,null);status.textContent='กำลังลงสี…';
  }
  function move(e){
    if(!drawing)return;e.preventDefault();
    const p=point(e),dist=Math.hypot(p.x-last.x,p.y-last.y),steps=Math.max(1,Math.ceil(dist/Math.max(2,Number(size.value)*.12)));
    for(let i=1;i<=steps;i++){const t=i/steps,q={x:last.x+(p.x-last.x)*t,y:last.y+(p.y-last.y)*t,pressure:p.pressure};dab(q,last);last=q;strokePoints.push(q);}
  }
  function end(){if(!drawing)return;drawing=false;last=null;status.textContent='ลงสีแล้ว';document.getElementById('undoBtn').disabled=history.length===0;}
  palette.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.title=c;b.setAttribute('aria-label','เลือกสี '+c);b.addEventListener('click',()=>selectColor(c,b));paletteEl.appendChild(b)});
  function selectColor(c,el){color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('customColor').value=c;}
  document.getElementById('customColor').addEventListener('input',e=>selectColor(e.target.value,null));
  canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
  size.addEventListener('input',()=>document.getElementById('sizeValue').textContent=size.value+' px');
  thickness.addEventListener('input',()=>document.getElementById('thickValue').textContent=thickness.value+'%');
  document.getElementById('undoBtn').addEventListener('click',()=>{const img=history.pop();if(img)ctx.putImageData(img,0,0);document.getElementById('undoBtn').disabled=history.length===0;status.textContent='ย้อนกลับแล้ว'});
  function clear(){saveHistory();makeCanvasTexture();status.textContent='ล้างผ้าใบแล้ว'}
  document.getElementById('clearBtn').addEventListener('click',clear);
  document.getElementById('resetBtn').addEventListener('click',()=>{history=[];makeCanvasTexture();document.getElementById('undoBtn').disabled=true;status.textContent='เริ่มผืนใหม่แล้ว'});
  document.getElementById('saveBtn').addEventListener('click',()=>{const a=document.createElement('a');a.download='oil-painting.png';a.href=canvas.toDataURL('image/png');a.click();status.textContent='บันทึกภาพแล้ว'});
  makeCanvasTexture();
})();
</script>
</body>
</html>
