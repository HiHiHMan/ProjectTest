<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Moster — Black Sphere</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 34% 30% at 22% 26%,
          rgb(64 45 82 / 42%) 0%,
          rgb(64 45 82 / 18%) 38%,
          transparent 100%),
        radial-gradient(ellipse 32% 34% at 80% 66%,
          rgb(32 65 78 / 38%) 0%,
          rgb(32 65 78 / 16%) 42%,
          transparent 100%),
        radial-gradient(ellipse 24% 20% at 54% 92%,
          rgb(64 45 82 / 20%) 0%,
          transparent 100%),
        radial-gradient(ellipse 18% 22% at 92% 12%,
          rgb(32 65 78 / 18%) 0%,
          transparent 100%),
        #000000;
    }
    .sphere {
      width: min(48vw, 48vh, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 27%,
          #343434 0%,
          #171717 24%,
          #080808 52%,
          #000000 76%);
      box-shadow:
        inset -18px -22px 34px rgb(0 0 0 / 78%),
        inset 10px 8px 20px rgb(255 255 255 / 8%),
        0 24px 48px rgb(0 0 0 / 18%);
    }
  </style>
</head>
<body>
  <main aria-label="Black sphere">
    <div class="sphere" role="img" aria-label="A black sphere"></div>
  </main>
</body>
</html>
