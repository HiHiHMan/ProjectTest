<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <title>Fireworks — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(ellipse at 50% 100%, #17213b 0%, #0a1022 40%, #03050d 100%);
      color: #eef2ff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    #scene { display: block; width: 100%; height: 100%; }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 2;
      color: #dce5ff; text-decoration: none; font-size: 12px;
      letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid #a9b8e455; border-radius: 999px;
      padding: 10px 16px; background: #080b18aa; backdrop-filter: blur(10px);
    }
    .hint {
      position: fixed; right: 30px; bottom: 26px; z-index: 2;
      color: #8996b7; font-size: 10px; letter-spacing: .18em;
      text-transform: uppercase; pointer-events: none;
    }
    @media (max-width: 600px) {
      .back { top: 18px; left: 18px; }
      .hint { right: 18px; bottom: 18px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← Experiments</a>
  <canvas id="scene" aria-label="Colorful fireworks exploding in the night sky"></canvas>
  <div class="hint">Click anywhere to launch</div>
  <script>
    (() => {
      const canvas = document.getElementById('scene');
      const gl = canvas.getContext('webgl', { alpha: true, antialias: true });
      if (!gl) return;

      const vertexSource = `
        attribute vec2 aPosition;
        attribute float aSize;
        attribute vec4 aColor;
        uniform vec2 uResolution;
        uniform float uPixelRatio;
        varying vec4 vColor;
        void main() {
          vec2 clip = vec2(
            aPosition.x / uResolution.x * 2.0 - 1.0,
            1.0 - aPosition.y / uResolution.y * 2.0
          );
          gl_Position = vec4(clip, 0.0, 1.0);
          gl_PointSize = aSize * uPixelRatio;
          vColor = aColor;
        }`;

      const fragmentSource = `
        precision mediump float;
        varying vec4 vColor;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p) * 2.0;
          if (d > 1.0) discard;
          float core = exp(-d * d * 18.0);
          float glow = exp(-d * d * 5.0) * 0.34;
          float alpha = max(core, glow) * vColor.a;
          gl_FragColor = vec4(vColor.rgb * alpha, alpha);
        }`;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      }

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);

      const capacity = 12000;
      const stride = 7;
      const vertexData = new Float32Array(capacity * stride);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertexData.byteLength, gl.DYNAMIC_DRAW);

      const positionLoc = gl.getAttribLocation(program, 'aPosition');
      const sizeLoc = gl.getAttribLocation(program, 'aSize');
      const colorLoc = gl.getAttribLocation(program, 'aColor');
      gl.enableVertexAttribArray(positionLoc);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, stride * 4, 0);
      gl.enableVertexAttribArray(sizeLoc);
      gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, stride * 4, 2 * 4);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 4, gl.FLOAT, false, stride * 4, 3 * 4);

      const resolutionLoc = gl.getUniformLocation(program, 'uResolution');
      const ratioLoc = gl.getUniformLocation(program, 'uPixelRatio');
      const particles = [];
      const rockets = [];
      const miniShells = [];
      const palette = [
        [1.00, 0.28, 0.20], [1.00, 0.62, 0.18],
        [1.00, 0.88, 0.42], [0.30, 0.82, 1.00],
        [0.48, 0.48, 1.00], [0.78, 0.42, 1.00],
        [1.00, 0.38, 0.68], [0.38, 1.00, 0.72]
      ];
      let width = innerWidth;
      let height = innerHeight;
      let pixelRatio = 1;
      let lastTime = 0;
      let nextLaunch = 0;

      function resize() {
        width = innerWidth;
        height = innerHeight;
        pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * pixelRatio);
        canvas.height = Math.floor(height * pixelRatio);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(resolutionLoc, width, height);
        gl.uniform1f(ratioLoc, pixelRatio);
      }
      window.addEventListener('resize', resize);
      resize();

      function addParticle(x, y, vx, vy, color, life, size, gravity, drag, split = false, trail = false) {
        if (particles.length >= capacity) return;
        particles.push({
          x, y, vx, vy, color, life, maxLife: life,
          size, gravity, drag, split, trail, trailTimer: 0,
          twinkle: Math.random() * 8
        });
      }

      // A small percentage of sparks split again near the end of their flight.
      function secondaryBurst(x, y, color) {
        const count = 11 + Math.floor(Math.random() * 10);
        const rotation = Math.random() * Math.PI * 2;
        const speed = 24 + Math.random() * 30;
        for (let i = 0; i < count; i++) {
          const angle = rotation + (i / count) * Math.PI * 2;
          const life = 0.42 + Math.random() * 0.42;
          addParticle(
            x, y,
            Math.cos(angle) * speed * (0.7 + Math.random() * 0.5),
            Math.sin(angle) * speed * (0.7 + Math.random() * 0.5),
            color, life, 1.2 + Math.random() * 1.4,
            105, 0.975
          );
        }
      }

      // Tiny embedded shells travel outward with the main burst, then explode.
      function miniBurst(x, y, color) {
        const count = 22 + Math.floor(Math.random() * 16);
        const rotation = Math.random() * Math.PI * 2;
        const speed = 42 + Math.random() * 34;
        for (let i = 0; i < count; i++) {
          const angle = rotation + (i / count) * Math.PI * 2;
          const particleSpeed = speed * (0.72 + Math.random() * 0.48);
          const life = 0.65 + Math.random() * 0.65;
          const tint = Math.random() < 0.3
            ? color.map((channel, index) => channel * 0.45 + [1, 0.9, 0.68][index] * 0.55)
            : color;
          addParticle(
            x, y,
            Math.cos(angle) * particleSpeed,
            Math.sin(angle) * particleSpeed,
            tint, life, 1.5 + Math.random() * 1.5,
            95 + Math.random() * 30, 0.979
          );
        }
      }

      function launch(x = width * (0.16 + Math.random() * 0.68), targetY) {
        const color = palette[Math.floor(Math.random() * palette.length)];
        rockets.push({
          x, y: height + 8,
          targetY: targetY ?? height * (0.20 + Math.random() * 0.36),
          vx: (Math.random() - 0.5) * 42,
          vy: -(height * (0.62 + Math.random() * 0.18)),
          color,
          trailTimer: 0
        });
      }

      function burstFlash(x, y, color) {
        // A brief white-hot core and colored halo make the instant of detonation pop.
        addParticle(x, y, 0, 0, [1.0, 1.0, 0.96], 0.16, 78, 0, 0.72);
        addParticle(x, y, 0, 0, color, 0.24, 112, 0, 0.78);
        addParticle(x, y, 0, 0, [1.0, 0.88, 0.66], 0.12, 38, 0, 0.7);
      }

      function burst(x, y, color) {
        burstFlash(x, y, color);

        // Frequent golden willow shells: long, clearly visible trails that cascade downward.
        if (Math.random() < 0.48) {
          const willowCount = 230 + Math.floor(Math.random() * 90);
          const rotation = Math.random() * Math.PI * 2;
          // Randomly mix vivid colors with a few warm highlights for each willow flower.
          const willowColors = palette.concat([
            [1.00, 0.82, 0.42],
            [1.00, 0.94, 0.76]
          ]);
          const colorOffset = Math.floor(Math.random() * willowColors.length);
          for (let i = 0; i < willowCount; i++) {
            const angle = rotation + (i / willowCount) * Math.PI * 2;
            const speed = 52 + Math.random() * 78;
            const life = 3.8 + Math.random() * 1.5;
            const willowColor = willowColors[
              (colorOffset + Math.floor(Math.random() * willowColors.length)) % willowColors.length
            ];
            addParticle(
              x, y,
              Math.cos(angle) * speed * (0.88 + Math.random() * 0.24),
              Math.sin(angle) * speed * (0.88 + Math.random() * 0.24),
              willowColor, life, 3.4 + Math.random() * 2.0,
              165 + Math.random() * 55, 0.997,
              false, true
            );
          }

          // A sparse layer of bright embers gives the hanging willow tips extra sparkle.
          const emberCount = 32 + Math.floor(Math.random() * 24);
          for (let i = 0; i < emberCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 45 + Math.random() * 115;
            addParticle(
              x, y, Math.cos(angle) * speed, Math.sin(angle) * speed,
              [1.0, 0.94, 0.72],
              2.0 + Math.random() * 1.1, 1.1 + Math.random() * 1.1,
              125, 0.991
            );
          }
          return;
        }

        const pattern = Math.random();
        const count = 115 + Math.floor(Math.random() * 95);
        const baseSpeed = 85 + Math.random() * 115;
        const rotation = Math.random() * Math.PI * 2;
        const useGradient = Math.random() < 0.38;
        const accent = palette[Math.floor(Math.random() * palette.length)];
        for (let i = 0; i < count; i++) {
          const angle = rotation + (i / count) * Math.PI * 2;
          let speed = baseSpeed * (0.72 + Math.random() * 0.42);
          if (pattern < 0.24) speed *= i % 2 ? 0.48 : 1.0;
          if (pattern > 0.76) speed *= 0.72 + Math.random() * 0.5;
          const life = 1.25 + Math.random() * 1.25;
          // Some shells blend two hues around the burst for a flowing color gradient.
          const blend = useGradient ? 0.5 - Math.cos((i / count) * Math.PI * 2) * 0.5 : 0;
          const particleColor = color.map((channel, index) =>
            channel * (1 - blend) + accent[index] * blend
          );
          addParticle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            particleColor, life, 2.0 + Math.random() * 2.3,
            82 + Math.random() * 42, 0.986,
            Math.random() < 0.075
          );
        }

        // Small colored shells are carried outward by the large flower.
        // They wait briefly in flight, then create their own miniature bursts.
        // Keep plenty of classic single-burst fireworks; some contain extra mini flowers.
        if (Math.random() < 0.48) {
          const embeddedCount = 2 + Math.floor(Math.random() * 3);
          const embeddedRotation = Math.random() * Math.PI * 2;
          for (let i = 0; i < embeddedCount; i++) {
            const angle = embeddedRotation + (i / embeddedCount) * Math.PI * 2
              + (Math.random() - 0.5) * 0.42;
            const speed = 48 + Math.random() * 58;
            const miniColor = Math.random() < 0.72
              ? color
              : palette[Math.floor(Math.random() * palette.length)];
            miniShells.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              fuse: 0.52 + Math.random() * 0.42,
              color: miniColor,
              trailTimer: 0
            });
          }
        }

        // Fine golden sparks add a second, delicate layer to each explosion.
        const glitterCount = 35 + Math.floor(Math.random() * 35);
        for (let i = 0; i < glitterCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 35 + Math.random() * 155;
          addParticle(
            x, y, Math.cos(angle) * speed, Math.sin(angle) * speed,
            [1.0, 0.82 + Math.random() * 0.16, 0.48],
            1.5 + Math.random() * 1.4, 1.1 + Math.random() * 1.5,
            105, 0.978
          );
        }
      }

      function update(dt) {
        for (let i = miniShells.length - 1; i >= 0; i--) {
          const shell = miniShells[i];
          shell.fuse -= dt;
          shell.trailTimer -= dt;
          shell.vx *= Math.pow(0.992, dt * 60);
          shell.vy *= Math.pow(0.992, dt * 60);
          shell.vy += 34 * dt;
          shell.x += shell.vx * dt;
          shell.y += shell.vy * dt;

          if (shell.trailTimer <= 0) {
            addParticle(
              shell.x, shell.y,
              (Math.random() - 0.5) * 12,
              12 + Math.random() * 24,
              shell.color, 0.22 + Math.random() * 0.16,
              1.4 + Math.random() * 1.1, 35, 0.94
            );
            shell.trailTimer = 0.035;
          }

          if (shell.fuse <= 0) {
            miniBurst(shell.x, shell.y, shell.color);
            miniShells.splice(i, 1);
          }
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const rocket = rockets[i];
          rocket.trailTimer -= dt;
          rocket.vy += 22 * dt;
          rocket.x += rocket.vx * dt;
          rocket.y += rocket.vy * dt;
          if (rocket.trailTimer <= 0) {
            // A dense, warm spark trail makes the rocket's upward path readable.
            addParticle(
              rocket.x + (Math.random() - 0.5) * 5,
              rocket.y + 3,
              (Math.random() - 0.5) * 30,
              75 + Math.random() * 85,
              Math.random() < 0.45 ? [1.0, 0.88, 0.58] : rocket.color,
              0.34 + Math.random() * 0.24,
              2.0 + Math.random() * 1.8,
              75, 0.93
            );
            rocket.trailTimer = 0.012;
          }
          if (rocket.y <= rocket.targetY || rocket.vy >= -35) {
            burst(rocket.x, rocket.y, rocket.color);
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            if (p.split) secondaryBurst(p.x, p.y, p.color);
            particles.splice(i, 1);
            continue;
          }
          if (p.trail) {
            p.trailTimer -= dt;
            if (p.trailTimer <= 0) {
              addParticle(
                p.x, p.y,
                (Math.random() - 0.5) * 9,
                10 + Math.random() * 22,
                p.color, 0.48 + Math.random() * 0.28,
                1.7 + Math.random() * 1.0,
                115, 0.965
              );
              p.trailTimer = 0.045;
            }
          }
          p.vx *= Math.pow(p.drag, dt * 60);
          p.vy *= Math.pow(p.drag, dt * 60);
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
      }

      function render() {
        let vertexCount = 0;
        for (let i = 0; i < particles.length && vertexCount < capacity; i++) {
          const p = particles[i];
          const fade = Math.pow(Math.max(0, p.life / p.maxLife), 0.72);
          const flicker = 0.78 + Math.sin(p.life * 24 + p.twinkle) * 0.22;
          const alpha = fade * flicker;
          const offset = vertexCount * stride;
          vertexData[offset] = p.x;
          vertexData[offset + 1] = p.y;
          vertexData[offset + 2] = p.size * (0.65 + fade * 0.55);
          vertexData[offset + 3] = p.color[0];
          vertexData[offset + 4] = p.color[1];
          vertexData[offset + 5] = p.color[2];
          vertexData[offset + 6] = alpha;
          vertexCount++;
        }

        // Render rising rockets and the small shells travelling inside each burst.
        const glowingObjects = rockets.concat(miniShells);
        for (let i = 0; i < glowingObjects.length && vertexCount + 2 <= capacity; i++) {
          const rocket = glowingObjects[i];
          let offset = vertexCount * stride;
          vertexData[offset] = rocket.x;
          vertexData[offset + 1] = rocket.y;
          vertexData[offset + 2] = 15;
          vertexData[offset + 3] = rocket.color[0];
          vertexData[offset + 4] = rocket.color[1];
          vertexData[offset + 5] = rocket.color[2];
          vertexData[offset + 6] = 0.9;
          vertexCount++;

          offset = vertexCount * stride;
          vertexData[offset] = rocket.x;
          vertexData[offset + 1] = rocket.y;
          vertexData[offset + 2] = 6;
          vertexData[offset + 3] = 1;
          vertexData[offset + 4] = 0.97;
          vertexData[offset + 5] = 0.82;
          vertexData[offset + 6] = 1;
          vertexCount++;
        }

        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertexData.subarray(0, vertexCount * stride));
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
      }

      function frame(timestamp) {
        const now = timestamp * 0.001;
        const dt = Math.min(0.032, lastTime ? now - lastTime : 0.016);
        lastTime = now;
        nextLaunch -= dt;
        if (nextLaunch <= 0) {
          launch();
          if (Math.random() < 0.28) {
            launch(width * (0.18 + Math.random() * 0.64), height * (0.25 + Math.random() * 0.24));
          }
          nextLaunch = 0.62 + Math.random() * 0.72;
        }
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      canvas.addEventListener('pointerdown', event => {
        launch(event.clientX, Math.max(height * 0.12, event.clientY));
      });

      // A few opening bursts make the scene feel alive immediately.
      launch(width * 0.32, height * 0.32);
      setTimeout(() => launch(width * 0.68, height * 0.25), 420);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
