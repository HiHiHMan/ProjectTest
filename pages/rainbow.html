<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Rainbow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #08090d;
    }
    .rainbow-wrap {
      width: min(82vw, 720px);
      aspect-ratio: 2 / 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .rainbow-band {
      fill: none;
      stroke-width: 17;
      stroke-linecap: butt;
    }
    @media (max-width: 600px) {
      .rainbow-wrap { width: 88vw; }
      .rainbow-band { stroke-width: 14; }
    }
  </style>
</head>
<body>
  <main class="rainbow-wrap" aria-label="สายรุ้งครึ่งวงกลม">
    <svg viewBox="0 0 720 360" role="img" aria-label="สายรุ้ง 10 สี">
      <path class="rainbow-band" d="M 18 360 A 342 342 0 0 1 702 360" stroke="#2A1B4E"/>
      <path class="rainbow-band" d="M 36 360 A 324 324 0 0 1 684 360" stroke="#9C6ADE"/>
      <path class="rainbow-band" d="M 54 360 A 306 306 0 0 1 666 360" stroke="#78A2F2"/>
      <path class="rainbow-band" d="M 72 360 A 288 288 0 0 1 648 360" stroke="#D9B96F"/>
      <path class="rainbow-band" d="M 90 360 A 270 270 0 0 1 630 360" stroke="#FF94B8"/>
      <path class="rainbow-band" d="M 108 360 A 252 252 0 0 1 612 360" stroke="#FF8C42"/>
      <path class="rainbow-band" d="M 126 360 A 234 234 0 0 1 594 360" stroke="#FF4FA3"/>
      <path class="rainbow-band" d="M 144 360 A 216 216 0 0 1 576 360" stroke="#D6A94F"/>
      <path class="rainbow-band" d="M 162 360 A 198 198 0 0 1 558 360" stroke="#287BFF"/>
      <path class="rainbow-band" d="M 180 360 A 180 180 0 0 1 540 360" stroke="#123A9C"/>
    </svg>
  </main>
</body>
</html>
