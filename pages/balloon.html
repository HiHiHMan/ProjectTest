<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d20">
  <title>Balloon Bouquet</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;display:grid;place-items:center;color:#fff;background:radial-gradient(ellipse at 50% 38%,rgba(63,73,133,.34),transparent 48%),radial-gradient(circle at 18% 20%,rgba(255,151,190,.10),transparent 24%),linear-gradient(160deg,#11172f 0%,#090d20 58%,#050711 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .scene{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:420px;isolation:isolate}
    .glow{position:absolute;width:min(72vw,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(153,164,255,.15),rgba(153,164,255,.035) 48%,transparent 72%);filter:blur(12px);pointer-events:none}
    .heading{position:absolute;top:clamp(30px,8vh,76px);z-index:3;text-align:center;letter-spacing:.22em;font-size:clamp(11px,1.8vw,14px);font-weight:500;color:rgba(255,255,255,.68)}
    .heading strong{display:block;margin-top:10px;color:#fff;font-size:clamp(23px,4vw,36px);font-weight:400;letter-spacing:.08em}
    .bouquet{position:relative;width:min(88vw,560px);height:min(78vh,650px);min-height:390px;max-height:650px;margin-top:5vh;animation:bouquet-float 5.5s ease-in-out infinite}
    .strings{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
    .strings path{fill:none;stroke:rgba(230,235,255,.72);stroke-width:1.25;stroke-linecap:round}
    .balloon{--color:#ff6f91;position:absolute;z-index:2;width:22%;height:25%;border-radius:50% 50% 47% 47% / 43% 43% 57% 57%;background:radial-gradient(ellipse at 29% 23%,rgba(255,255,255,.9) 0 1.8%,rgba(255,255,255,.42) 3.5%,transparent 18%),radial-gradient(ellipse at 34% 30%,rgba(255,255,255,.22),transparent 36%),linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.025) 35%,rgba(0,0,0,.08) 72%,rgba(0,0,0,.2)),color-mix(in srgb,var(--color) 48%,transparent);backdrop-filter:blur(1.2px) saturate(1.35);-webkit-backdrop-filter:blur(1.2px) saturate(1.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset -9px -13px 18px rgba(0,0,0,.12),inset 5px 5px 13px rgba(255,255,255,.2),0 10px 22px rgba(0,0,0,.13);transform-origin:50% 100%;animation:balloon-sway var(--duration,4.5s) ease-in-out var(--delay,0s) infinite alternate}
    .balloon::before{content:"";position:absolute;left:50%;bottom:-9px;width:13px;height:13px;background:var(--color);clip-path:polygon(0 0,100% 0,50% 100%);transform:translateX(-50%);filter:brightness(.88)}
    .balloon-flower{position:absolute;z-index:1;left:50%;top:49%;transform:translate(-50%,-50%);font-size:clamp(23px,4.2vw,38px);line-height:1;opacity:.92;filter:drop-shadow(0 1px 2px rgba(20,12,35,.28));pointer-events:none;white-space:nowrap}
    .balloon::after{content:"";position:absolute;left:24%;top:15%;width:13%;height:27%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,0));transform:rotate(24deg);filter:blur(1px)}
    .b1{--color:#ff668c;left:13%;top:27%;width:23%;height:27%;--duration:4.8s;--delay:-1s}
    .b2{--color:#ffc857;left:37%;top:9%;width:24%;height:28%;--duration:5.2s;--delay:-2.2s}
    .b3{--color:#8b83ff;left:63%;top:25%;width:23%;height:27%;--duration:4.4s;--delay:-.7s}
    .b4{--color:#45d6c5;left:4%;top:52%;width:21%;height:25%;--duration:5.5s;--delay:-3s}
    .b5{--color:#ff8b5e;left:27%;top:39%;width:25%;height:29%;--duration:4.7s;--delay:-1.8s}
    .b6{--color:#e98bd7;left:51%;top:41%;width:25%;height:29%;--duration:5.1s;--delay:-2.6s}
    .b7{--color:#69a9ff;left:76%;top:52%;width:20%;height:24%;--duration:4.6s;--delay:-1.3s}
    .b8{--color:#ffb3c7;left:39%;top:61%;width:21%;height:25%;--duration:5.3s;--delay:-3.5s}
    .tie{position:absolute;z-index:3;left:50%;top:83%;width:30px;height:22px;transform:translateX(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
    .tie::before,.tie::after{content:"";position:absolute;top:1px;width:17px;height:15px;border:2px solid #f6b8ca;border-radius:80% 20% 70% 30%}
    .tie::before{left:0;transform:rotate(24deg)}
    .tie::after{right:0;transform:scaleX(-1) rotate(24deg)}
    .tie span{position:absolute;left:50%;top:7px;width:7px;height:7px;border-radius:50%;background:#ffd8e3;transform:translateX(-50%)}
    .ribbon{position:absolute;left:50%;top:85%;width:2px;height:10%;background:linear-gradient(#f6b8ca,transparent);transform:translateX(-50%) rotate(2deg);transform-origin:top}
    .caption{position:absolute;bottom:clamp(24px,5vh,48px);z-index:3;color:rgba(255,255,255,.58);font-size:12px;letter-spacing:.12em;text-align:center}
    @keyframes balloon-sway{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-9px)}}
    @keyframes bouquet-float{0%,100%{translate:0 5px}50%{translate:0 -9px}}
    @media(max-width:520px){.bouquet{width:96vw;height:min(72vh,570px);min-height:350px}.balloon{box-shadow:inset -6px -9px 14px rgba(0,0,0,.13),inset 4px 4px 10px rgba(255,255,255,.18),0 8px 17px rgba(0,0,0,.18)}.heading{top:7vh}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>
</head>
<body>
  <main class="scene" aria-label="ช่อลูกโป่งหลากสี">
    <div class="glow" aria-hidden="true"></div>
    <header class="heading">A LITTLE BUNDLE OF JOY<strong>Balloon Bouquet</strong></header>
    <div class="bouquet" aria-hidden="true">
      <svg class="strings" viewBox="0 0 560 650" preserveAspectRatio="none">
        <path d="M137 350 C145 430 210 500 280 555"/>
        <path d="M274 240 C275 360 265 475 280 555"/>
        <path d="M417 340 C405 425 350 500 280 555"/>
        <path d="M218 445 C225 495 250 530 280 555"/>
        <path d="M358 455 C350 505 315 535 280 555"/>
        <path d="M280 565 C280 590 286 612 280 635"/>
      </svg>
      <div class="balloon b1"><span class="balloon-flower">🌸</span></div>
      <div class="balloon b2"><span class="balloon-flower">🌸</span></div>
      <div class="balloon b3"><span class="balloon-flower">🌸</span></div>
      <div class="balloon b5"><span class="balloon-flower">🌸</span></div>
      <div class="balloon b6"><span class="balloon-flower">🌸</span></div>
      <div class="tie"><span></span></div><div class="ribbon"></div>
    </div>
    <p class="caption">A COLORFUL MOMENT, JUST FOR YOU</p>
  </main>
</body>
</html>
