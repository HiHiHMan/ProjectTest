<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050609">
<title>เลือกทรงเมฆ 10 แบบ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08090d;color:#f3f3f6;font-family:Arial,"Tahoma",sans-serif}
body{padding:32px 22px 48px}
main{width:min(1440px,100%);margin:auto}
header{margin:0 0 25px}
h1{font-size:clamp(24px,3vw,36px);margin:0 0 8px;font-weight:650}
header p{margin:0;color:#9b9da8;font-size:14px}
.selection{position:sticky;top:10px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0;padding:12px 16px;border:1px solid #292b35;border-radius:12px;background:#11131beF;backdrop-filter:blur(12px)}
.selection strong{font-size:14px}
.selection span{font-size:13px;color:#aeb0bc}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.option{min-width:0;padding:8px;border:1px solid #282a34;border-radius:13px;background:#11131a;cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.option:hover{transform:translateY(-3px);border-color:#666b7d}
.option.selected{border-color:#c5c9dc;background:#1a1d29;box-shadow:0 0 0 1px #c5c9dc55}
.scene{height:166px;position:relative;overflow:hidden;border-radius:8px;background:#020306;isolation:isolate}
.scene:before{content:"";position:absolute;inset:0;opacity:.52;background-image:radial-gradient(1px 1px at 15% 24%,#fff 98%,transparent),radial-gradient(1px 1px at 78% 20%,#c8c8df 98%,transparent),radial-gradient(1px 1px at 64% 72%,#fff 98%,transparent),radial-gradient(1px 1px at 30% 78%,#c8c8df 98%,transparent),radial-gradient(1px 1px at 91% 54%,#fff 98%,transparent)}
.cloud{position:absolute;left:50%;top:49%;width:78%;height:92px;transform:translate(-50%,-50%);filter:blur(2px);opacity:.86}
.cloud:before,.cloud:after{content:"";position:absolute;inset:0;background-repeat:no-repeat}
.cloud:before{background-image:var(--puffs);background-size:100% 100%}
.cloud:after{inset:26px 7% 0;background:var(--base,#c9cbd4);border-radius:50%;filter:blur(13px);opacity:.45}
.cloud:before{filter:drop-shadow(0 0 9px #c8cbd733)}
.shape-1{--puffs:radial-gradient(ellipse 17% 54% at 12% 66%,#d5d6df 96%,transparent),radial-gradient(ellipse 19% 70% at 29% 49%,#e2e3e9 96%,transparent),radial-gradient(ellipse 20% 76% at 48% 42%,#c9cbd5 96%,transparent),radial-gradient(ellipse 18% 65% at 66% 53%,#e0e1e8 96%,transparent),radial-gradient(ellipse 16% 53% at 85% 66%,#c7c9d2 96%,transparent)}
.shape-2{--puffs:radial-gradient(ellipse 15% 45% at 8% 70%,#c9cbd4 96%,transparent),radial-gradient(ellipse 17% 76% at 23% 45%,#e1e2e9 96%,transparent),radial-gradient(ellipse 14% 52% at 38% 65%,#c7c9d2 96%,transparent),radial-gradient(ellipse 21% 84% at 54% 37%,#e3e4eb 96%,transparent),radial-gradient(ellipse 16% 58% at 72% 58%,#c9cbd5 96%,transparent),radial-gradient(ellipse 15% 70% at 90% 49%,#dedfe7 96%,transparent)}
.shape-3{--puffs:radial-gradient(ellipse 21% 65% at 14% 57%,#d2d4dd 96%,transparent),radial-gradient(ellipse 24% 83% at 36% 42%,#e4e5eb 96%,transparent),radial-gradient(ellipse 23% 78% at 60% 47%,#c9cbd5 96%,transparent),radial-gradient(ellipse 20% 63% at 83% 60%,#dedfe7 96%,transparent)}
.shape-4{--puffs:radial-gradient(ellipse 13% 42% at 9% 69%,#c8cad3 96%,transparent),radial-gradient(ellipse 18% 78% at 25% 40%,#e1e2e9 96%,transparent),radial-gradient(ellipse 13% 48% at 39% 67%,#c7c9d2 96%,transparent),radial-gradient(ellipse 19% 78% at 54% 40%,#e4e5eb 96%,transparent),radial-gradient(ellipse 14% 50% at 69% 68%,#c8cad3 96%,transparent),radial-gradient(ellipse 18% 76% at 84% 43%,#dedfe7 96%,transparent)}
.shape-5{--puffs:radial-gradient(ellipse 23% 68% at 17% 57%,#d4d5de 96%,transparent),radial-gradient(ellipse 18% 54% at 35% 65%,#c7c9d2 96%,transparent),radial-gradient(ellipse 25% 88% at 52% 34%,#e4e5eb 96%,transparent),radial-gradient(ellipse 19% 61% at 72% 57%,#c9cbd5 96%,transparent),radial-gradient(ellipse 15% 47% at 90% 70%,#dedfe7 96%,transparent)}
.shape-6{--puffs:radial-gradient(ellipse 17% 74% at 10% 45%,#e0e1e8 96%,transparent),radial-gradient(ellipse 22% 60% at 28% 66%,#c9cbd4 96%,transparent),radial-gradient(ellipse 17% 82% at 46% 39%,#e5e6ec 96%,transparent),radial-gradient(ellipse 22% 68% at 65% 62%,#c7c9d2 96%,transparent),radial-gradient(ellipse 17% 74% at 86% 43%,#dedfe7 96%,transparent)}
.shape-7{--puffs:radial-gradient(ellipse 25% 76% at 12% 63%,#c9cbd4 96%,transparent),radial-gradient(ellipse 15% 49% at 30% 40%,#e3e4ea 96%,transparent),radial-gradient(ellipse 25% 85% at 49% 51%,#d2d4dd 96%,transparent),radial-gradient(ellipse 16% 54% at 69% 40%,#e4e5eb 96%,transparent),radial-gradient(ellipse 23% 73% at 88% 62%,#c7c9d2 96%,transparent)}
.shape-8{--puffs:radial-gradient(ellipse 13% 58% at 8% 58%,#d5d6df 96%,transparent),radial-gradient(ellipse 21% 80% at 25% 39%,#e4e5eb 96%,transparent),radial-gradient(ellipse 17% 62% at 43% 65%,#c7c9d2 96%,transparent),radial-gradient(ellipse 24% 88% at 62% 38%,#dedfe7 96%,transparent),radial-gradient(ellipse 17% 58% at 81% 62%,#c9cbd5 96%,transparent),radial-gradient(ellipse 11% 43% at 96% 48%,#e1e2e9 96%,transparent)}
.shape-9{--puffs:radial-gradient(ellipse 19% 57% at 11% 68%,#c9cbd4 96%,transparent),radial-gradient(ellipse 23% 77% at 30% 44%,#e2e3e9 96%,transparent),radial-gradient(ellipse 16% 52% at 48% 66%,#c7c9d2 96%,transparent),radial-gradient(ellipse 22% 80% at 66% 39%,#e5e6ec 96%,transparent),radial-gradient(ellipse 18% 59% at 86% 64%,#c9cbd5 96%,transparent)}
.shape-10{--puffs:radial-gradient(ellipse 18% 80% at 9% 42%,#e2e3e9 96%,transparent),radial-gradient(ellipse 25% 70% at 27% 64%,#c8cad3 96%,transparent),radial-gradient(ellipse 19% 92% at 47% 35%,#e5e6ec 96%,transparent),radial-gradient(ellipse 25% 70% at 68% 62%,#c7c9d2 96%,transparent),radial-gradient(ellipse 18% 78% at 90% 43%,#dedfe7 96%,transparent)}
.option-label{display:flex;justify-content:space-between;align-items:center;padding:10px 3px 3px;font-size:14px;font-weight:600}
.option-label small{font-size:11px;color:#8d909d;font-weight:400}
button{border:1px solid #55596a;border-radius:8px;padding:9px 13px;background:#222532;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#303448}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){body{padding:22px 13px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scene{height:130px}.selection{align-items:flex-start;flex-direction:column}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.scene{height:160px}}

/* Larger, sharper previews so the cloud connections are easy to compare */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.option{padding:12px}
.scene{height:270px;background:radial-gradient(ellipse at 50% 55%,#10131c 0%,#020306 72%)}
.scene:before{opacity:.72}
.cloud{width:88%;height:190px;top:50%;filter:blur(.6px);opacity:1}
.cloud:before{filter:drop-shadow(0 0 12px #d9dced55)}
.cloud:after{inset:48px 3% 5px;background:linear-gradient(180deg,#e0e1e9 0%,#bfc2ce 70%,#aeb2c0 100%);border-radius:48% 52% 45% 50%;filter:blur(9px);opacity:.88}
.option-label{padding:13px 5px 4px;font-size:17px}
.option-label small{font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr;gap:16px}.scene{height:250px}.cloud{width:90%;height:180px}}
@media(max-width:480px){body{padding:18px 10px 28px}.scene{height:205px}.cloud{height:155px}.option{padding:9px}}
</style>
</head>
<body>
<main>
<header>
<h1>เลือกทรงเมฆที่ชอบ</h1>
<p>ตัวอย่างเมฆ 10 รูปแบบ — เน้นรูปทรงและตำแหน่งที่ก้อนเมฆเชื่อมติดกัน</p>
</header>
<div class="selection" aria-live="polite">
<div><strong id="selected-title">ยังไม่ได้เลือกแบบ</strong> <span id="selected-hint">กดเลือกการ์ดที่ชอบได้เลย</span></div>
<button id="clear-selection" type="button">ล้างการเลือก</button>
</div>
<section class="grid" aria-label="ตัวอย่างทรงเมฆ 10 แบบ">
<button class="option" type="button" data-option="1" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-1"></div></div>
<div class="option-label"><span>แบบที่ 1</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="2" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-2"></div></div>
<div class="option-label"><span>แบบที่ 2</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="3" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-3"></div></div>
<div class="option-label"><span>แบบที่ 3</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="4" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-4"></div></div>
<div class="option-label"><span>แบบที่ 4</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="5" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-5"></div></div>
<div class="option-label"><span>แบบที่ 5</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="6" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-6"></div></div>
<div class="option-label"><span>แบบที่ 6</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="7" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-7"></div></div>
<div class="option-label"><span>แบบที่ 7</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="8" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-8"></div></div>
<div class="option-label"><span>แบบที่ 8</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="9" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-9"></div></div>
<div class="option-label"><span>แบบที่ 9</span><small>เลือกแบบนี้</small></div>
</button>
<button class="option" type="button" data-option="10" aria-pressed="false" style="text-align:left;color:inherit">
<div class="scene"><div class="cloud shape-10"></div></div>
<div class="option-label"><span>แบบที่ 10</span><small>เลือกแบบนี้</small></div>
</button>
</section>
</main>
<script>
const cards=[...document.querySelectorAll('.option')];
const title=document.querySelector('#selected-title');
const hint=document.querySelector('#selected-hint');
cards.forEach(card=>card.addEventListener('click',()=>{
  cards.forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-pressed','false')});
  card.classList.add('selected');
  card.setAttribute('aria-pressed','true');
  title.textContent='คุณเลือกแบบที่ '+card.dataset.option;
  hint.textContent='แจ้งหมายเลขนี้เพื่อใช้กับหน้า Dream Star';
}));
document.querySelector('#clear-selection').addEventListener('click',()=>{
  cards.forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-pressed','false')});
  title.textContent='ยังไม่ได้เลือกแบบ';
  hint.textContent='กดเลือกการ์ดที่ชอบได้เลย';
});
</script>
</body>
</html>
