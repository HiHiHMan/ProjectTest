<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090503">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090503; color: #f8e6d2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .scene {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 100%, #57200b 0%, #1c0b05 35%, #090503 76%);
    }
    .fire-stage {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: min(200px, calc(100vw - 32px));
      aspect-ratio: 1; transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 22px rgb(255 91 12 / 28%));
    }
    #pixel-fire {
      display: block; width: 100%; height: 100%;
      image-rendering: auto;
    }
    .heat {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%, rgb(255 105 18 / 22%), transparent 48%),
                  linear-gradient(0deg, rgb(10 4 1 / 30%), transparent 40%);
      animation: heat-flicker 1.3s steps(5, end) infinite;
    }
    .vignette {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgb(0 0 0 / 54%) 100%);
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 3;
      padding: 10px 15px; border: 1px solid rgb(255 207 163 / 20%);
      border-radius: 999px; background: rgb(15 8 4 / 48%);
      color: #f3d2b3; text-decoration: none; font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: .2s ease;
    }
    .back:hover { border-color: rgb(255 173 104 / 60%); background: rgb(50 20 8 / 70%); }
    .title {
      position: fixed; z-index: 2; top: 9%; left: 0; width: 100%;
      text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgb(255 105 24 / 35%);
    }
    h1 { margin: 0; color: #ffe3c5; font-size: clamp(22px, 4vw, 44px); font-weight: 500; letter-spacing: .42em; text-indent: .42em; }
    .subtitle { margin: 13px 0 0; color: rgb(255 202 158 / 58%); font-size: 9px; letter-spacing: .3em; }
    @keyframes heat-flicker {
      0%, 100% { opacity: .48; }
      35% { opacity: .9; }
      62% { opacity: .62; }
      78% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .back { top: 17px; left: 17px; }
      .title { top: 13%; }
      h1 { font-size: 22px; letter-spacing: .3em; }
      .subtitle { font-size: 8px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .heat { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="fire-stage">
      <canvas id="pixel-fire" width="200" height="200" aria-hidden="true"></canvas>
    </div>
    <div class="heat"></div>
    <div class="vignette"></div>
  </main>
  <a class="back" href="../index.html">← Experiments</a>
  <header class="title">
    <h1>FIRE</h1>
    <p class="subtitle">A STUDY OF LIGHT · HEAT · MOTION</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('pixel-fire');
      const ctx = canvas.getContext('2d');
      const size = 240;
      canvas.width = canvas.height = size;

      const source = new Image();
      const surface = document.createElement('canvas');
      surface.width = surface.height = size;
      const surfaceCtx = surface.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let ready = false;
      let sourceWidth = 0;
      let sourceHeight = 0;
      let sourceX = 0;
      let sourceY = 0;

      source.onload = () => {
        // Find the actual non-transparent flame pixels, excluding the empty
        // padding around the artwork so the complete flame can be fitted.
        const scan = document.createElement('canvas');
        scan.width = source.naturalWidth;
        scan.height = source.naturalHeight;
        const scanCtx = scan.getContext('2d', { willReadFrequently: true });
        scanCtx.drawImage(source, 0, 0);
        const data = scanCtx.getImageData(0, 0, scan.width, scan.height).data;

        let minX = scan.width, minY = scan.height, maxX = -1, maxY = -1;
        for (let y = 0; y < scan.height; y++) {
          for (let x = 0; x < scan.width; x++) {
            if (data[(y * scan.width + x) * 4 + 3] > 8) {
              minX = Math.min(minX, x);
              minY = Math.min(minY, y);
              maxX = Math.max(maxX, x);
              maxY = Math.max(maxY, y);
            }
          }
        }

        if (maxX < minX || maxY < minY) return;

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const fitScale = Math.min(150 / cropW, 220 / cropH);
        sourceWidth = cropW * fitScale;
        sourceHeight = cropH * fitScale;
        sourceX = (size - sourceWidth) / 2;
        sourceY = (size - sourceHeight) / 2 + 2;

        surfaceCtx.clearRect(0, 0, size, size);
        surfaceCtx.imageSmoothingEnabled = true;
        surfaceCtx.imageSmoothingQuality = 'high';
        surfaceCtx.drawImage(
          source,
          minX, minY, cropW, cropH,
          sourceX, sourceY, sourceWidth, sourceHeight
        );

        ready = true;
        drawFrame(0);
        if (!reduceMotion) requestAnimationFrame(animate);
      };

      source.onerror = () => {
        console.error('Unable to load images/fire.png');
      };
      source.src = '../images/fire.png';

      function drawFrame(timestamp) {
        if (!ready) return;
        const t = reduceMotion ? 0 : timestamp * 0.001;
        ctx.clearRect(0, 0, size, size);

        // Deform the original flame silhouette in flowing horizontal bands.
        // Its original outline and color regions remain the source of the fire.
        const bands = Math.ceil(sourceHeight);
        for (let row = 0; row < bands; row++) {
          const q = 1 - row / sourceHeight; // 1 at the tip, 0 at the base
          const tipWeight = Math.pow(Math.max(0, q), 1.7);
          const midWeight = Math.sin(Math.PI * Math.min(1, Math.max(0, q)));

          const broadSway = Math.sin(t * 2.1 - q * 4.8) * 10 * tipWeight;
          const quickFlick = Math.sin(t * 5.8 - q * 13.5 + 0.7) * 5.5 * tipWeight;
          const smallRipple = Math.sin(t * 3.7 - q * 9.0 + 1.9) * 2.2 * midWeight;
          const shift = broadSway + quickFlick + smallRipple;

          const breathing = 1
            + Math.sin(t * 2.4 - q * 5.2) * 0.075 * midWeight
            + Math.sin(t * 4.6 - q * 11.0) * 0.035 * tipWeight;
          const pinch = 1 - 0.045 * Math.max(0, Math.sin(t * 3.0 - q * 8.0)) * tipWeight;
          const drawWidth = sourceWidth * breathing * pinch;
          const drawX = sourceX + (sourceWidth - drawWidth) / 2 + shift;

          const sy = sourceY + row;
          const dy = sourceY + row + Math.sin(t * 3.0 - q * 7.0) * 1.2 * tipWeight;
          const safeX = Math.max(2, Math.min(size - drawWidth - 2, drawX));

          ctx.drawImage(
            surface,
            sourceX, sy, sourceWidth, 1.5,
            safeX, dy, Math.min(drawWidth, size - safeX - 2), 1.5
          );
        }
      }

      function animate(timestamp) {
        drawFrame(timestamp);
        requestAnimationFrame(animate);
      }
    })();
  </script>
</body>
</html>
