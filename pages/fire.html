<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090503">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090503; color: #f8e6d2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .scene {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 100%, #57200b 0%, #1c0b05 35%, #090503 76%);
    }
    .fire-stage {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: min(200px, calc(100vw - 32px));
      aspect-ratio: 1; transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 22px rgb(255 91 12 / 28%));
    }
    #pixel-fire {
      display: block; width: 100%; height: 100%;
      image-rendering: auto;
    }
    .heat {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%, rgb(255 105 18 / 22%), transparent 48%),
                  linear-gradient(0deg, rgb(10 4 1 / 30%), transparent 40%);
      animation: heat-flicker 1.3s steps(5, end) infinite;
    }
    .vignette {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgb(0 0 0 / 54%) 100%);
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 3;
      padding: 10px 15px; border: 1px solid rgb(255 207 163 / 20%);
      border-radius: 999px; background: rgb(15 8 4 / 48%);
      color: #f3d2b3; text-decoration: none; font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: .2s ease;
    }
    .back:hover { border-color: rgb(255 173 104 / 60%); background: rgb(50 20 8 / 70%); }
    .title {
      position: fixed; z-index: 2; top: 9%; left: 0; width: 100%;
      text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgb(255 105 24 / 35%);
    }
    h1 { margin: 0; color: #ffe3c5; font-size: clamp(22px, 4vw, 44px); font-weight: 500; letter-spacing: .42em; text-indent: .42em; }
    .subtitle { margin: 13px 0 0; color: rgb(255 202 158 / 58%); font-size: 9px; letter-spacing: .3em; }
    @keyframes heat-flicker {
      0%, 100% { opacity: .48; }
      35% { opacity: .9; }
      62% { opacity: .62; }
      78% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .back { top: 17px; left: 17px; }
      .title { top: 13%; }
      h1 { font-size: 22px; letter-spacing: .3em; }
      .subtitle { font-size: 8px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .heat { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="fire-stage">
      <canvas id="pixel-fire" width="200" height="200" aria-hidden="true"></canvas>
    </div>
    <div class="heat"></div>
    <div class="vignette"></div>
  </main>
  <a class="back" href="../index.html">← Experiments</a>
  <header class="title">
    <h1>FIRE</h1>
    <p class="subtitle">A STUDY OF LIGHT · HEAT · MOTION</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('pixel-fire');
      const ctx = canvas.getContext('2d');
      const source = new Image();
      const outputSize = 200;
      const surface = document.createElement('canvas');
      surface.width = surface.height = outputSize;
      const surfaceCtx = surface.getContext('2d');
      let ready = false;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      source.src = '../images/fire.png';
      source.onload = () => {
        const scale = outputSize / Math.max(source.naturalWidth, source.naturalHeight);
        const width = source.naturalWidth * scale;
        const height = source.naturalHeight * scale;
        const x = (outputSize - width) / 2;
        const y = (outputSize - height) / 2;

        surfaceCtx.clearRect(0, 0, outputSize, outputSize);
        surfaceCtx.imageSmoothingEnabled = true;
        surfaceCtx.imageSmoothingQuality = 'high';
        surfaceCtx.drawImage(source, x, y, width, height);
        ready = true;

        if (reduceMotion) drawFrame(0);
        else requestAnimationFrame(animate);
      };

      function drawFrame(time) {
        if (!ready) return;
        ctx.clearRect(0, 0, outputSize, outputSize);

        const t = time * 0.001;
        // The lower flame remains steady. A travelling wave accelerates toward
        // the tip, where it bends sharply and releases in quick, uneven swishes.
        for (let y = 0; y < outputSize; y += 1) {
          const heightRatio = 1 - y / outputSize;
          const envelope = Math.pow(heightRatio, 2.15);
          const gust = Math.sin(t * 1.35 + 0.6);
          const wavePhase = t * 3.15 - heightRatio * 3.4 + gust * 0.7;

          const broadBend = Math.sin(wavePhase) * 25 * envelope;
          const quickFlick = Math.sin(t * 7.2 - heightRatio * 7.8 + gust) * 6.5
                           * Math.pow(heightRatio, 2.7);
          const irregularRipple = Math.sin(t * 4.6 - heightRatio * 5.1 + 1.2)
                                * 3.2 * Math.pow(heightRatio, 1.7);
          const snap = Math.pow(Math.max(0, Math.sin(t * 2.05 + 0.4)), 5)
                     * Math.sin(wavePhase * 0.72) * 9 * Math.pow(heightRatio, 2.4);
          const drift = broadBend + quickFlick + irregularRipple + snap;
          const ripple = Math.sin(wavePhase * 0.82) * 1.1 * envelope;

          ctx.drawImage(
            surface,
            0, y, outputSize, 2,
            drift, y + ripple, outputSize, 2
          );
        }
      }

      function animate(timestamp) {
        drawFrame(timestamp);
        requestAnimationFrame(animate);
      }

      source.onerror = () => {
        ctx.fillStyle = '#ff7a18';
        ctx.font = '12px sans-serif';
        ctx.fillText('Fire texture unavailable', 18, 100);
      };
    })();
  </script>
</body>
</html>
