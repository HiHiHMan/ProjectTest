<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 72%, #24100b 0%, #100b0b 34%, #08090d 72%);
      color: #f8eee6;
      font-family: Inter, system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .title {
      position: fixed; top: 34px; left: 0; width: 100%; text-align: center;
      pointer-events: none; z-index: 2;
    }
    .title h1 {
      margin: 0; font-size: clamp(12px, 1.4vw, 16px); font-weight: 500;
      letter-spacing: .42em; text-transform: uppercase; color: #e8c5a5;
      opacity: .72;
    }
    .title p {
      margin: 10px 0 0; font-size: 10px; letter-spacing: .2em;
      text-transform: uppercase; color: #9e7660; opacity: .55;
    }
    .back {
      position: fixed; left: 26px; top: 26px; z-index: 3;
      color: #c9a58e; text-decoration: none; font-size: 11px;
      letter-spacing: .12em; opacity: .65; transition: opacity .2s;
    }
    .back:hover { opacity: 1; }
    @media (max-width: 600px) {
      .title { top: 28px; }
      .back { left: 16px; top: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="fire"></canvas>
  <a class="back" href="../index.html">← PROJECTS</a>
  <header class="title">
    <h1>Fire</h1>
    <p>Flowing in an endless curve</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('fire');
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = 1, particles = [];
      const TAU = Math.PI * 2;
      const rand = (a, b) => a + Math.random() * (b - a);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const amount = Math.min(1500, Math.max(520, Math.round(w * h / 850)));
        particles = Array.from({ length: amount }, () => ({
          t: Math.random(), side: rand(-1, 1), drift: rand(-.12, .12),
          speed: rand(.00065, .0018), size: rand(1, 4.2),
          phase: rand(0, TAU), life: Math.random()
        }));
      }

      // A vertical S-curve: the flame bends left, then sweeps right.
      function curve(t) {
        const y = h * (.89 - t * .72);
        const envelope = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, t))), .48);
        const x = w * .5 + Math.sin(t * TAU * .92 - .25) * Math.min(w * .205, 190) * envelope;
        return { x, y, envelope };
      }

      function drawCore(time) {
        const points = [];
        for (let i = 0; i <= 100; i++) points.push(curve(i / 100));
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const [color, width, blur, alpha] of [
          ['#ff3b08', 72, 48, .12],
          ['#ff5a12', 38, 30, .2],
          ['#ff9a24', 15, 18, .32],
          ['#ffe2a0', 4, 9, .45]
        ]) {
          ctx.beginPath();
          points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.strokeStyle = color; ctx.lineWidth = width;
          ctx.globalAlpha = alpha * (.82 + Math.sin(time * .002 + width) * .18);
          ctx.shadowColor = color; ctx.shadowBlur = blur;
          ctx.stroke();
        }
        ctx.restore();
      }

      function frame(time) {
        ctx.clearRect(0, 0, w, h);
        const glow = ctx.createRadialGradient(w * .5, h * .67, 0, w * .5, h * .67, Math.min(w, h) * .48);
        glow.addColorStop(0, 'rgba(128,42,12,.16)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);

        drawCore(time);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const p of particles) {
          p.t += p.speed * (1 + Math.sin(time * .001 + p.phase) * .12);
          if (p.t > 1) { p.t = 0; p.side = rand(-1, 1); p.size = rand(1, 4.2); p.phase = rand(0, TAU); }
          const t = p.t;
          const base = curve(t);
          const spread = (5 + 25 * base.envelope) * (1 - t * .32);
          const wobble = Math.sin(time * .002 + p.phase + t * 18) * 8;
          const x = base.x + p.side * spread + wobble + p.drift * 55;
          const y = base.y + Math.sin(time * .0015 + p.phase) * 4;
          const size = p.size * (.45 + base.envelope * .8) * (1 - t * .2);
          const hue = 18 + Math.sin(p.phase + time * .0006) * 17;
          const alpha = (.35 + .5 * Math.random()) * (1 - t * .5);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = `hsl(${hue}, 100%, ${t > .78 ? 78 : 58}%)`;
          ctx.shadowColor = t > .72 ? '#ffd98b' : '#ff5a12';
          ctx.shadowBlur = size * 5;
          ctx.beginPath();
          ctx.ellipse(x, y, size * .55, size * (1.2 + Math.random()), -.25, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
