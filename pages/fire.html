<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090503">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090503; color: #f8e6d2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .scene {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 100%, #57200b 0%, #1c0b05 35%, #090503 76%);
    }
    .fire-stage {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: min(200px, calc(100vw - 32px));
      aspect-ratio: 1; transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 22px rgb(255 91 12 / 28%));
    }
    .fire-image {
      display: block; width: 100%; height: 100%; object-fit: contain;
      mix-blend-mode: screen; opacity: .97;
      filter: url(#flame-flow) saturate(1.35) contrast(1.12);
      transform-origin: 50% 88%;
      animation: flame-shape 1.15s ease-in-out infinite alternate;
      will-change: transform;
    }
    .fire-tip {
      position: absolute; inset: 0; overflow: hidden;
      clip-path: inset(0 0 48% 0);
      pointer-events: none;
    }
    .fire-tip img {
      display: block; width: 100%; height: 100%; object-fit: contain;
      mix-blend-mode: screen; opacity: .9;
      filter: url(#flame-tip-flow) saturate(1.35) contrast(1.12);
      transform-origin: 50% 88%;
      animation: flame-tip-waver .62s ease-in-out infinite alternate;
      will-change: transform;
    }
    .heat {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%, rgb(255 105 18 / 22%), transparent 48%),
                  linear-gradient(0deg, rgb(10 4 1 / 30%), transparent 40%);
      animation: heat-flicker 1.3s steps(5, end) infinite;
    }
    .vignette {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgb(0 0 0 / 54%) 100%);
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 3;
      padding: 10px 15px; border: 1px solid rgb(255 207 163 / 20%);
      border-radius: 999px; background: rgb(15 8 4 / 48%);
      color: #f3d2b3; text-decoration: none; font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: .2s ease;
    }
    .back:hover { border-color: rgb(255 173 104 / 60%); background: rgb(50 20 8 / 70%); }
    .title {
      position: fixed; z-index: 2; top: 9%; left: 0; width: 100%;
      text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgb(255 105 24 / 35%);
    }
    h1 { margin: 0; color: #ffe3c5; font-size: clamp(22px, 4vw, 44px); font-weight: 500; letter-spacing: .42em; text-indent: .42em; }
    .subtitle { margin: 13px 0 0; color: rgb(255 202 158 / 58%); font-size: 9px; letter-spacing: .3em; }
    @keyframes flame-shape {
      0% { transform: translate(-2px, 0) scale(.96, 1.02) skewX(-2deg); }
      25% { transform: translate(2px, -1px) scale(1.03, .98) skewX(1.5deg); }
      50% { transform: translate(-1px, 1px) scale(.98, 1.06) skewX(2deg); }
      75% { transform: translate(1px, -1px) scale(1.04, .97) skewX(-1deg); }
      100% { transform: translate(-2px, 0) scale(.97, 1.04) skewX(-2.5deg); }
    }
    @keyframes flame-tip-waver {
      0% { transform: translateX(-5px) rotate(-3deg) skewX(-5deg) scaleX(.96); }
      35% { transform: translateX(4px) rotate(2.5deg) skewX(4deg) scaleX(1.04); }
      70% { transform: translateX(-3px) rotate(-2deg) skewX(-3deg) scaleX(.98); }
      100% { transform: translateX(5px) rotate(3.5deg) skewX(5deg) scaleX(1.05); }
    }
    @keyframes heat-flicker {
      0%, 100% { opacity: .48; }
      35% { opacity: .9; }
      62% { opacity: .62; }
      78% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .back { top: 17px; left: 17px; }
      .title { top: 13%; }
      h1 { font-size: 22px; letter-spacing: .3em; }
      .subtitle { font-size: 8px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fire-image, .fire-tip img, .heat { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="flame-flow" x="-35%" y="-25%" width="170%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="3" result="turbulence">
          <animate attributeName="seed" values="1;5;2;8;3" dur="1.6s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="24" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="18;29;20;32;18" dur="1.1s" repeatCount="indefinite"/>
        </feDisplacementMap>
      </filter>
      <filter id="flame-tip-flow" x="-55%" y="-35%" width="210%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025 0.065" numOctaves="2" seed="7" result="tipNoise">
          <animate attributeName="baseFrequency" values="0.025 0.065;0.038 0.085;0.022 0.058;0.04 0.09;0.025 0.065" dur="1.7s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="tipNoise" scale="34" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="28;46;32;50;28" dur="1.25s" repeatCount="indefinite"/>
        </feDisplacementMap>
      </filter>
    </svg>
    <div class="fire-stage">
      <img class="fire-image" src="../images/fire.png" alt="" aria-hidden="true">
      <div class="fire-tip" aria-hidden="true">
        <img src="../images/fire.png" alt="">
      </div>
    </div>
    <div class="heat"></div>
    <div class="vignette"></div>
  </main>
  <a class="back" href="../index.html">← Experiments</a>
  <header class="title">
    <h1>FIRE</h1>
    <p class="subtitle">A STUDY OF LIGHT · HEAT · MOTION</p>
  </header>
</body>
</html>
