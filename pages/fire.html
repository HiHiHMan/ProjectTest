<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 72%, #24100b 0%, #100b0b 34%, #08090d 72%);
      color: #f8eee6;
      font-family: Inter, system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .title {
      position: fixed; top: 34px; left: 0; width: 100%; text-align: center;
      pointer-events: none; z-index: 2;
    }
    .title h1 {
      margin: 0; font-size: clamp(12px, 1.4vw, 16px); font-weight: 500;
      letter-spacing: .42em; text-transform: uppercase; color: #e8c5a5;
      opacity: .72;
    }
    .title p {
      margin: 10px 0 0; font-size: 10px; letter-spacing: .2em;
      text-transform: uppercase; color: #9e7660; opacity: .55;
    }
    .back {
      position: fixed; left: 26px; top: 26px; z-index: 3;
      color: #c9a58e; text-decoration: none; font-size: 11px;
      letter-spacing: .12em; opacity: .65; transition: opacity .2s;
    }
    .back:hover { opacity: 1; }
    @media (max-width: 600px) {
      .title { top: 28px; }
      .back { left: 16px; top: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="fire"></canvas>
  <a class="back" href="../index.html">← PROJECTS</a>
  <header class="title">
    <h1>Fire</h1>
    <p>Triangular flame · S formation</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('fire');
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = 1, particles = [];
      const TAU = Math.PI * 2;
      const rand = (a, b) => a + Math.random() * (b - a);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const amount = Math.min(1500, Math.max(520, Math.round(w * h / 850)));
        particles = Array.from({ length: amount }, () => ({
          t: Math.random(), side: rand(-1, 1), drift: rand(-.12, .12),
          speed: rand(.00065, .0018), size: rand(1, 4.2),
          phase: rand(0, TAU), life: Math.random()
        }));
      }

      // A vertical S-curve: the flame bends left, then sweeps right.
      function curve(t) {
        const y = h * (.89 - t * .72);
        const envelope = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, t))), .48);
        const x = w * .5 + Math.sin(t * TAU * .92 - .25) * Math.min(w * .205, 190) * envelope;
        return { x, y, envelope };
      }

      function drawTriangle(x, y, size, angle, color, alpha, glow = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
        ctx.beginPath();
        ctx.moveTo(0, -size * 1.25);
        ctx.lineTo(size * .78, size * .72);
        ctx.lineTo(-size * .78, size * .72);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Build the S-shaped flame from layered triangular shards.
      function drawCore(time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 260; i++) {
          const t = (i + .5) / 260;
          const base = curve(t);
          const spread = (8 + 24 * base.envelope) * (1 - t * .22);
          const side = Math.sin(i * 127.1) * .5 + Math.sin(i * 31.7) * .5;
          const x = base.x + side * spread + Math.sin(time * .0018 + i * .73) * 5;
          const y = base.y + Math.cos(time * .0012 + i * .41) * 3;
          const size = (3 + (1 - t) * 5 + (Math.sin(i * 8.3) + 1) * 2) * (.45 + base.envelope * .65);
          const hue = 10 + (Math.sin(i * 2.13 + time * .0007) + 1) * 17;
          const light = 48 + (Math.sin(i * 4.7 + time * .001) + 1) * 18;
          const angle = Math.sin(i * 1.9 + time * .0015) * .42;
          drawTriangle(x, y, size, angle, `hsl(${hue}, 100%, ${light}%)`, .22 + base.envelope * .55, size * 2.8);
        }

        // A few brighter, larger shards define the S silhouette.
        for (let i = 0; i < 42; i++) {
          const t = (i + .5) / 42;
          const base = curve(t);
          const pulse = .8 + Math.sin(time * .003 + i * 1.7) * .2;
          const size = (7 + 7 * base.envelope) * pulse;
          drawTriangle(
            base.x + Math.sin(time * .001 + i) * 4,
            base.y,
            size,
            Math.sin(time * .0017 + i * .6) * .28,
            i % 4 === 0 ? '#ffe5a1' : (i % 2 ? '#ff9a25' : '#ff5414'),
            .62,
            18
          );
        }
        ctx.restore();
      }
      function frame(time) {
        ctx.clearRect(0, 0, w, h);
        const glow = ctx.createRadialGradient(w * .5, h * .67, 0, w * .5, h * .67, Math.min(w, h) * .48);
        glow.addColorStop(0, 'rgba(128,42,12,.16)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);

        drawCore(time);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const p of particles) {
          p.t += p.speed * (1 + Math.sin(time * .001 + p.phase) * .12);
          if (p.t > 1) { p.t = 0; p.side = rand(-1, 1); p.size = rand(1, 4.2); p.phase = rand(0, TAU); }
          const t = p.t;
          const base = curve(t);
          const spread = (5 + 25 * base.envelope) * (1 - t * .32);
          const wobble = Math.sin(time * .002 + p.phase + t * 18) * 8;
          const x = base.x + p.side * spread + wobble + p.drift * 55;
          const y = base.y + Math.sin(time * .0015 + p.phase) * 4;
          const size = p.size * (.45 + base.envelope * .8) * (1 - t * .2);
          const hue = 18 + Math.sin(p.phase + time * .0006) * 17;
          const alpha = (.35 + .5 * Math.random()) * (1 - t * .5);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = `hsl(${hue}, 100%, ${t > .78 ? 78 : 58}%)`;
          ctx.shadowColor = t > .72 ? '#ffd98b' : '#ff5a12';
          ctx.shadowBlur = size * 5;
          drawTriangle(x, y, size * 1.35, Math.sin(time * .002 + p.phase) * .5, ctx.fillStyle, alpha, size * 3);
        }
        ctx.restore();
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
