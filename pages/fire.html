<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090503">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090503; color: #f8e6d2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .scene {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 100%, #57200b 0%, #1c0b05 35%, #090503 76%);
    }
    .fire-stage {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: min(200px, calc(100vw - 32px));
      aspect-ratio: 1; transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 22px rgb(255 91 12 / 28%));
    }
    #pixel-fire {
      display: block; width: 100%; height: 100%;
      image-rendering: auto;
    }
    .heat {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%, rgb(255 105 18 / 22%), transparent 48%),
                  linear-gradient(0deg, rgb(10 4 1 / 30%), transparent 40%);
      animation: heat-flicker 1.3s steps(5, end) infinite;
    }
    .vignette {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgb(0 0 0 / 54%) 100%);
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 3;
      padding: 10px 15px; border: 1px solid rgb(255 207 163 / 20%);
      border-radius: 999px; background: rgb(15 8 4 / 48%);
      color: #f3d2b3; text-decoration: none; font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: .2s ease;
    }
    .back:hover { border-color: rgb(255 173 104 / 60%); background: rgb(50 20 8 / 70%); }
    .title {
      position: fixed; z-index: 2; top: 9%; left: 0; width: 100%;
      text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgb(255 105 24 / 35%);
    }
    h1 { margin: 0; color: #ffe3c5; font-size: clamp(22px, 4vw, 44px); font-weight: 500; letter-spacing: .42em; text-indent: .42em; }
    .subtitle { margin: 13px 0 0; color: rgb(255 202 158 / 58%); font-size: 9px; letter-spacing: .3em; }
    @keyframes heat-flicker {
      0%, 100% { opacity: .48; }
      35% { opacity: .9; }
      62% { opacity: .62; }
      78% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .back { top: 17px; left: 17px; }
      .title { top: 13%; }
      h1 { font-size: 22px; letter-spacing: .3em; }
      .subtitle { font-size: 8px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .heat { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="fire-stage">
      <canvas id="pixel-fire" width="200" height="200" aria-hidden="true"></canvas>
    </div>
    <div class="heat"></div>
    <div class="vignette"></div>
  </main>
  <a class="back" href="../index.html">← Experiments</a>
  <header class="title">
    <h1>FIRE</h1>
    <p class="subtitle">A STUDY OF LIGHT · HEAT · MOTION</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('pixel-fire');
      const ctx = canvas.getContext('2d', { alpha: true });
      const size = 240;
      canvas.width = canvas.height = size;

      const frame = ctx.createImageData(size, size);
      const pixels = frame.data;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Procedural flame: no image texture or fixed source silhouette.
      function smooth(a, b, value) {
        const x = Math.max(0, Math.min(1, (value - a) / (b - a)));
        return x * x * (3 - 2 * x);
      }

      function drawFrame(timestamp) {
        const t = reduceMotion ? 0 : timestamp * 0.001;
        pixels.fill(0);

        for (let y = 0; y < size; y++) {
          const h = (size - 1 - y) / size;
          const rise = Math.max(0, 1 - h);
          const topBreath = 0.94 + 0.035 * Math.sin(t * 2.1) + 0.02 * Math.sin(t * 3.7 + 1.2);
          const flameHeight = size * topBreath - 24;
          const baseY = size - 12;
          const topY = baseY - flameHeight;
          const localY = y - topY;

          if (localY < 0 || localY > flameHeight) continue;

          const q = 1 - localY / flameHeight;
          const bodyTaper = Math.pow(Math.max(0, 1 - q), 0.72);
          // Preserve a visible pointed tip instead of collapsing to zero width.
          const tipTaper = 0.105 * Math.exp(-Math.pow((q - 0.965) / 0.075, 2));
          const taper = Math.max(bodyTaper, tipTaper);
          const flow = t * 2.7 - q * 8.2;

          const sway = Math.sin(flow) * 13 * Math.pow(q, 1.55)
                     + Math.sin(t * 5.3 - q * 15.0 + 0.8) * 5.5 * Math.pow(q, 2.1)
                     + Math.sin(t * 1.4 + q * 5.0) * 2.8;
          const center = size * 0.5 + Math.max(-8, Math.min(8, sway));

          // Several independently moving tongues make the outline split,
          // merge and reform instead of deforming one static flame image.
          const tongueA = Math.sin(t * 3.1 - q * 13.0) * 0.12;
          const tongueB = Math.sin(t * 4.6 - q * 20.0 + 1.7) * 0.075;
          const tongueC = Math.sin(t * 2.0 - q * 7.0 + 2.4) * 0.07;
          const edgeNoise = tongueA + tongueB + tongueC;
          const lobe1 = Math.exp(-Math.pow((q - (0.34 + 0.05 * Math.sin(t * 2.2))) / 0.18, 2));
          const lobe2 = Math.exp(-Math.pow((q - (0.69 + 0.07 * Math.sin(t * 1.8 + 2))) / 0.14, 2));
          const foot = 1 + 0.22 * (1 - smooth(0.02, 0.34, q));
          const wantedWidth = (size * 0.46 * taper * foot) * (1 + edgeNoise + 0.16 * lobe1 - 0.12 * lobe2);
          // Keep the entire flame silhouette inside the canvas bounds.
          const halfWidth = Math.min(wantedWidth, center - 14, size - center - 14);

          if (halfWidth < 0.5) continue;

          for (let x = 0; x < size; x++) {
            const dx = Math.abs(x - center) / halfWidth;
            const turbulence = (
              Math.sin(x * 0.105 + y * 0.072 - t * 5.0) +
              Math.sin(x * 0.047 - y * 0.13 + t * 3.8) * 0.55 +
              Math.sin(x * 0.19 + y * 0.035 - t * 7.2) * 0.22
            ) * (0.025 + q * 0.055);

            const boundary = 1 + turbulence;
            const outer = 1 - smooth(boundary - 0.11, boundary + 0.055, dx);
            if (outer <= 0) continue;

            const innerWidth = 0.58 + 0.08 * Math.sin(t * 2.6 - q * 10 + x * 0.025);
            const core = 1 - smooth(innerWidth - 0.08, innerWidth + 0.1, dx);
            const hot = core * (0.78 + 0.22 * Math.sin(t * 3.4 - q * 8 + x * 0.018));
            const base = smooth(0.02, 0.92, q);

            let red, green, blue;
            if (core > 0.55) {
              red = 255;
              green = 244 - 34 * base;
              blue = 174 - 115 * base;
            } else {
              const edge = smooth(0.45, 1.0, dx);
              red = 255;
              green = 178 - 126 * edge - 28 * base;
              blue = 54 - 48 * edge - 18 * base;
            }

            const root = 1 - smooth(0.02, 0.24, q);
            const alpha = Math.min(1, outer * (0.94 + hot * 0.06) * (0.94 + root * 0.06));
            const index = (y * size + x) * 4;
            pixels[index] = red;
            pixels[index + 1] = Math.max(0, green);
            pixels[index + 2] = Math.max(0, blue);
            pixels[index + 3] = Math.round(alpha * 255);
          }
        }

        ctx.putImageData(frame, 0, 0);
      }

      function animate(timestamp) {
        drawFrame(timestamp);
        if (!reduceMotion) requestAnimationFrame(animate);
      }

      drawFrame(0);
      if (!reduceMotion) requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
