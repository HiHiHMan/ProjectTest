<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090503">
  <title>Fire — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090503; color: #f8e6d2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .scene {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 100%, #57200b 0%, #1c0b05 35%, #090503 76%);
    }
    .fire-stage {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: min(200px, calc(100vw - 32px));
      aspect-ratio: 1; transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 22px rgb(255 91 12 / 28%));
    }
    .pixel-fire {
      position: absolute; inset: 0;
      overflow: visible; contain: layout style;
      image-rendering: pixelated;
    }
    .fire-pixel {
      position: absolute;
      width: var(--pixel-size); height: var(--pixel-size);
      left: var(--x); top: var(--y);
      background: var(--pixel-color);
      opacity: var(--pixel-alpha);
      transform-origin: 50% 100%;
      animation: pixel-flame var(--duration) ease-in-out var(--delay) infinite alternate;
      will-change: transform, opacity;
    }
    .heat {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%, rgb(255 105 18 / 22%), transparent 48%),
                  linear-gradient(0deg, rgb(10 4 1 / 30%), transparent 40%);
      animation: heat-flicker 1.3s steps(5, end) infinite;
    }
    .vignette {
      position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgb(0 0 0 / 54%) 100%);
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 3;
      padding: 10px 15px; border: 1px solid rgb(255 207 163 / 20%);
      border-radius: 999px; background: rgb(15 8 4 / 48%);
      color: #f3d2b3; text-decoration: none; font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: .2s ease;
    }
    .back:hover { border-color: rgb(255 173 104 / 60%); background: rgb(50 20 8 / 70%); }
    .title {
      position: fixed; z-index: 2; top: 9%; left: 0; width: 100%;
      text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgb(255 105 24 / 35%);
    }
    h1 { margin: 0; color: #ffe3c5; font-size: clamp(22px, 4vw, 44px); font-weight: 500; letter-spacing: .42em; text-indent: .42em; }
    .subtitle { margin: 13px 0 0; color: rgb(255 202 158 / 58%); font-size: 9px; letter-spacing: .3em; }
    @keyframes pixel-flame {
      0% {
        transform: translate3d(calc(var(--sway) * -1), 1px, 0) scaleY(.96) scaleX(1.02);
        opacity: calc(var(--pixel-alpha) * .88);
      }
      35% {
        transform: translate3d(var(--sway), -2px, 0) scaleY(1.06) scaleX(.96);
        opacity: var(--pixel-alpha);
      }
      70% {
        transform: translate3d(calc(var(--sway) * -.45), -4px, 0) scaleY(1.1) scaleX(1.04);
        opacity: calc(var(--pixel-alpha) * .92);
      }
      100% {
        transform: translate3d(calc(var(--sway) * .8), -1px, 0) scaleY(.98) scaleX(.94);
        opacity: calc(var(--pixel-alpha) * .82);
      }
    }
    @keyframes heat-flicker {
      0%, 100% { opacity: .48; }
      35% { opacity: .9; }
      62% { opacity: .62; }
      78% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .back { top: 17px; left: 17px; }
      .title { top: 13%; }
      h1 { font-size: 22px; letter-spacing: .3em; }
      .subtitle { font-size: 8px; letter-spacing: .2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fire-pixel, .heat { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="fire-stage">
      <div class="pixel-fire" id="pixel-fire" aria-hidden="true"></div>
    </div>
    <div class="heat"></div>
    <div class="vignette"></div>
  </main>
  <a class="back" href="../index.html">← Experiments</a>
  <header class="title">
    <h1>FIRE</h1>
    <p class="subtitle">A STUDY OF LIGHT · HEAT · MOTION</p>
  </header>
  <script>
    (() => {
      const host = document.getElementById('pixel-fire');
      const source = new Image();
      source.src = '../images/fire.png';

      source.onload = () => {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const sampleStep = 4;
        const sourceWidth = source.naturalWidth;
        const sourceHeight = source.naturalHeight;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;
        context.clearRect(0, 0, sourceWidth, sourceHeight);
        context.drawImage(source, 0, 0);
        const pixels = context.getImageData(0, 0, sourceWidth, sourceHeight).data;

        const scale = 200 / Math.max(sourceWidth, sourceHeight);
        const renderedWidth = sourceWidth * scale;
        const renderedHeight = sourceHeight * scale;
        const offsetX = (200 - renderedWidth) / 2;
        const offsetY = (200 - renderedHeight) / 2;
        const fragment = document.createDocumentFragment();

        host.style.width = '100%';
        host.style.height = '100%';

        for (let y = 0; y < sourceHeight; y += sampleStep) {
          for (let x = 0; x < sourceWidth; x += sampleStep) {
            const index = (y * sourceWidth + x) * 4;
            const alpha = pixels[index + 3] / 255;
            if (alpha < 0.08) continue;

            const red = pixels[index];
            const green = pixels[index + 1];
            const blue = pixels[index + 2];
            const element = document.createElement('i');
            const pixelX = offsetX + x * scale;
            const pixelY = offsetY + y * scale;
            const pixelSize = Math.max(sampleStep * scale, 1);

            element.className = 'fire-pixel';
            element.style.setProperty('--x', pixelX + 'px');
            element.style.setProperty('--y', pixelY + 'px');
            element.style.setProperty('--pixel-size', pixelSize + 'px');
            element.style.setProperty('--pixel-color', 'rgb(' + red + ' ' + green + ' ' + blue + ')');
            element.style.setProperty('--pixel-alpha', alpha.toFixed(3));
            element.style.setProperty('--sway', (1 + Math.random() * 5).toFixed(2) + 'px');
            element.style.setProperty('--duration', (0.38 + Math.random() * 0.72).toFixed(2) + 's');
            element.style.setProperty('--delay', (-Math.random() * 1.2).toFixed(2) + 's');
            fragment.appendChild(element);
          }
        }

        host.appendChild(fragment);
        canvas.width = canvas.height = 1;
      };

      source.onerror = () => {
        host.textContent = 'Unable to build pixel flame';
      };
    })();
  </script>
</body>
</html>
