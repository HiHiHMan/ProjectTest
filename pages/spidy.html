<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="A cinematic Spider-Man inspired floating scene.">
  <title>ProjectTest — Spidy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/spidy.css">
</head>
<body>
  <main class="spidy-stage">
    <div class="city-glow" aria-hidden="true"></div>
    <div class="speed-lines" aria-hidden="true"></div>

    <header class="scene-heading">
      <span class="eyebrow"><i></i> FRIENDLY NEIGHBORHOOD</span>
      <h1>THE <span>SPIDER</span><br>IS IN THE AIR</h1>
      <p>WITH GREAT POWER COMES GREAT RESPONSIBILITY</p>
    </header>

    <div class="spidy-image-wrap">
      <div class="image-aura" aria-hidden="true"></div>
      <div class="spidy-image-layer">
        <img class="spidy-image" src="../images/obj02.webp" crossorigin="anonymous" alt="Spider-Man ลอยตัวอยู่กลางอากาศ">
        <canvas class="spidy-pixel-canvas" aria-hidden="true"></canvas>
        <div class="pixel-progress" role="status" aria-live="polite">
          <div class="pixel-progress-label"><span class="pixel-progress-message">เตรียมอ่านค่าสีภาพ...</span><strong class="pixel-progress-value">0%</strong></div>
          <div class="pixel-progress-track"><span class="pixel-progress-fill"></span></div>
        </div>
      </div>
      <span class="target-ring ring-one" aria-hidden="true"></span>
      <span class="target-ring ring-two" aria-hidden="true"></span>
      <span class="image-caption">WEB-SLINGER <b>•</b> NYC</span>
    </div>

    <footer class="scene-footer">
      <span>NEW YORK CITY</span>
      <span class="footer-line"></span>
      <span>YOUR FRIENDLY NEIGHBORHOOD SPIDER-MAN</span>
    </footer>
    <div class="corner-mark mark-tl" aria-hidden="true"></div>
    <div class="corner-mark mark-br" aria-hidden="true"></div>
  </main>
  <script src="../scripts/spidy-web.js" defer></script>
</body>
</html>
