<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Pixel Grid — ProjectTest</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101010;color:#eee}
body{margin:0;width:100vw;height:100vh;overflow:hidden;padding:0}
header{display:none}
h1{font-size:24px;margin:0 0 8px}
p{margin:0;color:#999;font-size:13px}
main{width:100vw;height:100vh;margin:0;padding:0}
.grid-viewport{width:100%;height:100%;overflow:hidden;background:#05070b;border:0;padding:0}
canvas{display:block;width:100%;height:100%;background:#05070b;image-rendering:pixelated}
.info{display:none;display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Pixel Grid</h1>
  <p>ตารางขนาด 1500 × 1500 พิกเซล · ช่องละ 10 × 10 พิกเซล · 150 × 150 ช่อง</p>
</header>
<main>
  <div class="grid-viewport">
    <canvas id="pixelGrid" width="1500" height="1500" aria-label="ตารางพิกเซลพร้อมตัวละคร Hulk"></canvas>
  </div>
  <div class="info">
    <span>Canvas: 1500 × 1500 px</span>
    <span>Cell: 10 × 10 px</span>
    <span>Total: 22,500 cells</span>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("pixelGrid");
  const ctx = canvas.getContext("2d");
  const cellSize = 10;

  // Hulk sprite: each character below paints exactly one 10 × 10 grid cell.
  const sprite = [
    "...........HHHHHHHHHHH...........",
    "..........HHhHHHHHHhHHH..........",
    ".........DDDDDDDDDDDDDDD.........",
    "........DDGGGGGGGGGGGGGDD........",
    ".......DDGGGGGGGGGGGGGGGDD.......",
    ".......DGGGGGGGGGGGGGGGGGDD......",
    "......DGGGGGKKGGGGGKKGGGGGDD.....",
    "......DGGGGGWWGGGGGWWGGGGGGD.....",
    "......DGGGGGGGGGGGGGGGGGGGGD.....",
    ".......DGGGGGGGGGGGGGGGGGGD......",
    "........DDGGGGGGGGGGGGGGDD........",
    "..........DDGGGMMMMGGGDD..........",
    "............DDDDDDDDD.............",
    ".........DDDDDDDDDDDDDDD..........",
    "......DDDDGGGGGGGGGGGGGDDDD.......",
    "....DDDDGGGGGGGGGGGGGGGGGDDDD.....",
    "...DDDDGGGGGLLGGGGGGLLGGGGGDDDD...",
    "..DDDGGGGGGGLLGGGGGLLGGGGGGGDDD....",
    ".DDDGGGGGGGGGGGGGGGGGGGGGGGGGDDD...",
    ".DDGGGGGGGGGGGGGGGGGGGGGGGGGGGDD...",
    "DDDGGGGGGGGGGGGGGGGGGGGGGGGGGGGDDD..",
    "DDDGGGGGGGGGGGGGGGGGGGGGGGGGGGGDDD..",
    ".DDDGGGGGGGGGGGGGGGGGGGGGGGGGGDDD...",
    "..DDDDGGGGGGGGGGGGGGGGGGGGGGDDDD....",
    "...DDDDGGGGGGGGGGGGGGGGGGGGDDDD.....",
    "......DDDDGGGGGGGGGGGGGGDDDD........",
    "........DDDDPPPPPPPPPPDDDD..........",
    ".........DDPPPPPPPPPPPPDD...........",
    ".........DPPQQPPPPPPQQPPD............",
    ".........DPPPPPPPPPPPPPPD............",
    ".........DDPPPPPPPPPPPPDD............",
    "..........DDDDPPPPPPDDDD.............",
    "..........DDDDDD..DDDDDD.............",
    ".........DDDDDDD..DDDDDDD............",
    "........DDDDDDD....DDDDDDD...........",
    ".......DDDDDDD......DDDDDDD.........."
  ];

  const colors = {
    D: "#176b32", G: "#36b94f", L: "#83e879", S: "#218b3c",
    H: "#20242a", h: "#59616b", W: "#f5f5e9", K: "#18251b",
    M: "#4b2530", P: "#7135b5", p: "#a35be0", Q: "#49217c"
  };

  let angle = 0;
  let lastDraw = 0;

  // Directional pixel frames: front -> quarter -> side -> rear quarter -> back.
  // Every frame is rebuilt from grid cells; no 3D geometry or extrusion is used.
  function getRotatedPixels() {
    const width = Math.max(...sprite.map(row => row.length));
    const height = sprite.length;
    const turn = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const facing = Math.cos(turn) < 0 ? -1 : 1;
    const sideAmount = Math.abs(Math.sin(turn));
    const backAmount = (1 - Math.cos(turn)) / 2;
    const widthScale = 1 - sideAmount * 0.62;
    const frame = new Map();
    const center = (width - 1) / 2;

    sprite.forEach((row, y) => {
      const pad = Math.floor((width - row.length) / 2);
      [...row].forEach((sourcePixel, i) => {
        if (sourcePixel === "." || !colors[sourcePixel]) return;
        const sourceX = pad + i;
        let pixel = sourcePixel;

        // The rear frame has no facial features; hair and back muscles replace them.
        if (backAmount > 0.72 && y >= 5 && y <= 11 &&
            ["W", "K", "M"].includes(pixel)) return;
        if (backAmount > 0.72 && y >= 5 && y <= 11 && ["G", "L", "S"].includes(pixel)) {
          pixel = y < 8 ? "D" : (sourceX % 5 === 0 ? "S" : "G");
        }

        // Move facial details toward the leading edge in side/three-quarter views.
        let localX = sourceX - center;
        if (sideAmount > 0.35 && y >= 5 && y <= 11 && ["W", "K", "M"].includes(pixel)) {
          localX += facing * sideAmount * 2.8;
        }
        if (backAmount > 0.72 && y >= 14 && y <= 25 && pixel === "L") {
          pixel = "S";
        }

        const projectedX = center + localX * widthScale;
        const col = Math.round(projectedX + (width - 1) * (1 - widthScale) / 2);
        const key = y + ":" + col;

        // Add subtle directional pixel shading to distinguish each view.
        let factor = 1;
        if (sideAmount > 0.2) {
          factor = 0.84 + (sourceX / Math.max(1, width - 1)) * 0.12;
          if (facing < 0) factor = 1.02 - factor * 0.12;
        }
        if (backAmount > 0.72) factor *= 0.78;
        if (sideAmount > 0.78 && sourceX < center) factor *= 0.88;

        const color = factor === 1 ? colors[pixel] : shadeColor(colors[pixel], factor);
        const previous = frame.get(key);
        if (!previous || sourceX > previous.sourceX) {
          frame.set(key, { x: col, y, color, sourceX });
        }
      });
    });

    return [...frame.values()];
  }

  function shadeColor(hex, factor) {
    const value = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, Math.round(((value >> 16) & 255) * factor)));
    const g = Math.max(0, Math.min(255, Math.round(((value >> 8) & 255) * factor)));
    const b = Math.max(0, Math.min(255, Math.round((value & 255) * factor)));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function drawGrid() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#05070b";
    ctx.fillRect(0, 0, width, height);

    for (let y = 0; y < height; y += cellSize) {
      for (let x = 0; x < width; x += cellSize) {
        const w = Math.min(cellSize, width - x);
        const h = Math.min(cellSize, height - y);
        ctx.fillStyle = "rgba(145, 175, 210, 0.065)";
        ctx.fillRect(x + 0.5, y + 0.5, w - 1, h - 1);
        ctx.fillStyle = "rgba(225, 240, 255, 0.10)";
        ctx.fillRect(x + 0.5, y + 0.5, w - 1, 0.5);
        ctx.fillRect(x + 0.5, y + 0.5, 0.5, h - 1);
      }
    }

    const spriteWidth = Math.max(...sprite.map(row => row.length));
    const offsetX = Math.floor((width / cellSize - spriteWidth) / 2) * cellSize;
    const offsetY = Math.floor((height / cellSize - sprite.length) / 2) * cellSize;
    getRotatedPixels().forEach(({ x, y, color }) => {
      const px = offsetX + x * cellSize;
      const py = offsetY + y * cellSize;
      ctx.fillStyle = color;
      ctx.fillRect(px, py, cellSize, cellSize);
      ctx.strokeStyle = "rgba(5, 12, 10, 0.18)";
      ctx.lineWidth = 0.6;
      ctx.strokeRect(px + 0.3, py + 0.3, cellSize - 0.6, cellSize - 0.6);
    });
  }

  function animate(timestamp) {
    if (timestamp - lastDraw >= 90) {
      angle = (angle + 0.045) % (Math.PI * 2);
      drawGrid();
      lastDraw = timestamp;
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", drawGrid);
  drawGrid();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
