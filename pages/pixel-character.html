<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">
<title>Pixel Hulk — ProjectTest</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;background:#05070b}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
main{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05070b}
#pixelGrid{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;outline:0}
</style>
</head>
<body>
<main>
  <canvas id="pixelGrid" aria-hidden="true"></canvas>
  <canvas id="scene" aria-label="ตัวละคร Hulk แบบ Voxel ที่กล้องหมุนรอบตัว 360 องศา"></canvas>
</main>
<script>
(() => {
  const canvas = document.getElementById("pixelGrid");
  const ctx = canvas.getContext("2d");
  const cellSize = 10;
  function drawGrid(){
    const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#05070b";ctx.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=cellSize)for(let x=0;x<w;x+=cellSize){
      const cw=Math.min(cellSize,w-x),ch=Math.min(cellSize,h-y);
      ctx.fillStyle="rgba(145,175,210,.055)";
      ctx.fillRect(x+.5,y+.5,cw-1,ch-1);
      ctx.fillStyle="rgba(225,240,255,.075)";
      ctx.fillRect(x+.5,y+.5,cw-1,.5);
      ctx.fillRect(x+.5,y+.5,.5,ch-1);
    }
  }
  addEventListener("resize",drawGrid);drawGrid();
})();
</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const canvas=document.querySelector("#scene");
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
const target=new THREE.Vector3(0,2.55,0);
const radius=10.8;
scene.add(new THREE.HemisphereLight(0xdcecff,0x18251c,2.0));
const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(-4,8,6);scene.add(key);
const rim=new THREE.DirectionalLight(0x75aaff,2.1);rim.position.set(5,4,-6);scene.add(rim);
const fill=new THREE.DirectionalLight(0x9cff8d,1.0);fill.position.set(4,2,5);scene.add(fill);

const materials={
  green:new THREE.MeshStandardMaterial({color:0x35b84e,roughness:1}),
  light:new THREE.MeshStandardMaterial({color:0x83e879,roughness:1}),
  darkGreen:new THREE.MeshStandardMaterial({color:0x176b32,roughness:1}),
  shade:new THREE.MeshStandardMaterial({color:0x218b3c,roughness:1}),
  hair:new THREE.MeshStandardMaterial({color:0x20242a,roughness:1}),
  hairLight:new THREE.MeshStandardMaterial({color:0x59616b,roughness:1}),
  white:new THREE.MeshStandardMaterial({color:0xf5f5e9,roughness:1}),
  eye:new THREE.MeshStandardMaterial({color:0x111a13,roughness:1}),
  mouth:new THREE.MeshStandardMaterial({color:0x4b2530,roughness:1}),
  purple:new THREE.MeshStandardMaterial({color:0x7135b5,roughness:1}),
  purpleLight:new THREE.MeshStandardMaterial({color:0xa35be0,roughness:1}),
  purpleDark:new THREE.MeshStandardMaterial({color:0x49217c,roughness:1})
};
const hulk=new THREE.Group();scene.add(hulk);
const unit=.5;
function block(x,y,z,sx,sy,sz,mat){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;hulk.add(mesh);return mesh;
}
function voxelBox(x,y,z,nx,ny,nz,mat,step=unit){
  for(let ix=0;ix<nx;ix++)for(let iy=0;iy<ny;iy++)for(let iz=0;iz<nz;iz++){
    block(x+(ix-(nx-1)/2)*step,y+(iy-(ny-1)/2)*step,z+(iz-(nz-1)/2)*step,step*.98,step*.98,step*.98,mat);
  }
}
// Legs and oversized feet
voxelBox(-.58,.95,0,2,4,2,materials.purple);
voxelBox(.58,.95,0,2,4,2,materials.purple);
voxelBox(-.58,.05,.18,3,1,3,materials.purpleDark);
voxelBox(.58,.05,.18,3,1,3,materials.purpleDark);
block(-.58,1.65,.52,.42,.35,.08,materials.purpleLight);
block(.58,1.65,.52,.42,.35,.08,materials.purpleLight);
// Torso, broad shoulders and chest
voxelBox(0,3.15,0,6,5,3,materials.green);
voxelBox(0,4.15,0,7,2,3,materials.darkGreen);
voxelBox(0,3.55,.78,4,2,1,materials.light);
// Arms: thick upper arms, forearms and fists
for(const side of [-1,1]){
  voxelBox(side*1.78,3.85,0,2,4,3,materials.darkGreen);
  voxelBox(side*1.9,2.75,.02,2,3,3,materials.green);
  voxelBox(side*1.95,1.85,.12,2,2,2,materials.shade);
  voxelBox(side*1.95,1.45,.18,2,1,2,materials.darkGreen);
}
// Neck and head
voxelBox(0,4.95,0,2,1,2,materials.darkGreen);
voxelBox(0,5.85,0,4,3,3,materials.green);
voxelBox(0,6.72,0,4,1,3,materials.hair);
voxelBox(-.78,6.42,0,1,2,3,materials.hair);
voxelBox(.78,6.42,0,1,2,3,materials.hair);
voxelBox(-.48,6.92,.05,1,1,2,materials.hairLight);
voxelBox(.48,6.92,.05,1,1,2,materials.hair);
for(const side of [-1,1]){
  block(side*.43,5.95,.79,.32,.16,.08,materials.hair);
  block(side*.43,5.7,.82,.22,.18,.08,materials.white);
  block(side*.43,5.7,.88,.09,.15,.06,materials.eye);
}
block(0,5.42,.84,.62,.16,.08,materials.mouth);
block(0,5.27,.78,.38,.10,.08,materials.light);
// Back hair/neck details give the silhouette depth from every angle
voxelBox(0,6.35,-.72,3,2,1,materials.hair);
voxelBox(0,4.95,-.55,2,1,1,materials.shade);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener("resize",resize);
let angle=0;
function animate(){
  requestAnimationFrame(animate);
  angle+=0.004;
  camera.position.set(
    target.x+Math.sin(angle)*radius,
    target.y+1.05,
    target.z+Math.cos(angle)*radius
  );
  camera.lookAt(target);
  renderer.render(scene,camera);
}
resize();animate();
</script>
</body>
</html>
