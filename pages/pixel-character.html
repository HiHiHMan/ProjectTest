<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Pixel Grid — ProjectTest</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101010;color:#eee}
body{margin:0;width:100vw;height:100vh;overflow:hidden;padding:0}
header{display:none}
h1{font-size:24px;margin:0 0 8px}
p{margin:0;color:#999;font-size:13px}
main{width:100vw;height:100vh;margin:0;padding:0}
.grid-viewport{width:100%;height:100%;overflow:hidden;background:#fff;border:0;padding:0}
canvas{display:block;width:100%;height:100%;background:#fff;image-rendering:pixelated}
.info{display:none;display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Pixel Grid</h1>
  <p>ตารางขนาด 1500 × 1500 พิกเซล · ช่องละ 10 × 10 พิกเซล · 150 × 150 ช่อง</p>
</header>
<main>
  <div class="grid-viewport">
    <canvas id="pixelGrid" width="1500" height="1500" aria-label="ตาราง 150 คูณ 150 ช่อง"></canvas>
  </div>
  <div class="info">
    <span>Canvas: 1500 × 1500 px</span>
    <span>Cell: 10 × 10 px</span>
    <span>Total: 22,500 cells</span>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("pixelGrid");
  const ctx = canvas.getContext("2d");
  const cellSize = 10;

  function drawGrid() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, width, height);

    ctx.beginPath();
    ctx.strokeStyle = "#d4d4d4";
    ctx.lineWidth = 1;
    for (let x = 0.5; x <= width; x += cellSize) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
    }
    for (let y = 0.5; y <= height; y += cellSize) {
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
    }
    ctx.stroke();
  }

  window.addEventListener("resize", drawGrid);
  drawGrid();
})();
</script>
</body>
</html>
