<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Pixel Grid — ProjectTest</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101010;color:#eee}
body{margin:0;min-height:100vh;padding:0}
header{width:100%;margin:0;padding:16px 24px 12px}
h1{font-size:24px;margin:0 0 8px}
p{margin:0;color:#999;font-size:13px}
main{width:100%;min-height:100vh;margin:0;padding:0 12px 12px}
.grid-viewport{width:100%;height:calc(100vh - 72px);min-height:300px;overflow:auto;background:#222;border:1px solid #444;padding:12px}
canvas{display:block;width:1500px;height:1500px;max-width:none;background:#fff;image-rendering:pixelated}
.info{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Pixel Grid</h1>
  <p>ตารางขนาด 1500 × 1500 พิกเซล · ช่องละ 10 × 10 พิกเซล · 150 × 150 ช่อง</p>
</header>
<main>
  <div class="grid-viewport">
    <canvas id="pixelGrid" width="1500" height="1500" aria-label="ตาราง 150 คูณ 150 ช่อง"></canvas>
  </div>
  <div class="info">
    <span>Canvas: 1500 × 1500 px</span>
    <span>Cell: 10 × 10 px</span>
    <span>Total: 22,500 cells</span>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("pixelGrid");
  const ctx = canvas.getContext("2d");
  const size = 10;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.strokeStyle = "#d4d4d4";
  ctx.lineWidth = 1;
  for (let pos = 0.5; pos <= 1500; pos += size) {
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, 1500);
    ctx.moveTo(0, pos);
    ctx.lineTo(1500, pos);
  }
  ctx.stroke();
})();
</script>
</body>
</html>
