<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Glass — Grid Experiment</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(to right, #eeeeee 1px, transparent 1px),
        linear-gradient(to bottom, #eeeeee 1px, transparent 1px);
      background-size: 70px 70px;
    }

    .content.box-glass {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(5, 100px);
      grid-template-rows: repeat(5, 100px);
      gap: 0;
      padding: 12px;
    }

    .content.box-glass::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 460px;
      height: 460px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #138f21;
      background:
        radial-gradient(ellipse at 28% 34%, rgba(175, 255, 36, 0.95) 0%, rgba(175, 255, 36, 0.45) 18%, transparent 48%),
        radial-gradient(ellipse at 78% 62%, rgba(252, 233, 61, 0.9) 0%, rgba(252, 233, 61, 0.38) 16%, transparent 43%),
        radial-gradient(ellipse at 48% 82%, rgba(175, 255, 36, 0.72) 0%, transparent 38%),
        radial-gradient(circle at 50% 50%, #138f21 0%, #138f21 68%);
      background-blend-mode: screen, screen, screen, normal;
    }

    .turbulent-gradient {
      position: absolute;
      z-index: -1;
      width: 460px;
      height: 460px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border-radius: 50%;
      pointer-events: none;
    }

    .glass-box {
      width: 100px;
      height: 100px;
      border: none;
      border-radius: 15px;
      box-shadow: inset 2px 2px 5px rgb(0 0 0 / 9%), inset -2px -2px 5px rgb(255 255 255 / 85%);
      background: rgb(255 255 255 / 58%);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>
  <main class="content box-glass" aria-label="5 by 5 glass box grid">
    <div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div>
    <div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div>
    <div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div>
    <div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div>
    <div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div><div class="glass-box"></div>
  </main>
</body>
</html>
