<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Glass — Grid Experiment</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    :root {
      --tile-size: clamp(54px, 17vw, 100px);
      --glass-frost: 0.1;
      --glass-saturation: 1.2;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #fbfbfb;
      background-image: linear-gradient(to right, #eeeeee 1px, transparent 1px), linear-gradient(to bottom, #eeeeee 1px, transparent 1px);
      background-size: 70px 70px;
    }

    .content.box-glass {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(5, var(--tile-size));
      grid-template-rows: repeat(5, var(--tile-size));
      gap: 0;
      padding: clamp(6px, 2vw, 12px);
      max-width: 100vw;
      max-height: 100vh;
    }

    .content.box-glass::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 400px;
      height: 400px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #138f21;
      background:
        radial-gradient(ellipse at 28% 34%, rgba(175, 255, 36, 0.95) 0%, rgba(175, 255, 36, 0.45) 18%, transparent 48%),
        radial-gradient(ellipse at 78% 62%, rgba(252, 233, 61, 0.9) 0%, rgba(252, 233, 61, 0.38) 16%, transparent 43%),
        radial-gradient(ellipse at 48% 82%, rgba(175, 255, 36, 0.72) 0%, transparent 38%),
        radial-gradient(circle at 50% 50%, #138f21 0%, #138f21 68%);
      background-blend-mode: screen, screen, screen, normal;
      filter: blur(40px);
    }

    .turbulent-gradient {
      position: absolute;
      z-index: -1;
      width: 460px;
      height: 460px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border-radius: 50%;
      pointer-events: none;
    }

    .glass-box {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      min-height: 0;
      border-radius: clamp(10px, 2vw, 20px);
      border: 1px solid rgb(255 255 255 / 17%);
      background: rgb(255 255 255 / 9%);
    }

    .glass-filter-defs {
      position: fixed;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glass-box::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent 8%, rgb(255 255 255 / 30%) 50%, transparent 92%) top / 100% 1px no-repeat,
        radial-gradient(ellipse 34% 34% at 0% 0%, rgb(0 0 0 / 11%) 0%, rgb(0 0 0 / 4%) 48%, transparent 100%),
        radial-gradient(ellipse 34% 34% at 100% 0%, rgb(0 0 0 / 11%) 0%, rgb(0 0 0 / 4%) 48%, transparent 100%),
        radial-gradient(ellipse 34% 34% at 0% 100%, rgb(0 0 0 / 11%) 0%, rgb(0 0 0 / 4%) 48%, transparent 100%),
        radial-gradient(ellipse 34% 34% at 100% 100%, rgb(0 0 0 / 11%) 0%, rgb(0 0 0 / 4%) 48%, transparent 100%);
      filter: blur(5px);
      opacity: .72;
    }

    .glass-box::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 80%), transparent 38%, rgb(255 255 255 / 30%)) left / 1px 100% no-repeat,
        linear-gradient(
          132deg,
          rgb(255 255 255 / 52%) 0%,
          rgb(255 255 255 / 25%) 13%,
          transparent 34%,
          transparent 68%,
          rgb(255 255 255 / 14%) 84%,
          rgb(255 255 255 / 32%) 100%
        ),
        radial-gradient(
          ellipse 75% 42% at 12% 0%,
          rgb(255 255 255 / 38%) 0%,
          transparent 72%
        );
      opacity: .28;
      mix-blend-mode: screen;
    }

    .glass-facet {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .facet-top {
      clip-path: polygon(0 0, 100% 0, 50% 50%);
      background:
        linear-gradient(180deg, rgb(255 255 255 / 9%), transparent 78%),
        radial-gradient(ellipse 70% 90% at 50% 100%, rgb(0 0 0 / 9%), transparent 72%);
    }

    .facet-right {
      clip-path: polygon(100% 0, 100% 100%, 50% 50%);
      background:
        linear-gradient(270deg, rgb(255 255 255 / 7%), transparent 78%),
        radial-gradient(ellipse 90% 70% at 0% 50%, rgb(0 0 0 / 9%), transparent 72%);
    }

    .facet-bottom {
      clip-path: polygon(100% 100%, 0 100%, 50% 50%);
      background: transparent;
      box-shadow:
        inset 0 -11px 7px -10px rgb(65 65 65 / 24%),
        inset 0 -5px 14px -5px rgb(75 75 75 / 16%);
      opacity: .9;
    }

    .facet-left {
      clip-path: polygon(0 100%, 0 0, 50% 50%);
      background:
        linear-gradient(90deg, rgb(255 255 255 / 8%), transparent 78%),
        radial-gradient(ellipse 90% 70% at 100% 50%, rgb(0 0 0 / 8%), transparent 72%);
    }

    @media (max-width: 360px) {
      :root { --tile-size: clamp(48px, 17vw, 62px); }
      .content.box-glass { padding: 4px; }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      :root { --tile-size: min(17vw, 16vh, 82px); }
    }

  </style>
</head>

  </main>
  <svg class="glass-filter-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="liquid-glass-filter" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="2" seed="8" result="glassNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="glassNoise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="0.6"/>
      </filter>
    </defs>
  </svg>
