<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05050a">
  <title>Baiford</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05050a;
    }
    body { min-height: 320px; }
    .baiford-scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(38, 31, 67, .18), transparent 58%),
        #05050a;
    }
    #baiford-threads {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <main class="baiford-scene" aria-label="Baiford thread strands">
    <canvas id="baiford-threads" aria-hidden="true"></canvas>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('baiford-threads');
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      const palette = [
        '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8',
        '#FF8C42', '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
      ];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let threads = [];
      let startTime = 0;

      function createThreads() {
        // จัดเส้นด้าย 30 เส้นเป็นกลุ่มไว้กึ่งกลางหน้าจอ
        const count = 120;
        const threadWidth = 1.8;
        const groupWidth = count * threadWidth;
        const step = groupWidth / count;
        const groupLeft = (width - groupWidth) / 2;

        threads = Array.from({ length: count }, (_, index) => {
          const shuffled = [...palette].sort(() => Math.random() - 0.5);
          const colors = shuffled.slice(0, 4);
          const startX = groupLeft + index * step;
          const safeBottom = Math.max(0, height + 5);
          const startY = Math.min(22 + Math.random() * Math.min(210, height * 0.22), safeBottom);
          const length = Math.min(650 + Math.random() * 500, safeBottom - startY);

          return {
            x: startX,
            top: startY,
            bottom: safeBottom,
            colors,
            width: 1.8,
            alpha: 0.48 + Math.random() * 0.42,
            drift: (Math.random() - 0.5) * 0.3,
            flickerDelay: Math.random() * 3000,
            noise: Array.from({ length: 12 }, () => ({
              x: (Math.random() - 0.5) * 3.2,
              y: Math.random(),
              radius: 0.2 + Math.random() * 0.65,
              alpha: 0.08 + Math.random() * 0.28
            }))
          };
        });
      }

      function draw(time = 0) {
        if (!startTime) startTime = time;
        ctx.clearRect(0, 0, width, height);

        threads.forEach(thread => {
          // ใช้จังหวะกระพริบแบบเดียวกับเส้นแสงใน Dream Star
          const cycle = ((time + thread.flickerDelay) % 3000) / 3000;
          const pulse = (1 - Math.cos(cycle * Math.PI * 2)) / 2;
          const brightness = 0.42 + pulse * 0.58;
          const gradient = ctx.createLinearGradient(
            thread.x, thread.top, thread.x + thread.drift, thread.bottom
          );
          gradient.addColorStop(0, thread.colors[0] + '00');
          gradient.addColorStop(0.12, thread.colors[0] + '30');
          gradient.addColorStop(0.36, thread.colors[1] + 'bb');
          gradient.addColorStop(0.62, thread.colors[2] + 'dd');
          gradient.addColorStop(0.84, thread.colors[3] + 'ee');
          gradient.addColorStop(1, '#ffffff');

          ctx.save();
          ctx.globalAlpha = thread.alpha * brightness;
          ctx.beginPath();
          ctx.moveTo(thread.x, thread.top);
          ctx.lineTo(thread.x + thread.drift, thread.bottom);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = thread.width + pulse * 0.25;
          ctx.lineCap = 'round';
          ctx.shadowColor = thread.colors[2];
          ctx.shadowBlur = 4;
          ctx.stroke();
          ctx.restore();

          // เกรน noise เล็ก ๆ กระจายตามแนวเส้นด้าย เหมือนพื้นผิวใน Dream Star
          thread.noise.forEach(grain => {
            const grainY = thread.top + (thread.bottom - thread.top) * grain.y;
            const threadX = thread.x + thread.drift * grain.y;
            ctx.beginPath();
            ctx.arc(threadX + grain.x, grainY, grain.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${grain.alpha * brightness})`;
            ctx.fill();
          });
        });
        requestAnimationFrame(draw);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        createThreads();
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
