<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Baiford</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    #baiford-threads {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="baiford-threads" aria-hidden="true"></canvas>

  <script>
  (() => {
    const canvas = document.getElementById('baiford-threads');
    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    // ใช้ชุดสีเดียวกับเส้นแสงใน Dream Star
    const gradientColors = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8',
      '#FF8C42', '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];

    let width = 0;
    let height = 0;
    let dpr = 1;
    let threads = [];

    function createThreads() {
      const count = 300;
      const groupWidth = 270;
      const step = groupWidth / count;
      const groupLeft = (width - groupWidth) / 2;

      const trailLengths = [0.14, 0.17, 0.20, 0.24, 0.28, 0.34, 0.42, 0.52];

      threads = Array.from({ length: count }, (_, index) => {
        const trailLength = trailLengths[Math.floor(Math.random() * trailLengths.length)];
        const top = Math.random() * Math.min(height * 0.2, 160);
        const x = groupLeft + index * step;

        return {
          x,
          top,
          bottom: Math.min(height, top + height * trailLength),
          trailColor: gradientColors[Math.floor(Math.random() * gradientColors.length)],
          flickerDelay: Math.random() * 3000,
          noise: Array.from(
            { length: Math.max(18, Math.round(height * trailLength / 5)) },
            () => ({
              x: (Math.random() - 0.5) * 3.2,
              y: Math.random(),
              radius: 0.2 + Math.random() * 0.65,
              alpha: 0.08 + Math.random() * 0.28
            })
          )
        };
      });
    }

    function draw(time = 0) {
      ctx.clearRect(0, 0, width, height);

      threads.forEach(thread => {
        const flickerCycle = ((time + thread.flickerDelay) % 3000) / 3000;
        const pulse = (1 - Math.cos(flickerCycle * Math.PI * 2)) / 2;
        const brightness = 0.42 + pulse * 0.58;

        const trail = ctx.createLinearGradient(
          thread.x, thread.top, thread.x, thread.bottom
        );
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(0.25, thread.trailColor + '66');
        trail.addColorStop(0.72, thread.trailColor + 'dd');
        trail.addColorStop(1, '#ffffff');

        // เส้นแสง: เพิ่มความหนาขึ้นเล็กน้อย โดยคงแสงและการกระพริบเดิม
        ctx.save();
        ctx.globalAlpha = brightness;
        ctx.beginPath();
        ctx.moveTo(thread.x, thread.top);
        ctx.lineTo(thread.x, thread.bottom);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.3 + pulse * 0.25;
        ctx.shadowBlur = 7;
        ctx.shadowColor = thread.trailColor;
        ctx.stroke();
        ctx.restore();

        // เม็ด Noise: ใช้จำนวน ขนาด และความโปร่งใสแบบ Dream Star
        thread.noise.forEach(grain => {
          const grainY = thread.top + (thread.bottom - thread.top) * grain.y;
          ctx.beginPath();
          ctx.arc(thread.x + grain.x, grainY, grain.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${grain.alpha})`;
          ctx.fill();
        });
      });

      requestAnimationFrame(draw);
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createThreads();
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
