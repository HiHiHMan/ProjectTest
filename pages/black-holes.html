<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="black-hole" aria-label="Black sphere with a thin white outline"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('black-hole');
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) return;

      function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const centerX = innerWidth / 2;
        const centerY = innerHeight / 2;

        // Thin white outline around the black sphere.
        ctx.beginPath();
        ctx.arc(centerX, centerY, 174.65, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 0.45;
        ctx.stroke();

        // Six continuous circular hairlines, spaced 5 CSS pixels apart.
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = 'rgba(205, 205, 205, 0.48)';
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.arc(centerX, centerY, 186 + i * 5, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      window.addEventListener('resize', render, { passive: true });
      render();
    })();
  </script>
</body>
</html>
