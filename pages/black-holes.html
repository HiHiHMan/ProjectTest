<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg id="black-hole" aria-label="Black sphere with a thin white outline" role="img">
    <circle class="sphere-outline" cx="50%" cy="50%" r="174.65" />
    <g class="hairlines">
      <circle cx="50%" cy="50%" r="186" />
      <circle cx="50%" cy="50%" r="191" />
      <circle cx="50%" cy="50%" r="196" />
      <circle cx="50%" cy="50%" r="201" />
      <circle cx="50%" cy="50%" r="206" />
      <circle cx="50%" cy="50%" r="211" />
    </g>
  </svg>
  <style>
    #black-hole {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      background: #000;
    }
    .sphere-outline {
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 0.45;
      vector-effect: non-scaling-stroke;
    }
    .hairlines circle {
      fill: none;
      stroke: rgba(205, 205, 205, 0.48);
      stroke-width: 0.5;
      vector-effect: non-scaling-stroke;
    }
  </style>
</body>
</html>
