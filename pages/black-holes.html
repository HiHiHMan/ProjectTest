<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="black-hole" aria-label="Black sphere with a thin white outline"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('black-hole');
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) return;

      let time = 0;
      let animationFrame;

      function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const centerX = innerWidth / 2;
        const centerY = innerHeight / 2;

        // Thin white outline around the black sphere.
        ctx.beginPath();
        ctx.arc(centerX, centerY, 174.65, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 0.45;
        ctx.stroke();

        // 100 thin, closely spaced continuous circular hairlines.
        ctx.lineWidth = 0.02;
        const ringPalette = [
          [255, 255, 255],
          [220, 220, 220],
          [185, 185, 185],
          [145, 175, 195],
          [105, 155, 190],
          [70, 130, 175]
        ];

        for (let i = 0; i < 100; i++) {
          const palettePosition = (i / 99) * (ringPalette.length - 1);
          const colorIndex = Math.floor(palettePosition);
          const blend = palettePosition - colorIndex;
          const colorA = ringPalette[colorIndex];
          const colorB = ringPalette[Math.min(colorIndex + 1, ringPalette.length - 1)];
          const color = colorA.map((channel, index) =>
            Math.round(channel + (colorB[index] - channel) * blend)
          );
          const baseColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.42)`;
          const dimColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.08)`;
          const lightColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.72)`;

          ctx.beginPath();
          ctx.arc(centerX, centerY, 183.5 + i * 2.5, 0, Math.PI * 2);

          // Three soft light waves flow around each thread at slightly different speeds.
          const speed = 0.0035 + i * 0.000045;
          const gradient = ctx.createConicGradient(time * speed + i * 0.13, centerX, centerY);
          gradient.addColorStop(0, dimColor);
          gradient.addColorStop(0.035, baseColor);
          gradient.addColorStop(0.075, lightColor);
          gradient.addColorStop(0.115, baseColor);
          gradient.addColorStop(0.16, dimColor);
          gradient.addColorStop(0.36, baseColor);
          gradient.addColorStop(0.40, lightColor);
          gradient.addColorStop(0.44, baseColor);
          gradient.addColorStop(0.49, dimColor);
          gradient.addColorStop(0.69, baseColor);
          gradient.addColorStop(0.73, lightColor);
          gradient.addColorStop(0.77, baseColor);
          gradient.addColorStop(0.82, dimColor);
          gradient.addColorStop(1, dimColor);
          ctx.strokeStyle = gradient;
          ctx.stroke();
        }
      }

      function animate() {
        time += 1;
        render();
        animationFrame = requestAnimationFrame(animate);
      }

      window.addEventListener('resize', render, { passive: true });
      render();
      animate();
    })();
  </script>
</body>
</html>
