<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #black-hole {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .circle {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .sphere-outline {
      width: 349.3px;
      height: 349.3px;
      border: 0.45px solid rgba(255, 255, 255, 0.9);
    }

    .hairline {
      border: 0.5px solid rgba(205, 205, 205, 0.48);
    }

    .ring-1 { width: 372px; height: 372px; }
    .ring-2 { width: 382px; height: 382px; }
    .ring-3 { width: 392px; height: 392px; }
    .ring-4 { width: 402px; height: 402px; }
    .ring-5 { width: 412px; height: 412px; }
    .ring-6 { width: 422px; height: 422px; }
  </style>
</head>
<body>
  <div id="black-hole" role="img" aria-label="Black sphere with six thin circular outlines">
    <div class="circle sphere-outline"></div>
    <div class="circle hairline ring-1"></div>
    <div class="circle hairline ring-2"></div>
    <div class="circle hairline ring-3"></div>
    <div class="circle hairline ring-4"></div>
    <div class="circle hairline ring-5"></div>
    <div class="circle hairline ring-6"></div>
  </div>
</body>
</html>
