<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="black-hole" aria-label="Black sphere with a thin white outline"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('black-hole');
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) return;

      let rotation = 0;
      let animationFrame;

      function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const centerX = innerWidth / 2;
        const centerY = innerHeight / 2;

        // Thin white outline around the black sphere.
        ctx.beginPath();
        ctx.arc(centerX, centerY, 174.65, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 0.45;
        ctx.stroke();

        // 100 thin, closely spaced continuous circular hairlines.
        ctx.lineWidth = 0.02;
        const ringPalette = [
          [255, 255, 255],
          [220, 220, 220],
          [185, 185, 185],
          [145, 175, 195],
          [105, 155, 190],
          [70, 130, 175]
        ];

        for (let i = 0; i < 100; i++) {
          const palettePosition = (i / 99) * (ringPalette.length - 1);
          const colorIndex = Math.floor(palettePosition);
          const blend = palettePosition - colorIndex;
          const colorA = ringPalette[colorIndex];
          const colorB = ringPalette[Math.min(colorIndex + 1, ringPalette.length - 1)];
          const color = colorA.map((channel, index) =>
            Math.round(channel + (colorB[index] - channel) * blend)
          );
          const baseColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.42)`;
          const dimColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.08)`;

          ctx.beginPath();
          ctx.arc(centerX, centerY, 183.5 + i * 1.6, 0, Math.PI * 2);

          // Each thread has its own moving conic light gradient.
          const gradient = ctx.createConicGradient(rotation + i * 0.025, centerX, centerY);
          gradient.addColorStop(0, dimColor);
          gradient.addColorStop(0.018, baseColor);
          gradient.addColorStop(0.035, 'rgba(255, 255, 255, 0.9)');
          gradient.addColorStop(0.055, baseColor);
          gradient.addColorStop(0.12, dimColor);
          gradient.addColorStop(0.2, baseColor);
          gradient.addColorStop(1, dimColor);
          ctx.strokeStyle = gradient;
          ctx.stroke();
        }
      }

      function animate() {
        rotation = (rotation + 0.006) % (Math.PI * 2);
        render();
        animationFrame = requestAnimationFrame(animate);
      }

      window.addEventListener('resize', render, { passive: true });
      render();
      animate();
    })();
  </script>
</body>
</html>
