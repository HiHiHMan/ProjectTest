<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Black Holes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #000000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="black-hole" aria-label="Black sphere with a thin white outline"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('black-hole');
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) return;

      const supersample = 4;

      function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pixelRatio = dpr * supersample;

        canvas.width = Math.round(innerWidth * pixelRatio);
        canvas.height = Math.round(innerHeight * pixelRatio);

        // Draw vector circles at high resolution for clean downsampling.
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const centerX = innerWidth / 2;
        const centerY = innerHeight / 2;
        const unit = 1 / pixelRatio;

        // Thin white sphere outline.
        ctx.beginPath();
        ctx.arc(centerX, centerY, 174.65 * unit, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 0.7 * unit;
        ctx.stroke();

        // Six separate, continuous circular hairlines.
        ctx.lineWidth = 0.85 * unit;
        ctx.strokeStyle = 'rgba(205, 205, 205, 0.48)';
        for (let i = 0; i < 6; i++) {
          const radius = (186 + i * 5) * unit;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      window.addEventListener('resize', render, { passive: true });
      render();
    })();
  </script>
</body>
</html>
