<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Door — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
    }
    .door-lines {
      width: min(70vw, 420px);
      height: min(88vh, 650px);
      display: block;
    }
  </style>
</head>
<body>
  <svg class="door-lines" viewBox="-10 -130 100 650" preserveAspectRatio="none" aria-label="White geometric door outline">
    <polyline
      points="0,500 0,0 80,-120 80,380 0,500"
      fill="none"
      stroke="#fff"
      stroke-width="2"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
</body>
</html>
