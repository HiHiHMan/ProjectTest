<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Door — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 58%, #20202b 0%, #101117 42%, #07080c 100%);
      color: #e9e4d8;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .back {
      position: fixed; top: 28px; left: 30px; z-index: 5;
      color: #d8d0bf; text-decoration: none; font-size: 12px;
      letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid #b9a98755; border-radius: 999px;
      padding: 10px 16px; background: #0b0c12aa; backdrop-filter: blur(10px);
    }
    .scene {
      position: relative; width: min(54vw, 430px); height: min(76vh, 650px);
      min-width: 250px; min-height: 360px;
      display: grid; place-items: center;
      perspective: 1400px;
      filter: drop-shadow(0 28px 55px #000b);
    }
    .glow {
      position: absolute; inset: 12% -28%;
      background: radial-gradient(ellipse, #c69c5b20 0%, #9c744018 35%, transparent 70%);
      filter: blur(22px); pointer-events: none;
    }
    .doorway {
      position: relative; width: 72%; height: 88%;
      border: 10px solid #51412e;
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      background: linear-gradient(90deg, #171923, #b38b5030 48%, #171923);
      box-shadow: 0 0 0 2px #bda47755, inset 0 0 24px #000;
    }
    .opening {
      position: absolute; inset: 7px 7px 0;
      overflow: hidden; background: #090b12;
      box-shadow: inset 0 0 45px #000;
    }
    .light {
      position: absolute; inset: -20%;
      background: radial-gradient(ellipse at 50% 45%, #f5d59b 0%, #c18c4e 18%, #69472c 38%, #17131a 68%, #080910 100%);
      opacity: .9; transform: scale(.72); transition: transform 1.6s ease, opacity 1.6s ease;
    }
    .light::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 30px, #fff1 31px 32px);
      opacity: .22;
    }
    .door {
      position: absolute; z-index: 2; inset: 0 0 0 0;
      transform-origin: left center; transform: rotateY(0deg);
      transition: transform 1.35s cubic-bezier(.2,.72,.18,1);
      border: 1px solid #b69a6d;
      background: linear-gradient(90deg, #503a29, #765638 12%, #3c2c22 50%, #694a2e 88%, #2b211c);
      box-shadow: inset 7px 0 12px #d1ad7240, inset -8px 0 15px #0009, 8px 0 18px #0009;
      backface-visibility: hidden;
    }
    .door::before {
      content: ""; position: absolute; inset: 5% 8%;
      border: 2px solid #b696665c;
      background: linear-gradient(135deg, #ffffff08, transparent 45%, #0002);
      box-shadow: inset 0 0 0 5px #241a153d, inset 0 0 0 7px #b6966630;
    }
    .door::after {
      content: ""; position: absolute; left: 12%; right: 12%; top: 52%; height: 38%;
      border: 2px solid #b696665c;
      box-shadow: inset 0 0 0 5px #241a153d, inset 0 0 0 7px #b6966630;
    }
    .knob {
      position: absolute; z-index: 3; right: 12%; top: 49%;
      width: 13px; height: 13px; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff0b9, #c18e42 55%, #65441f);
      box-shadow: 0 0 10px #e9bb6a66;
    }
    .floor {
      position: absolute; bottom: 2%; left: -22%; right: -22%; height: 15%;
      background: radial-gradient(ellipse, #b58b542b, transparent 68%);
      transform: rotateX(68deg);
    }
    .scene.open .door { transform: rotateY(-112deg); }
    .scene.open .light { transform: scale(1.18); opacity: 1; }
    .hint {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      color: #a79a83; font-size: 10px; letter-spacing: .22em;
      text-transform: uppercase; white-space: nowrap;
    }
    @media (max-width: 600px) {
      .back { top: 18px; left: 18px; }
      .scene { width: min(78vw, 380px); height: min(70vh, 590px); }
      .hint { bottom: 22px; font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .door, .light { transition: none; }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← Experiments</a>
  <main class="scene" id="scene" aria-label="An interactive wooden door">
    <div class="glow"></div>
    <div class="doorway">
      <div class="opening"><div class="light"></div></div>
      <div class="door"></div>
      <div class="knob"></div>
    </div>
    <div class="floor"></div>
  </main>
  <div class="hint">Click the door to open / close</div>
  <script>
    const scene = document.getElementById("scene");
    scene.addEventListener("click", () => scene.classList.toggle("open"));
  </script>
</body>
</html>
