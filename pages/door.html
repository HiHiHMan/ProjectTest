<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Door — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
    }
    .door-lines {
      width: min(32vw, 192px);
      height: min(56vh, 416px);
      display: block;
    }
  </style>
</head>
<body>
  <svg class="door-lines" viewBox="-90 -130 100 650" preserveAspectRatio="none" aria-label="White geometric door outline">
    <path
      d="M 0 500 L 0 0 L -80 -120 L -80 380 L 0 500"
      fill="none"
      stroke="#fff"
      stroke-width="1"
      vector-effect="non-scaling-stroke"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
</body>
</html>
