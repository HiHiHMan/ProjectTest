<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Door — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
    }
    .door-lines {
      width: min(26vw, 156px);
      height: min(46vh, 340px);
      display: block;
    }
  </style>
</head>
<body>
  <svg class="door-lines" viewBox="-90 -130 100 650" preserveAspectRatio="none" aria-label="White geometric door outline">
    <defs>
      <linearGradient id="door-light" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
        <stop offset="55%" stop-color="#fff" stop-opacity="0.72" />
        <stop offset="100%" stop-color="#fff" stop-opacity="0.95" />
      </linearGradient>
      <filter id="door-glow" x="-100%" y="-30%" width="300%" height="160%">
        <feGaussianBlur stdDeviation="12" />
      </filter>
    </defs>
    <path
      d="M 0 500 L 0 0 L -80 -120 L -80 380 Z"
      fill="#fff"
      opacity="0.55"
      filter="url(#door-glow)"
    />
    <path
      d="M 0 500 L 0 0 L -80 -120 L -80 380 Z"
      fill="url(#door-light)"
    />
    <path
      d="M 0 500 L 0 0 L -80 -120 L -80 380 L 0 500"
      fill="none"
      stroke="#fff"
      stroke-width="1"
      vector-effect="non-scaling-stroke"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
</body>
</html>
