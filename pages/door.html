<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Door — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      perspective: 1000px;
    }
    .door-frame {
      width: min(30vw, 300px);
      height: min(68vh, 480px);
      min-width: 180px;
      min-height: 280px;
      border: 2px solid #fff;
      background: transparent;
      transform: rotateY(-28deg) rotateX(5deg) rotateZ(-2deg);
      transform-style: preserve-3d;
    }
  </style>
</head>
<body>
  <div class="door-frame" aria-label="Empty white rectangular frame"></div>
</body>
</html>
