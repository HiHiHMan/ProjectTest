<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .star-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .star {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 94%, 50% 72%, 21% 94%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 3px #fff7c2) drop-shadow(0 0 7px #ffe36b) drop-shadow(0 0 15px #ffc400) drop-shadow(0 0 28px rgba(255, 190, 0, 1));
      animation: starPulse 1.8s ease-in-out infinite;
    }
    @keyframes starPulse {
      0%, 100% {
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 3px #fff7c2) drop-shadow(0 0 7px #ffe36b) drop-shadow(0 0 15px #ffc400) drop-shadow(0 0 28px rgba(255, 190, 0, 1));
      }
      50% {
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #fff0a0) drop-shadow(0 0 24px #ffd000) drop-shadow(0 0 42px rgba(255, 180, 0, 1));
      }
    }
    .girl-wrap {
      position: relative;
      z-index: 1;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-image {
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="star-field" id="starField" aria-hidden="true"></div>
  <div class="girl-wrap">
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
  <script>
    const starField = document.getElementById('starField');
    const star = document.createElement('span');
    star.className = 'star';
    starField.appendChild(star);
  </script>
</body>
</html>
