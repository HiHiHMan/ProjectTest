<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .girl-wrap {
      position: relative;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-image {
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="girl-wrap">
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
</body>
</html>
