<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1d">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: #fff4fb;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%, #492b55 0%, #21152f 43%, #090812 100%);
    }
    main {
      width: min(100%, 440px);
      text-align: center;
    }
    .girl-card {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 4 / 5;
      padding: 22px;
      overflow: hidden;
      border: 1px solid #f7d7f044;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff12, #ffffff04);
      box-shadow: 0 24px 80px #0007, inset 0 0 45px #f4b8e20c;
      backdrop-filter: blur(12px);
    }
    .girl-card::before {
      content: "";
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #e9a9ff22;
      filter: blur(42px);
      pointer-events: none;
    }
    .girl-image {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 12px 28px #0006);
      animation: float 5s ease-in-out infinite;
    }
    .sparkle {
      position: absolute;
      z-index: 2;
      color: #ffe4f6;
      text-shadow: 0 0 12px #ff9cda, 0 0 28px #c66aff;
      pointer-events: none;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .sparkle-one { top: 9%; left: 10%; font-size: 25px; }
    .sparkle-two { right: 9%; bottom: 13%; font-size: 19px; animation-delay: .8s; }
    h1 {
      margin: 25px 0 0;
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 500;
      letter-spacing: .08em;
      background: linear-gradient(90deg, #ffe4f5, #d8b8ff, #fff0c9);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }
    .back {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 16px;
      border: 1px solid #f5c8e64d;
      border-radius: 999px;
      color: #f8dff0;
      font-size: 11px;
      letter-spacing: .12em;
      text-decoration: none;
      transition: background .25s, border-color .25s;
    }
    .back:hover { background: #f5c8e61c; border-color: #f5c8e6; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .55; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="girl-card" aria-label="GirlStar portrait">
      <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
      <img class="girl-image" src="../images/girl.png" alt="Girl">
      <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
    </section>
    <h1>GirlStar</h1>
    <a class="back" href="../index.html">← Experiments</a>
  </main>
</body>
</html>
