<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .star-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .star-glow {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, transparent 36%, rgba(255, 210, 90, .18) 42%, rgba(255, 235, 150, .8) 86%, rgba(255, 185, 35, .42) -21%, transparent 27%);
      filter: blur(2px) drop-shadow(0 0 4px rgba(255, 235, 150, .9)) drop-shadow(0 0 10px rgba(255, 190, 35, .75));
      opacity: 0.6;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-sparks {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 49%;
      width: 0;
      height: 0;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-spark {
      position: absolute;
      left: 0;
      top: 0;
      width: 9px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #fff 0%, #fff4b0 38%, #ffc83d 100%);
      box-shadow: 0 0 5px rgba(255, 244, 180, .95), 0 0 10px rgba(255, 190, 35, .8);
      opacity: 0;
      animation: sparkFly var(--duration) ease-out var(--delay) infinite;
    }
    @keyframes sparkFly {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(.45); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(0px - var(--distance))) scale(.12); }
    }
    .rainbow-star-canvas {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .star {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 49%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
      clip-path: path("M 9 1.2 C 10.5 1.2 10.6 4.5 11.8 5.5 C 13.1 6.6 16.7 5.7 17.5 7 C 18.2 8.3 14.3 9.7 13.2 10.8 C 12.1 12 14.9 15.5 13.8 16.4 C 12.7 17.3 10.1 14.4 9 14.1 C 7.9 14.4 5.3 17.3 4.2 16.4 C 3.1 15.5 5.9 12 4.8 10.8 C 3.7 9.7 -0.2 8.3 0.5 7 C 1.3 5.7 4.9 6.6 6.2 5.5 C 7.4 4.5 7.5 1.2 9 1.2 Z");
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 3px #fff7c2) drop-shadow(0 0 7px #ffe36b) drop-shadow(0 0 15px #ffc400) drop-shadow(0 0 28px rgba(255, 190, 0, 1));
      animation: starTwinkle .9s ease-in-out infinite, starFloat 2.2s ease-in-out infinite;
    }
    @keyframes starFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 4px)); }
    }
    @keyframes starTwinkle {
      0%, 100% {
        opacity: .75;
        background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 4px #ffe36b) drop-shadow(0 0 12px #ffc400) drop-shadow(0 0 24px rgba(255, 190, 0, .9));
      }
      50% {
        opacity: 1;
        background: radial-gradient(ellipse at 32% 24%, #ffffff 0%, #fffef0 18%, #fff1b8 42%, #f5c95b 72%, #b87919 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px #fff) drop-shadow(0 0 28px rgba(210, 225, 255, 1)) drop-shadow(0 0 48px rgba(255, 255, 255, 1));
      }
    }
    .girl-wrap {
      position: relative;
      z-index: 1;
      isolation: isolate;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-wrap::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      top: 48%;
      width: 48%;
      height: 62%;
      transform: translate(-50%, -50%);
      border-radius: 48% 52% 28% 28% / 34% 34% 66% 66%;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 255, 235, .62) 0%, rgba(255, 239, 190, .34) 28%, rgba(255, 218, 145, .16) 55%, transparent 76%),
        repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 246, 215, .18) 0deg 4deg, transparent 4deg 22deg);
      filter: blur(10px);
      opacity: .82;
      pointer-events: none;
    }
    .girl-image {
      position: relative;
      z-index: 1;
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="star-field" id="starField" aria-hidden="true"></div>
  <div class="girl-wrap">
    <canvas class="rainbow-star-canvas" aria-hidden="true"></canvas>
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
  <script>
    const starField = document.getElementById('starField');

    const girlWrap = document.querySelector('.girl-wrap');
    const rainbowColors = [
      '#ff3b50', '#ff861f', '#ffce12',
      '#2bc260', '#2092fa', '#5d56d8', '#b34fdc'
    ];

    // วาดดาวตกแต่งทั้งหมดด้วย WebGL บน Canvas เดียว
    const starCanvas = document.querySelector('.rainbow-star-canvas');
    const starCount = 34;
    const starData = [];

    for (let i = 0; i < starCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 0.88;
      const x = 0.5 + Math.cos(angle) * 0.22 * radius;
      const y = 0.48 + Math.sin(angle) * 0.29 * radius;
      const color = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
      const points = Math.random() < 0.5 ? 5 : 4;

      starData.push({
        x,
        y,
        color: [
          parseInt(color.slice(1, 3), 16) / 255,
          parseInt(color.slice(3, 5), 16) / 255,
          parseInt(color.slice(5, 7), 16) / 255
        ],
        points,
        size: 22 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2
      });
    }

    const gl = starCanvas.getContext('webgl', {
      alpha: true,
      antialias: true,
      premultipliedAlpha: false
    });

    if (!gl) {
      // Fallback สำหรับอุปกรณ์ที่ไม่รองรับ WebGL
      const ctx = starCanvas.getContext('2d');
      const drawFallbackStars = () => {
        const rect = girlWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        starCanvas.width = Math.round(rect.width * dpr);
        starCanvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);

        starData.forEach((item) => {
          const color = 'rgb(' + item.color.map(v => Math.round(v * 255)).join(',') + ')';
          const cx = item.x * rect.width;
          const cy = item.y * rect.height;
          const outer = item.size * 0.42;
          const inner = outer * 0.58;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.shadowColor = color;
          ctx.shadowBlur = 13;
          ctx.fillStyle = color;
          ctx.beginPath();

          for (let j = 0; j < item.points * 2; j++) {
            const a = -Math.PI / 2 + j * Math.PI / item.points;
            const radius = j % 2 === 0 ? outer : inner;
            const px = Math.cos(a) * radius;
            const py = Math.sin(a) * radius;
            if (j === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }

          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });
      };

      drawFallbackStars();
      window.addEventListener('resize', drawFallbackStars);
    } else {
      const vertexSource = `
        attribute vec2 a_center;
        attribute vec3 a_color;
        attribute float a_size;
        attribute float a_points;
        attribute float a_phase;
        uniform float u_dpr;
        varying vec3 v_color;
        varying float v_points;
        varying float v_phase;

        void main() {
          gl_Position = vec4(a_center.x * 2.0 - 1.0, 1.0 - a_center.y * 2.0, 0.0, 1.0);
          gl_PointSize = a_size * u_dpr;
          v_color = a_color;
          v_points = a_points;
          v_phase = a_phase;
        }
      `;

      const fragmentSource = `
        precision mediump float;
        uniform float u_time;
        varying vec3 v_color;
        varying float v_points;
        varying float v_phase;

        void main() {
          vec2 p = (gl_PointCoord - 0.5) * 2.0;
          float radius = length(p);
          float angle = atan(p.y, p.x);
          float wave = 0.5 + 0.5 * cos(v_points * angle);
          float edgeRadius = 0.56 + 0.28 * pow(wave, 1.35);
          float edge = 1.0 - smoothstep(edgeRadius - 0.045, edgeRadius + 0.025, radius);
          float glow = exp(-max(radius - edgeRadius, 0.0) * 9.0)
                     * (1.0 - smoothstep(edgeRadius, 1.55, radius));
          float twinkle = 0.88 + 0.12 * sin(u_time * 1.7 + v_phase);
          float alpha = clamp(edge + glow * 0.42, 0.0, 1.0) * twinkle;
          vec3 brightColor = mix(v_color, vec3(1.0), edge * 0.2);
          vec3 finalColor = brightColor * (edge * 1.15 + glow * 0.72) * twinkle;

          if (alpha < 0.015) discard;
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      const compileShader = (type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Star shader error:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      };

      const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);

      if (vertexShader && fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
          gl.useProgram(program);

          const attributes = {
            center: gl.getAttribLocation(program, 'a_center'),
            color: gl.getAttribLocation(program, 'a_color'),
            size: gl.getAttribLocation(program, 'a_size'),
            points: gl.getAttribLocation(program, 'a_points'),
            phase: gl.getAttribLocation(program, 'a_phase')
          };
          const uniforms = {
            dpr: gl.getUniformLocation(program, 'u_dpr'),
            time: gl.getUniformLocation(program, 'u_time')
          };

          const makeBuffer = (location, size, values) => {
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(values), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(location);
            gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
            return buffer;
          };

          makeBuffer(attributes.center, 2, starData.flatMap(item => [item.x, item.y]));
          makeBuffer(attributes.color, 3, starData.flatMap(item => item.color));
          makeBuffer(attributes.size, 1, starData.map(item => item.size));
          makeBuffer(attributes.points, 1, starData.map(item => item.points));
          makeBuffer(attributes.phase, 1, starData.map(item => item.phase));

          const resizeStarCanvas = () => {
            const rect = girlWrap.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            starCanvas.width = Math.max(1, Math.round(rect.width * dpr));
            starCanvas.height = Math.max(1, Math.round(rect.height * dpr));
            gl.viewport(0, 0, starCanvas.width, starCanvas.height);
            gl.uniform1f(uniforms.dpr, dpr);
          };

          const resizeObserver = new ResizeObserver(resizeStarCanvas);
          resizeObserver.observe(girlWrap);
          window.addEventListener('resize', resizeStarCanvas);
          resizeStarCanvas();

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
          gl.clearColor(0, 0, 0, 0);

          const renderStars = (timestamp) => {
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform1f(uniforms.time, timestamp * 0.001);
            gl.drawArrays(gl.POINTS, 0, starData.length);
            requestAnimationFrame(renderStars);
          };

          requestAnimationFrame(renderStars);
        } else {
          console.error('Unable to link star WebGL program:', gl.getProgramInfoLog(program));
        }
      }
    }

    const glow = document.createElement('span');
    glow.className = 'star-glow';
    starField.appendChild(glow);

    const sparks = document.createElement('span');
    sparks.className = 'star-sparks';
    starField.appendChild(sparks);

    for (let i = 0; i < 40; i++) {
      const spark = document.createElement('span');
      const angle = (i * 9) + (Math.random() * 8 - 4);
      const distance = 18 + Math.random() * 20;
      const duration = 1.1 + Math.random() * 0.7;
      spark.className = 'star-spark';
      spark.style.setProperty('--angle', angle + 'deg');
      spark.style.setProperty('--distance', distance + 'px');
      spark.style.setProperty('--duration', duration + 's');
      spark.style.setProperty('--delay', (-Math.random() * duration) + 's');
      sparks.appendChild(spark);
    }

    const star = document.createElement('span');
    star.className = 'star';
    starField.appendChild(star);
  </script>
</body>
</html>
