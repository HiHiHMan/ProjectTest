<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1d">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff4fb;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 45%, #392044 0%, #1b122b 42%, #090812 100%);
    }
    main { text-align: center; padding: 24px; }
    .star {
      display: block;
      margin: 0 auto 24px;
      color: #ffd9f2;
      font-size: clamp(72px, 16vw, 150px);
      line-height: 1;
      text-shadow: 0 0 18px #ff9cda, 0 0 52px #c66aff88;
      animation: float 4s ease-in-out infinite, twinkle 2.8s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 64px);
      font-weight: 500;
      letter-spacing: .08em;
      background: linear-gradient(90deg, #ffe4f5, #d8b8ff, #fff0c9);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }
    .back {
      display: inline-block;
      margin-top: 34px;
      padding: 10px 16px;
      border: 1px solid #f5c8e64d;
      border-radius: 999px;
      color: #f8dff0;
      font-size: 11px;
      letter-spacing: .12em;
      text-decoration: none;
      transition: background .25s, border-color .25s;
    }
    .back:hover { background: #f5c8e61c; border-color: #f5c8e6; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-14px) rotate(5deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .78; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="star" aria-hidden="true">✦</span>
    <h1>GirlStar</h1>
    <a class="back" href="../index.html">← Experiments</a>
  </main>
</body>
</html>
