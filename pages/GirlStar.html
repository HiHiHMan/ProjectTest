<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .star-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .star-glow {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, transparent 36%, rgba(255, 210, 90, .18) 42%, rgba(255, 235, 150, .8) 86%, rgba(255, 185, 35, .42) -21%, transparent 27%);
      filter: blur(2px) drop-shadow(0 0 4px rgba(255, 235, 150, .9)) drop-shadow(0 0 10px rgba(255, 190, 35, .75));
      opacity: 0.6;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-sparks {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 49%;
      width: 0;
      height: 0;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-spark {
      position: absolute;
      left: 0;
      top: 0;
      width: 9px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #fff 0%, #fff4b0 38%, #ffc83d 100%);
      box-shadow: 0 0 5px rgba(255, 244, 180, .95), 0 0 10px rgba(255, 190, 35, .8);
      opacity: 0;
      animation: sparkFly var(--duration) ease-out var(--delay) infinite;
    }
    @keyframes sparkFly {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(.45); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(0px - var(--distance))) scale(.12); }
    }
    .rainbow-star {
      position: absolute;
      z-index: 0;
      width: 18px;
      height: 18px;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      background: var(--star-color);
      filter:
        drop-shadow(0 2px 2px rgba(0, 0, 0, .95))
        drop-shadow(0 0 3px #ffffff)
        drop-shadow(0 0 7px var(--star-color))
        drop-shadow(0 0 15px var(--star-color))
        drop-shadow(0 0 28px var(--star-color));
      opacity: 1;
    }
    .rainbow-star svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .rainbow-star svg path {
      fill: var(--star-color);
    }
    .star {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 49%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
      clip-path: path("M 9 1.2 C 10.5 1.2 10.6 4.5 11.8 5.5 C 13.1 6.6 16.7 5.7 17.5 7 C 18.2 8.3 14.3 9.7 13.2 10.8 C 12.1 12 14.9 15.5 13.8 16.4 C 12.7 17.3 10.1 14.4 9 14.1 C 7.9 14.4 5.3 17.3 4.2 16.4 C 3.1 15.5 5.9 12 4.8 10.8 C 3.7 9.7 -0.2 8.3 0.5 7 C 1.3 5.7 4.9 6.6 6.2 5.5 C 7.4 4.5 7.5 1.2 9 1.2 Z");
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 3px #fff7c2) drop-shadow(0 0 7px #ffe36b) drop-shadow(0 0 15px #ffc400) drop-shadow(0 0 28px rgba(255, 190, 0, 1));
      animation: starTwinkle .9s ease-in-out infinite, starFloat 2.2s ease-in-out infinite;
    }
    @keyframes starFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 4px)); }
    }
    @keyframes starTwinkle {
      0%, 100% {
        opacity: .75;
        background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 4px #ffe36b) drop-shadow(0 0 12px #ffc400) drop-shadow(0 0 24px rgba(255, 190, 0, .9));
      }
      50% {
        opacity: 1;
        background: radial-gradient(ellipse at 32% 24%, #ffffff 0%, #fffef0 18%, #fff1b8 42%, #f5c95b 72%, #b87919 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px #fff) drop-shadow(0 0 28px rgba(210, 225, 255, 1)) drop-shadow(0 0 48px rgba(255, 255, 255, 1));
      }
    }
    .girl-wrap {
      position: relative;
      z-index: 1;
      isolation: isolate;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-wrap::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      top: 48%;
      width: 48%;
      height: 62%;
      transform: translate(-50%, -50%);
      border-radius: 48% 52% 28% 28% / 34% 34% 66% 66%;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 255, 235, .62) 0%, rgba(255, 239, 190, .34) 28%, rgba(255, 218, 145, .16) 55%, transparent 76%),
        repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 246, 215, .18) 0deg 4deg, transparent 4deg 22deg);
      filter: blur(10px);
      opacity: .82;
      pointer-events: none;
    }
    .girl-image {
      position: relative;
      z-index: 1;
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="star-field" id="starField" aria-hidden="true"></div>
  <div class="girl-wrap">
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
  <script>
    const starField = document.getElementById('starField');

    const girlWrap = document.querySelector('.girl-wrap');
    const rainbowColors = [
      '#ff4d5e', '#ff922e', '#ffd426',
      '#35c96b', '#299cff', '#665fe0', '#b95bea'
    ];

    // กระจายดาวให้อยู่ภายในบริเวณแสงวงรีด้านหลัง Girl
    for (let i = 0; i < 34; i++) {
      const decorativeStar = document.createElement('span');
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 0.88;
      const x = 50 + Math.cos(angle) * 22 * radius;
      const y = 48 + Math.sin(angle) * 29 * radius;

      decorativeStar.className = 'rainbow-star ' +
        (Math.random() < 0.5 ? 'five-point' : 'four-point');
      decorativeStar.style.setProperty('--x', x + '%');
      decorativeStar.style.setProperty('--y', y + '%');
      decorativeStar.style.setProperty('--star-scale', '1');
      decorativeStar.style.setProperty(
        '--star-color',
        rainbowColors[Math.floor(Math.random() * rainbowColors.length)]
      );

      const starSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      starSvg.setAttribute('viewBox', '0 0 182 182');
      starSvg.setAttribute('aria-hidden', 'true');

      const starPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      starPath.setAttribute(
        'd',
        decorativeStar.classList.contains('five-point')
          ? 'M77.2839 10.3648 C81.7742 -3.45491 101.325 -3.45494 105.816 10.3647 L117.144 45.231 C119.152 51.4113 124.912 55.5958 131.41 55.5958 H168.071 C182.602 55.5958 188.643 74.19 176.888 82.731 L147.229 104.28 C141.971 108.099 139.771 114.87 141.779 121.05 L153.108 155.916 C157.598 169.736 141.781 181.228 130.026 172.687 L100.367 151.138 C95.1092 147.319 87.9903 147.319 82.733 151.138 L53.0739 172.687 C41.3182 181.228 25.501 169.736 29.9913 155.916 L41.32 121.05 C43.3281 114.87 41.1283 108.099 35.871 104.28 L6.21195 82.731 C-5.54375 74.19 0.497856 55.5958 15.0287 55.5958 H51.6893 C58.1877 55.5958 63.947 51.4114 65.9551 45.231 Z'
          : 'M91 4 C96 4 98 31 106 39 C114 47 142 48 147 54 C152 60 130 76 124 82 C118 88 132 112 127 117 C122 122 101 105 91 105 C81 105 60 122 55 117 C50 112 64 88 58 82 C52 76 30 60 35 54 C40 48 68 47 76 39 C84 31 86 4 91 4 Z'
      );
      starSvg.appendChild(starPath);
      decorativeStar.appendChild(starSvg);
      girlWrap.appendChild(decorativeStar);
    }

    const glow = document.createElement('span');
    glow.className = 'star-glow';
    starField.appendChild(glow);

    const sparks = document.createElement('span');
    sparks.className = 'star-sparks';
    starField.appendChild(sparks);

    for (let i = 0; i < 40; i++) {
      const spark = document.createElement('span');
      const angle = (i * 9) + (Math.random() * 8 - 4);
      const distance = 18 + Math.random() * 20;
      const duration = 1.1 + Math.random() * 0.7;
      spark.className = 'star-spark';
      spark.style.setProperty('--angle', angle + 'deg');
      spark.style.setProperty('--distance', distance + 'px');
      spark.style.setProperty('--duration', duration + 's');
      spark.style.setProperty('--delay', (-Math.random() * duration) + 's');
      sparks.appendChild(spark);
    }

    const star = document.createElement('span');
    star.className = 'star';
    starField.appendChild(star);
  </script>
</body>
</html>
