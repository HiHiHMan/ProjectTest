<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .girl {
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .reflection {
      position: relative;
      width: min(70vw, 100%);
      height: 22.5vh;
      overflow: hidden;
      transform: scaleY(-1);
      opacity: .48;
      filter: blur(1px);
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #0009 35%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #0009 35%, transparent 100%);
    }
    .reflection img {
      display: block;
      max-width: 100%;
      max-height: 45vh;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }
    @media (max-height: 500px) {
      .reflection { height: 18vh; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <img class="girl" src="../images/girl.png" alt="Girl">
    <div class="reflection" aria-hidden="true">
      <img src="../images/girl.png" alt="">
    </div>
  </main>
</body>
</html>
