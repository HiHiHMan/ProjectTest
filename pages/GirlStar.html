<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .star-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .star {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: #ffde6d;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 94%, 50% 72%, 21% 94%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 0 2px #ffd54a) drop-shadow(0 0 5px rgba(255, 210, 70, .9));
    }
    .girl-wrap {
      position: relative;
      z-index: 1;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-image {
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="star-field" id="starField" aria-hidden="true"></div>
  <div class="girl-wrap">
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
  <script>
    const starField = document.getElementById('starField');
    const star = document.createElement('span');
    star.className = 'star';
    starField.appendChild(star);
  </script>
</body>
</html>
