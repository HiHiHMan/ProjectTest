<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlStar</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .star-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .star-glow {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, transparent 36%, rgba(255, 210, 90, .18) 42%, rgba(255, 235, 150, .8) 86%, rgba(255, 185, 35, .42) -21%, transparent 27%);
      filter: blur(2px) drop-shadow(0 0 4px rgba(255, 235, 150, .9)) drop-shadow(0 0 10px rgba(255, 190, 35, .75));
      opacity: 0.6;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-sparks {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 49%;
      width: 0;
      height: 0;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .star-spark {
      position: absolute;
      left: 0;
      top: 0;
      width: 9px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #fff 0%, #fff4b0 38%, #ffc83d 100%);
      box-shadow: 0 0 5px rgba(255, 244, 180, .95), 0 0 10px rgba(255, 190, 35, .8);
      opacity: 0;
      animation: sparkFly var(--duration) ease-out var(--delay) infinite;
    }
    @keyframes sparkFly {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(.45); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(0px - var(--distance))) scale(.12); }
    }
    .star {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 49%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
      clip-path: path("M 9 0 C 9.8 0 10.5 4.1 11.5 5.7 C 13.2 5.8 17.8 5.5 18 6.5 C 18.2 7.5 14.2 9.5 12.8 10.5 C 13.2 12.3 15.1 16.5 14.2 17.1 C 13.3 17.8 10.2 14.8 9 14 C 7.5 14.8 4.3 17.8 3.5 17.1 C 2.6 16.4 4.8 12.3 5.2 10.5 C 3.8 9.5 -0.2 7.5 0 6.5 C 0.2 5.5 4.8 5.8 6.5 5.7 C 7.5 4.1 8.2 0 9 0 Z");
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 3px #fff7c2) drop-shadow(0 0 7px #ffe36b) drop-shadow(0 0 15px #ffc400) drop-shadow(0 0 28px rgba(255, 190, 0, 1));
      animation: starTwinkle .9s ease-in-out infinite, starFloat 2.2s ease-in-out infinite;
    }
    @keyframes starFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, calc(-50% - 4px)); }
    }
    @keyframes starTwinkle {
      0%, 100% {
        opacity: .75;
        background: radial-gradient(ellipse at 32% 24%, #fffde2 0%, #fff1a8 16%, #ffde6d 38%, #f5b936 68%, #a96b12 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 4px #ffe36b) drop-shadow(0 0 12px #ffc400) drop-shadow(0 0 24px rgba(255, 190, 0, .9));
      }
      50% {
        opacity: 1;
        background: radial-gradient(ellipse at 32% 24%, #ffffff 0%, #fffef0 18%, #fff1b8 42%, #f5c95b 72%, #b87919 100%);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .95)) drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px #fff) drop-shadow(0 0 28px rgba(210, 225, 255, 1)) drop-shadow(0 0 48px rgba(255, 255, 255, 1));
      }
    }
    .girl-wrap {
      position: relative;
      z-index: 1;
      display: inline-block;
      max-width: 70vw;
      max-height: 45vh;
    }
    .girl-image {
      display: block;
      max-width: 70vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 70%, rgba(0, 0, 0, 0.05) 100%);
    }
    .girl-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      clip-path: inset(72% 0 0 0);
      filter: blur(.7px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="star-field" id="starField" aria-hidden="true"></div>
  <div class="girl-wrap">
    <img class="girl-image" src="../images/girl.png" alt="Girl">
    <img class="girl-blur" src="../images/girl.png" alt="" aria-hidden="true">
  </div>
  <script>
    const starField = document.getElementById('starField');
    const glow = document.createElement('span');
    glow.className = 'star-glow';
    starField.appendChild(glow);

    const sparks = document.createElement('span');
    sparks.className = 'star-sparks';
    starField.appendChild(sparks);

    for (let i = 0; i < 40; i++) {
      const spark = document.createElement('span');
      const angle = (i * 9) + (Math.random() * 8 - 4);
      const distance = 18 + Math.random() * 20;
      const duration = 1.1 + Math.random() * 0.7;
      spark.className = 'star-spark';
      spark.style.setProperty('--angle', angle + 'deg');
      spark.style.setProperty('--distance', distance + 'px');
      spark.style.setProperty('--duration', duration + 's');
      spark.style.setProperty('--delay', (-Math.random() * duration) + 's');
      sparks.appendChild(spark);
    }

    const star = document.createElement('span');
    star.className = 'star';
    starField.appendChild(star);
  </script>
</body>
</html>
