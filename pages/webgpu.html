<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <title>WebGPU — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
    body { display: grid; place-items: center; }
    canvas { width: min(70vmin, 420px); height: min(70vmin, 420px); display: block; }
    .message { position: fixed; bottom: 28px; color: #8b96aa; font: 12px/1.5 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <canvas id="gpu"></canvas>
  <p class="message" id="status">WebGPU · Animated triangle</p>
  <script type="module">
    const canvas = document.querySelector("#gpu");
    const status = document.querySelector("#status");

    if (!navigator.gpu) {
      status.textContent = "WebGPU is not available in this browser";
    } else {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        status.textContent = "No compatible GPU adapter found";
      } else {
        const device = await adapter.requestDevice();
        const context = canvas.getContext("webgpu");
        const format = navigator.gpu.getPreferredCanvasFormat();

        const shader = device.createShaderModule({ code: `
          struct Time { value: f32 }
          @group(0) @binding(0) var<uniform> clock: Time;

          struct VertexOut {
            @builtin(position) position: vec4f,
            @location(0) color: vec3f,
          }

          @vertex fn vertexMain(@builtin(vertex_index) index: u32) -> VertexOut {
            let points = array<vec2f, 3>(
              vec2f(0.0, 0.72),
              vec2f(-0.66, -0.48),
              vec2f(0.66, -0.48)
            );
            let colors = array<vec3f, 3>(
              vec3f(0.25, 0.88, 1.0),
              vec3f(0.48, 0.42, 1.0),
              vec3f(0.95, 0.38, 0.78)
            );
            let angle = clock.value * 0.45;
            let p = points[index];
            let rotated = vec2f(
              p.x * cos(angle) - p.y * sin(angle),
              p.x * sin(angle) + p.y * cos(angle)
            );
            var out: VertexOut;
            out.position = vec4f(rotated, 0.0, 1.0);
            out.color = colors[index];
            return out;
          }

          @fragment fn fragmentMain(input: VertexOut) -> @location(0) vec4f {
            return vec4f(input.color, 1.0);
          }
        ` });

        const uniformBuffer = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });
        const bindGroupLayout = device.createBindGroupLayout({
          entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } }]
        });
        const bindGroup = device.createBindGroup({
          layout: bindGroupLayout,
          entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
        });
        const pipeline = device.createRenderPipeline({
          layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
          vertex: { module: shader, entryPoint: "vertexMain" },
          fragment: {
            module: shader,
            entryPoint: "fragmentMain",
            targets: [{ format }]
          },
          primitive: { topology: "triangle-list" }
        });

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          const size = Math.max(1, Math.floor(Math.min(innerWidth * 0.7, innerHeight * 0.7, 420) * dpr));
          if (canvas.width !== size || canvas.height !== size) {
            canvas.width = size;
            canvas.height = size;
          }
          context.configure({ device, format, alphaMode: "opaque" });
        }

        const start = performance.now();
        function frame(now) {
          resize();
          device.queue.writeBuffer(uniformBuffer, 0, new Float32Array([(now - start) / 1000]));
          const encoder = device.createCommandEncoder();
          const pass = encoder.beginRenderPass({
            colorAttachments: [{
              view: context.getCurrentTexture().createView(),
              clearValue: { r: 0.02, g: 0.025, b: 0.05, a: 1 },
              loadOp: "clear",
              storeOp: "store"
            }]
          });
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bindGroup);
          pass.draw(3);
          pass.end();
          device.queue.submit([encoder.finish()]);
          requestAnimationFrame(frame);
        }
        status.textContent = "WebGPU · Live GPU rendering";
        requestAnimationFrame(frame);
      }
    }
  </script>
</body>
</html>
