<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    const gradientColors = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8', '#FF8C42',
      '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];
    let width = 0, height = 0, dpr = 1, stars = [];

    function createStars() {
      const cloudWidth = Math.min(width * .9, 660);
      const spread = cloudWidth * .39;

      const cloudExitY = Math.min(height * .43, 390);

      stars = Array.from({ length: 16 }, () => ({
        x: width / 2 + (Math.random() - .5) * spread * 2,
        y: cloudExitY + height * (.22 + Math.random() * .25),
        color: colors[Math.floor(Math.random() * colors.length)],
        trailColor: gradientColors[Math.floor(Math.random() * gradientColors.length)],
        trailStartY: cloudExitY,
        symbol: Math.random() < .5 ? '✦' : '✧',
        fontSize: 17 + Math.random() * 7
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      stars.forEach(star => {
        const tailY = star.trailStartY;
        const trail = ctx.createLinearGradient(star.x, tailY, star.x, star.y);
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(.48, star.trailColor + '55');
        trail.addColorStop(.82, star.trailColor + 'dd');
        trail.addColorStop(1, '#ffffff');

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(star.x, tailY);
        ctx.lineTo(star.x, star.y);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = star.trailColor;
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.font = `${star.fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 10;
        ctx.fillText(star.symbol, star.x, star.y);
        ctx.restore();
      });
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
  })();
  </script>
</main>

</body>
</html>
