<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="cloud-layer cloud-layer-back" aria-hidden="true">
    <span class="mini-cloud" style="--x:5%;--y:17%;--w:180px;--delay:-0.3s"></span>
    <span class="mini-cloud" style="--x:20%;--y:31%;--w:145px;--delay:-3.7s"></span>
    <span class="mini-cloud" style="--x:36%;--y:13%;--w:205px;--delay:-7.2s"></span>
    <span class="mini-cloud" style="--x:54%;--y:25%;--w:165px;--delay:-10.8s"></span>
    <span class="mini-cloud" style="--x:72%;--y:15%;--w:190px;--delay:-14.4s"></span>
    <span class="mini-cloud" style="--x:91%;--y:29%;--w:155px;--delay:-18.1s"></span>
  </div>
  <div class="cloud-layer cloud-layer-mid" aria-hidden="true">
    <span class="mini-cloud" style="--x:0%;--y:49%;--w:155px;--delay:0s"></span>
    <span class="mini-cloud" style="--x:15%;--y:65%;--w:125px;--delay:-3.5s"></span>
    <span class="mini-cloud" style="--x:31%;--y:46%;--w:185px;--delay:-7s"></span>
    <span class="mini-cloud" style="--x:48%;--y:61%;--w:145px;--delay:-10.5s"></span>
    <span class="mini-cloud" style="--x:65%;--y:48%;--w:175px;--delay:-14.1s"></span>
    <span class="mini-cloud" style="--x:82%;--y:66%;--w:135px;--delay:-17.6s"></span>
    <span class="mini-cloud" style="--x:98%;--y:51%;--w:165px;--delay:-21.1s"></span>
  </div>
  <div class="cloud-layer cloud-layer-front" aria-hidden="true">
    <span class="mini-cloud" style="--x:8%;--y:82%;--w:135px;--delay:-0.4s"></span>
    <span class="mini-cloud" style="--x:25%;--y:91%;--w:110px;--delay:-4s"></span>
    <span class="mini-cloud" style="--x:42%;--y:77%;--w:155px;--delay:-7.5s"></span>
    <span class="mini-cloud" style="--x:59%;--y:89%;--w:120px;--delay:-11.1s"></span>
    <span class="mini-cloud" style="--x:76%;--y:79%;--w:150px;--delay:-14.6s"></span>
    <span class="mini-cloud" style="--x:94%;--y:91%;--w:115px;--delay:-18.2s"></span>
  </div>
  <div class="star-field" aria-hidden="true"></div>
</main>

</body>
</html>
