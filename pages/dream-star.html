<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    const gradientColors = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8', '#FF8C42',
      '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];
    let width = 0, height = 0, dpr = 1, meteors = [];
    let nextWaveAt = 0;

    function createMeteors() {
      meteors = Array.from({ length: 4 }, () => ({
        active: false,
        x: 0,
        y: 0,
        progress: 0,
        length: 650 + Math.random() * 450,
        speed: .00016 + Math.random() * .000035,
        angle: Math.PI / 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        gradientColor: gradientColors[Math.floor(Math.random() * gradientColors.length)],
        symbol: Math.random() < .5 ? '✦' : '✧',
        fontSize: 17 + Math.random() * 7
      }));
      nextWaveAt = performance.now() + 1800;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createMeteors();
    }

    function launchWave(time) {
      const cloudWidth = Math.min(width * .9, 660);
      const cloudLeft = (width - cloudWidth) / 2;
      const spread = cloudWidth * .39;

      meteors.forEach((meteor, index) => {
        meteor.active = true;
        meteor.progress = 0;
        meteor.x = width / 2 + (Math.random() - .5) * spread * 2;
        meteor.y = 285 + Math.random() * 115;
        meteor.length = 650 + Math.random() * 500;
        meteor.speed = .00016 + Math.random() * .000035;
        meteor.angle = Math.PI / 2;
        meteor.color = colors[Math.floor(Math.random() * colors.length)];
        meteor.gradientColor = gradientColors[Math.floor(Math.random() * gradientColors.length)];
        meteor.symbol = Math.random() < .5 ? '✦' : '✧';
        meteor.fontSize = 17 + Math.random() * 7;
      });
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);

      if (meteors.every(meteor => !meteor.active) && time >= nextWaveAt) {
        launchWave(time);
      }

      meteors.forEach(meteor => {
        if (!meteor.active) return;

        meteor.progress += meteor.speed * 16.67;
        const distance = meteor.progress * height * 1.4;
        const headX = meteor.x;
        const headY = meteor.y + distance;
        const tailX = headX;
        const tailY = headY - meteor.length;
        const fade = Math.min(1, meteor.progress * 7, (1 - meteor.progress) * 5);

        const trail = ctx.createLinearGradient(tailX, tailY, headX, headY);
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(.48, meteor.gradientColor + '55');
        trail.addColorStop(.82, meteor.gradientColor + 'dd');
        trail.addColorStop(1, '#ffffff');

        ctx.save();
        ctx.globalAlpha = Math.max(0, fade);

        // Long, soft outer glow
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(headX, headY);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 5;
        ctx.shadowColor = meteor.gradientColor;
        ctx.shadowBlur = 28;
        ctx.stroke();

        // Bright, narrow core
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(headX, headY);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.8;
        ctx.shadowColor = meteor.color;
        ctx.shadowBlur = 18;
        ctx.stroke();

        ctx.font = `${meteor.fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff8e8';
        ctx.shadowColor = meteor.gradientColor;
        ctx.shadowBlur = 22;
        ctx.fillText(meteor.symbol, headX, headY);
        ctx.restore();

        if (meteor.progress >= 1 || headY > height + meteor.length) {
          meteor.active = false;
        }
      });

      if (meteors.every(meteor => !meteor.active) && nextWaveAt <= time) {
        nextWaveAt = time + 2200 + Math.random() * 2500;
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(draw);
  })();
  </script>
</main>

</body>
</html>
