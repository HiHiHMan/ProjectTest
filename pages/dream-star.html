<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="cloud-layer cloud-layer-back" aria-hidden="true">
    <span class="mini-cloud" style="--x:4%;--y:18%;--size:92px;--delay:-0.2s"></span>
    <span class="mini-cloud" style="--x:17%;--y:28%;--size:72px;--delay:-2.6s"></span>
    <span class="mini-cloud" style="--x:29%;--y:12%;--size:108px;--delay:-5s"></span>
    <span class="mini-cloud" style="--x:42%;--y:24%;--size:78px;--delay:-7.4s"></span>
    <span class="mini-cloud" style="--x:57%;--y:16%;--size:96px;--delay:-10s"></span>
    <span class="mini-cloud" style="--x:70%;--y:29%;--size:74px;--delay:-12.4s"></span>
    <span class="mini-cloud" style="--x:84%;--y:14%;--size:110px;--delay:-14.9s"></span>
    <span class="mini-cloud" style="--x:96%;--y:25%;--size:82px;--delay:-17.2s"></span>
  </div>
  <div class="cloud-layer cloud-layer-mid" aria-hidden="true">
    <span class="mini-cloud" style="--x:1%;--y:54%;--size:88px;--delay:-0.1s"></span>
    <span class="mini-cloud" style="--x:13%;--y:67%;--size:66px;--delay:-2.4s"></span>
    <span class="mini-cloud" style="--x:26%;--y:48%;--size:104px;--delay:-4.8s"></span>
    <span class="mini-cloud" style="--x:39%;--y:62%;--size:76px;--delay:-7.3s"></span>
    <span class="mini-cloud" style="--x:53%;--y:51%;--size:94px;--delay:-9.7s"></span>
    <span class="mini-cloud" style="--x:67%;--y:69%;--size:72px;--delay:-12.2s"></span>
    <span class="mini-cloud" style="--x:80%;--y:49%;--size:102px;--delay:-14.6s"></span>
    <span class="mini-cloud" style="--x:94%;--y:63%;--size:84px;--delay:-17.1s"></span>
  </div>
  <div class="cloud-layer cloud-layer-front" aria-hidden="true">
    <span class="mini-cloud" style="--x:7%;--y:83%;--size:72px;--delay:-0.4s"></span>
    <span class="mini-cloud" style="--x:21%;--y:91%;--size:58px;--delay:-2.9s"></span>
    <span class="mini-cloud" style="--x:35%;--y:78%;--size:88px;--delay:-5.3s"></span>
    <span class="mini-cloud" style="--x:49%;--y:89%;--size:64px;--delay:-7.8s"></span>
    <span class="mini-cloud" style="--x:63%;--y:80%;--size:82px;--delay:-10.3s"></span>
    <span class="mini-cloud" style="--x:77%;--y:93%;--size:60px;--delay:-12.8s"></span>
    <span class="mini-cloud" style="--x:91%;--y:82%;--size:76px;--delay:-15.3s"></span>
  </div>
  <div class="star-field" aria-hidden="true"></div>
</main>

</body>
</html>
