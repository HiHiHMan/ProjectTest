<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <div class="cloud-decorations" aria-hidden="true"></div>
  <script>
  (() => {
    const container = document.querySelector('.cloud-decorations');
    const flowers = ['🌸', '🏵️'];

    for (let i = 0; i < 15; i++) {
      const flower = document.createElement('span');
      flower.className = 'cloud-flower';
      flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = (12 + Math.random() * 76) + '%';
      flower.style.top = (24 + Math.random() * 57) + '%';
      flower.style.fontSize = (19 + Math.random() * 13) + 'px';
      flower.style.transform = 'translate(-50%, -50%) rotate(' + (Math.random() * 50 - 25) + 'deg)';
      container.appendChild(flower);
    }
  })();
  </script>
  <canvas class="ambient-particles" aria-hidden="true"></canvas>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    const gradientColors = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8', '#FF8C42',
      '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];
    let width = 0, height = 0, dpr = 1, stars = [];

    // วงกลมเหล่านี้ตรงกับรูปทรงเมฆใน dream-scene::before
    const cloudPuffs = [
      [99, 159.8, 66], [178.2, 91.8, 58], [316.8, 146.2, 68],
      [257.4, 98.6, 62], [349.8, 68, 68], [435.6, 105.4, 64],
      [435.6, 224.4, 60], [448.8, 115.6, 90], [561, 159.8, 55],
      [191.4, 224.4, 68], [303.6, 227.8, 68], [158.4, 207.4, 62],
      [363, 255, 63], [217.8, 166.6, 54], [409.2, 149.6, 52],
      [488.4, 197.2, 48]
    ];

    function getCloudBottom(localX) {
      let bottom = 0;

      cloudPuffs.forEach(([cx, cy, radius]) => {
        const dx = localX - cx;
        if (Math.abs(dx) <= radius) {
          const edgeY = cy + Math.sqrt(radius * radius - dx * dx);
          bottom = Math.max(bottom, edgeY);
        }
      });

      return bottom;
    }

    function createStars() {
      const cloudWidth = Math.min(width * .9, 660);
      const spread = cloudWidth * .39;
      const cloudLeft = (width - 660) / 2;
      const cloudTop = 48;

      stars = Array.from({ length: 32 }, () => {
        const x = width / 2 + (Math.random() - .5) * spread * 2;
        const localX = x - cloudLeft;
        const cloudBottom = cloudTop + getCloudBottom(localX);

        // สุ่มระยะห่างหลายระดับ ให้บางเส้นยาวเด่นและบางเส้นสั้นกว่ากลุ่มชัดเจน
        const trailLength = [0.14, 0.17, 0.20, 0.24, 0.28, 0.34, 0.42, 0.52][Math.floor(Math.random() * 8)];

        return {
          x,
          y: cloudBottom + height * trailLength,
          color: colors[Math.floor(Math.random() * colors.length)],
          trailColor: gradientColors[Math.floor(Math.random() * gradientColors.length)],
          // เริ่มเส้นลึกเข้าไปในกลุ่มเมฆ เพื่อให้แสงแนบติดกับเมฆมากขึ้น
          trailStartY: cloudBottom - 28,
          flowSpeed: 18 + Math.random() * 24,
          flowOffset: Math.random(),
          flickerDelay: Math.random() * 3000,
          noise: Array.from({ length: Math.max(18, Math.round(height * trailLength / 5)) }, () => ({
            x: (Math.random() - .5) * 3.2,
            y: Math.random(),
            radius: .2 + Math.random() * .65,
            alpha: .08 + Math.random() * .28
          })),
          symbol: Math.random() < .5 ? '✦' : '✧',
          fontSize: 17 + Math.random() * 7
        };
      });
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
      draw();
    }

    function draw(time = 0) {
      ctx.clearRect(0, 0, width, height);

      stars.forEach(star => {
        const tailY = star.trailStartY;
        const flickerCycle = ((time + star.flickerDelay) % 3000) / 3000;
        const pulse = (1 - Math.cos(flickerCycle * Math.PI * 2)) / 2;
        const brightness = .42 + pulse * .58;
        const trail = ctx.createLinearGradient(star.x, tailY, star.x, star.y);
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(.25, star.trailColor + '66');
        trail.addColorStop(.72, star.trailColor + 'dd');
        trail.addColorStop(1, '#ffffff');

        ctx.save();
        ctx.globalAlpha = brightness;
        ctx.beginPath();
        ctx.moveTo(star.x, tailY);
        ctx.lineTo(star.x, star.y);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.5 + pulse * .35;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.stroke();
        ctx.restore();

        // เกรนละเอียดกระจายตามแนวเส้นแสง ให้พื้นผิวมี noise คล้ายเมฆ
        star.noise.forEach(grain => {
          const grainY = tailY + (star.y - tailY) * grain.y;
          ctx.beginPath();
          ctx.arc(star.x + grain.x, grainY, grain.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${grain.alpha})`;
          ctx.fill();
        });

        ctx.font = `${star.fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 10;
        ctx.fillText(star.symbol, star.x, star.y);
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
  })();
  </script>

  <script>
  (() => {
    const canvas = document.querySelector('.ambient-particles');
    const gl = canvas.getContext('webgl', { alpha: true, antialias: true });
    if (!gl) return;

    const palette = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8',
      '#FF8C42', '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];

    const vertexSource = `
      attribute vec2 a_position;
      attribute vec3 a_color;
      attribute float a_size;
      attribute float a_alpha;
      uniform vec2 u_resolution;
      varying vec3 v_color;
      varying float v_alpha;
      void main() {
        vec2 clip = (a_position / u_resolution) * 2.0 - 1.0;
        gl_Position = vec4(clip * vec2(1.0, -1.0), 0.0, 1.0);
        gl_PointSize = a_size;
        v_color = a_color;
        v_alpha = a_alpha;
      }
    `;
    const fragmentSource = `
      precision mediump float;
      varying vec3 v_color;
      varying float v_alpha;
      void main() {
        vec2 p = gl_PointCoord - vec2(0.5);
        if (length(p) > 0.5) discard;
        gl_FragColor = vec4(v_color, v_alpha);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertexShader = compile(gl.VERTEX_SHADER, vertexSource);
    const fragmentShader = compile(gl.FRAGMENT_SHADER, fragmentSource);
    if (!vertexShader || !fragmentShader) return;

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
    gl.useProgram(program);

    const locations = {
      position: gl.getAttribLocation(program, 'a_position'),
      color: gl.getAttribLocation(program, 'a_color'),
      size: gl.getAttribLocation(program, 'a_size'),
      alpha: gl.getAttribLocation(program, 'a_alpha'),
      resolution: gl.getUniformLocation(program, 'u_resolution')
    };
    const buffer = gl.createBuffer();
    const particles = [];
    const hexToRgb = hex => [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];

    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastTime = 0;

    function resetParticle(particle, randomY = false) {
      const spreadX = Math.min(width * .43, 520);
      const spreadY = Math.min(height * .42, 460);
      particle.x = width / 2 + (Math.random() * 2 - 1) * spreadX;
      particle.y = height * .38 + (Math.random() * 2 - 1) * spreadY;
      if (!randomY) particle.y = Math.max(30, Math.min(height - 30, particle.y));
      particle.vx = (Math.random() - .5) * 7;
      particle.vy = (Math.random() - .5) * 7;
      particle.color = hexToRgb(palette[Math.floor(Math.random() * palette.length)]);
      particle.size = [5, 3.5, 2][Math.floor(Math.random() * 3)] * dpr;
      particle.alpha = .24 + Math.random() * .52;
      particle.turn = Math.random() * Math.PI * 2;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (!particles.length) {
        for (let i = 0; i < 260; i++) {
          const particle = {};
          resetParticle(particle, true);
          particles.push(particle);
        }
      } else {
        particles.forEach(particle => {
          particle.x = Math.min(width, Math.max(0, particle.x));
          particle.y = Math.min(height, Math.max(0, particle.y));
          particle.size = particle.size / (particle.previousDpr || dpr) * dpr;
          particle.previousDpr = dpr;
        });
      }
    }

    function render(time = 0) {
      const delta = Math.min((time - (lastTime || time)) / 1000, .04);
      lastTime = time;
      const data = new Float32Array(particles.length * 7);

      particles.forEach((particle, index) => {
        particle.turn += (Math.random() - .5) * delta * 2.4;
        particle.vx += Math.cos(particle.turn) * delta * 2.2;
        particle.vy += Math.sin(particle.turn) * delta * 2.2;
        particle.vx *= .992;
        particle.vy *= .992;
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;

        const spreadX = Math.min(width * .43, 520);
        const spreadY = Math.min(height * .42, 460);
        if (Math.abs(particle.x - width / 2) > spreadX || Math.abs(particle.y - height * .38) > spreadY) {
          particle.x = width / 2 + (Math.random() - .5) * spreadX * 1.7;
          particle.y = height * .38 + (Math.random() - .5) * spreadY * 1.7;
        }

        const offset = index * 7;
        data[offset] = particle.x * dpr;
        data[offset + 1] = particle.y * dpr;
        data[offset + 2] = particle.color[0];
        data[offset + 3] = particle.color[1];
        data[offset + 4] = particle.color[2];
        data[offset + 5] = particle.size;
        data[offset + 6] = particle.alpha * (.78 + Math.sin(time / 1300 + index) * .12);
      });

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(locations.resolution, canvas.width, canvas.height);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);

      const stride = 7 * Float32Array.BYTES_PER_ELEMENT;
      gl.enableVertexAttribArray(locations.position);
      gl.vertexAttribPointer(locations.position, 2, gl.FLOAT, false, stride, 0);
      gl.enableVertexAttribArray(locations.color);
      gl.vertexAttribPointer(locations.color, 3, gl.FLOAT, false, stride, 2 * Float32Array.BYTES_PER_ELEMENT);
      gl.enableVertexAttribArray(locations.size);
      gl.vertexAttribPointer(locations.size, 1, gl.FLOAT, false, stride, 5 * Float32Array.BYTES_PER_ELEMENT);
      gl.enableVertexAttribArray(locations.alpha);
      gl.vertexAttribPointer(locations.alpha, 1, gl.FLOAT, false, stride, 6 * Float32Array.BYTES_PER_ELEMENT);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.drawArrays(gl.POINTS, 0, particles.length);
      requestAnimationFrame(render);
    }

    canvas.style.cssText = 'position:absolute;inset:0;z-index:2;pointer-events:none;';
    const hangingStars = document.querySelector('.hanging-stars');
    hangingStars.style.cssText = 'position:absolute;inset:0;z-index:4;pointer-events:none;';
    gl.clearColor(0, 0, 0, 0);
    resize();
    window.addEventListener('resize', resize, { passive: true });
    requestAnimationFrame(render);
  })();
  </script>
</main>

</body>
</html>
