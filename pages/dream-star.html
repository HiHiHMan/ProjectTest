<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
</main>
<script>
const field = document.querySelector('.star-field');
let seed = 20261109;
const random = () => {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
};
const fragment = document.createDocumentFragment();
for (let i = 0; i < 150; i++) {
  const star = document.createElement('i');
  star.className = 'tiny-star' + (i % 9 === 0 ? ' bright' : '');
  star.style.left = (random() * 100) + '%';
  star.style.top = (random() * 100) + '%';
  star.style.setProperty('--delay', (-random() * 8) + 's');
  star.style.setProperty('--duration', (3 + random() * 5) + 's');
  fragment.appendChild(star);
}
field.appendChild(fragment);
</script>
</body>
</html>
