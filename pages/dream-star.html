<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    let width = 0, height = 0, dpr = 1, stars = [];

    function createStars() {
      const cloudWidth = Math.min(width * .9, 660);
      const spread = cloudWidth * .39;

      stars = Array.from({ length: 4 }, () => ({
        x: width / 2 + (Math.random() - .5) * spread * 2,
        y: height * (.32 + Math.random() * .42),
        color: colors[Math.floor(Math.random() * colors.length)],
        symbol: Math.random() < .5 ? '✦' : '✧',
        fontSize: 17 + Math.random() * 7
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      stars.forEach(star => {
        ctx.save();
        ctx.font = `${star.fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 10;
        ctx.fillText(star.symbol, star.x, star.y);
        ctx.restore();
      });
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
  })();
  </script>
</main>

</body>
</html>
