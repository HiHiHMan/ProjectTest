<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="cloud-cluster" aria-hidden="true">
    <span class="mini-cloud cloud-back" style="--x:25%;--y:43%;--w:230px;--delay:-3s"></span>
    <span class="mini-cloud cloud-back" style="--x:70%;--y:42%;--w:220px;--delay:-13s"></span>
    <span class="mini-cloud cloud-mid" style="--x:38%;--y:61%;--w:250px;--delay:-5s"></span>
    <span class="mini-cloud cloud-mid" style="--x:62%;--y:58%;--w:250px;--delay:-15s"></span>
    <span class="mini-cloud cloud-mid" style="--x:50%;--y:35%;--w:210px;--delay:-11s"></span>
    <span class="mini-cloud cloud-front" style="--x:42%;--y:76%;--w:210px;--delay:-7s"></span>
    <span class="mini-cloud cloud-front" style="--x:63%;--y:76%;--w:205px;--delay:-19s"></span>
  </div>
  <div class="star-field" aria-hidden="true"></div>
</main>

</body>
</html>
