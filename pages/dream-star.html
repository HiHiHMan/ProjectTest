<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const palette = ['#ffe6a6', '#ffd0e8', '#c9d9ff', '#d8c4ff', '#bdf4ed', '#ffc6a1'];
    let width = 0, height = 0, dpr = 1, stars = [];

    function createStars() {
      const count = Math.max(8, Math.min(17, Math.round(width / 78) - 2));
      const spread = Math.min(width * .58, 420);
      const positions = Array.from(
        { length: count },
        () => (Math.random() - .5) * spread
      ).sort((a, b) => a - b);

      stars = positions.map(position => ({
        x: width / 2 + position,
        y: 165 + Math.random() * 118,
        length: 200 + Math.random() * 300,
        size: 11 + Math.random() * 13,
        color: palette[Math.floor(Math.random() * palette.length)],
        symbol: Math.random() > .45 ? '✦' : '✧',
        twinkleSpeed: .001 + Math.random() * .002,
        twinklePhase: Math.random() * Math.PI * 2
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(star => {
        const ax = star.x;
        const ay = star.y;
        const sx = ax;
        const sy = ay + star.length;

        const thread = ctx.createLinearGradient(ax, ay, sx, sy);
        thread.addColorStop(0, star.color + 'bb');
        thread.addColorStop(1, star.color + '55');
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(ax, (ay + sy) / 2, sx, sy);
        ctx.strokeStyle = thread;
        ctx.lineWidth = 1.15;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 5;
        ctx.stroke();

        const twinkle = (Math.sin(time * star.twinkleSpeed + star.twinklePhase) + 1) / 2;
        ctx.save();
        ctx.globalAlpha = .45 + twinkle * .55;
        ctx.translate(sx, sy);
        ctx.scale(.82 + twinkle * .2, .82 + twinkle * .2);
        ctx.font = star.size + 'px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 5 + twinkle * 13;
        ctx.fillText(star.symbol, 0, 0);
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(draw);
  })();
  </script>
</main>

</body>
</html>
