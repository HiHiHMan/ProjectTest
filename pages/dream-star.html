<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    const gradientColors = [
      '#2A1B4E', '#9C6ADE', '#78A2F2', '#D9B96F', '#FF94B8', '#FF8C42',
      '#FF4FA3', '#D6A94F', '#287BFF', '#123A9C'
    ];
    let width = 0, height = 0, dpr = 1, stars = [];

    // วงกลมเหล่านี้ตรงกับรูปทรงเมฆใน dream-scene::before
    const cloudPuffs = [
      [99, 159.8, 66], [178.2, 91.8, 58], [316.8, 146.2, 68],
      [257.4, 98.6, 62], [349.8, 68, 68], [435.6, 105.4, 64],
      [435.6, 224.4, 60], [448.8, 115.6, 90], [561, 159.8, 55],
      [191.4, 224.4, 68], [303.6, 227.8, 68], [158.4, 207.4, 62],
      [363, 255, 63], [217.8, 166.6, 54], [409.2, 149.6, 52],
      [488.4, 197.2, 48]
    ];

    function getCloudBottom(localX) {
      let bottom = 0;

      cloudPuffs.forEach(([cx, cy, radius]) => {
        const dx = localX - cx;
        if (Math.abs(dx) <= radius) {
          const edgeY = cy + Math.sqrt(radius * radius - dx * dx);
          bottom = Math.max(bottom, edgeY);
        }
      });

      return bottom;
    }

    function createStars() {
      const cloudWidth = Math.min(width * .9, 660);
      const spread = cloudWidth * .39;
      const cloudLeft = (width - 660) / 2;
      const cloudTop = 48;

      stars = Array.from({ length: 32 }, () => {
        const x = width / 2 + (Math.random() - .5) * spread * 2;
        const localX = x - cloudLeft;
        const cloudBottom = cloudTop + getCloudBottom(localX);

        // สุ่มระยะห่างหลายระดับ ให้บางเส้นยาวเด่นและบางเส้นสั้นกว่ากลุ่มชัดเจน
        const trailLength = [0.14, 0.17, 0.20, 0.24, 0.28, 0.34, 0.42, 0.52][Math.floor(Math.random() * 8)];

        return {
          x,
          y: cloudBottom + height * trailLength,
          color: colors[Math.floor(Math.random() * colors.length)],
          trailColor: gradientColors[Math.floor(Math.random() * gradientColors.length)],
          // เริ่มเส้นลึกเข้าไปในกลุ่มเมฆ เพื่อให้แสงแนบติดกับเมฆมากขึ้น
          trailStartY: cloudBottom - 28,
          flowSpeed: 18 + Math.random() * 24,
          flowOffset: Math.random(),
          noise: Array.from({ length: Math.max(18, Math.round(height * trailLength / 5)) }, () => ({
            x: (Math.random() - .5) * 3.2,
            y: Math.random(),
            radius: .2 + Math.random() * .65,
            alpha: .08 + Math.random() * .28
          })),
          symbol: Math.random() < .5 ? '✦' : '✧',
          fontSize: 17 + Math.random() * 7
        };
      });
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
      draw();
    }

    function draw(time = 0) {
      ctx.clearRect(0, 0, width, height);

      stars.forEach(star => {
        const tailY = star.trailStartY;
        const trail = ctx.createLinearGradient(star.x, tailY, star.x, star.y);
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(.48, star.trailColor + '55');
        trail.addColorStop(.82, star.trailColor + 'dd');
        trail.addColorStop(1, '#ffffff');

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(star.x, tailY);
        ctx.lineTo(star.x, star.y);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = star.trailColor;
        ctx.shadowBlur = 12;
        ctx.stroke();

        // แถบแสงสว่างเคลื่อนจากเมฆลงไปตามแนวเส้น
        const trailDistance = star.y - tailY;
        const glowLength = Math.min(26, Math.max(10, trailDistance * .12));
        const progress = (time * star.flowSpeed / 1000 / trailDistance + star.flowOffset) % 1;
        const movingGlow = ctx.createLinearGradient(star.x, tailY, star.x, star.y);
        movingGlow.addColorStop(0, 'rgba(255,255,255,0)');
        movingGlow.addColorStop(.5, 'rgba(255,255,255,.95)');
        movingGlow.addColorStop(1, 'rgba(255,255,255,0)');

        ctx.beginPath();
        ctx.moveTo(star.x, tailY);
        ctx.lineTo(star.x, star.y);
        ctx.setLineDash([glowLength, Math.max(1, trailDistance - glowLength)]);
        ctx.lineDashOffset = -progress * trailDistance;
        ctx.strokeStyle = movingGlow;
        ctx.lineWidth = 2;
        ctx.shadowColor = star.trailColor;
        ctx.shadowBlur = 9;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineDashOffset = 0;

        // เกรนละเอียดกระจายตามแนวเส้นแสง ให้พื้นผิวมี noise คล้ายเมฆ
        star.noise.forEach(grain => {
          const grainY = tailY + (star.y - tailY) * grain.y;
          ctx.beginPath();
          ctx.arc(star.x + grain.x, grainY, grain.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${grain.alpha})`;
          ctx.fill();
        });

        ctx.font = `${star.fontSize}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 10;
        ctx.fillText(star.symbol, star.x, star.y);
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
  })();
  </script>
</main>

</body>
</html>
