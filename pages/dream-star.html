<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dream Star</title>
<link rel="stylesheet" href="../styles/dream-star.css">
</head>
<body>
<main class="dream-scene" aria-label="ท้องฟ้ายามค่ำคืน">
  <div class="star-field" aria-hidden="true"></div>
  <div class="ly-3-noise" aria-hidden="true"></div>
  <canvas class="hanging-stars" aria-hidden="true"></canvas>
  <script>
  (() => {
    const canvas = document.querySelector('.hanging-stars');
    const ctx = canvas.getContext('2d');
    const colors = ['#fff2c6', '#dce8ff', '#f8ddff', '#d7fff5'];
    let width = 0, height = 0, dpr = 1, meteors = [];

    function createMeteors() {
      meteors = Array.from({ length: 4 }, () => ({
        active: false,
        x: 0,
        y: 0,
        progress: 0,
        length: 90 + Math.random() * 130,
        speed: .00022 + Math.random() * .00018,
        angle: Math.PI * (.68 + Math.random() * .12),
        color: colors[Math.floor(Math.random() * colors.length)],
        nextAt: performance.now() + Math.random() * 7000
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createMeteors();
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);

      meteors.forEach(meteor => {
        if (!meteor.active && time >= meteor.nextAt) {
          meteor.active = true;
          meteor.progress = 0;
          meteor.x = width * (.18 + Math.random() * .78);
          meteor.y = height * (.04 + Math.random() * .42);
          meteor.length = 85 + Math.random() * 145;
          meteor.speed = .00022 + Math.random() * .0002;
          meteor.angle = Math.PI * (.68 + Math.random() * .12);
          meteor.color = colors[Math.floor(Math.random() * colors.length)];
        }

        if (!meteor.active) return;

        meteor.progress += meteor.speed * 16.67;
        const distance = meteor.progress * Math.max(width, height) * .72;
        const headX = meteor.x + Math.cos(meteor.angle) * distance;
        const headY = meteor.y + Math.sin(meteor.angle) * distance;
        const tailX = headX - Math.cos(meteor.angle) * meteor.length;
        const tailY = headY - Math.sin(meteor.angle) * meteor.length;
        const fade = Math.min(1, meteor.progress * 5, (1 - meteor.progress) * 5);

        const trail = ctx.createLinearGradient(tailX, tailY, headX, headY);
        trail.addColorStop(0, 'rgba(255,255,255,0)');
        trail.addColorStop(.65, meteor.color + '66');
        trail.addColorStop(1, '#ffffff');

        ctx.save();
        ctx.globalAlpha = Math.max(0, fade);
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(headX, headY);
        ctx.strokeStyle = trail;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = meteor.color;
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(headX, headY, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = meteor.color;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();

        if (meteor.progress >= 1 || headX < -meteor.length || headY > height + meteor.length) {
          meteor.active = false;
          meteor.nextAt = time + 1800 + Math.random() * 6500;
        }
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(draw);
  })();
  </script>
</main>

</body>
</html>
