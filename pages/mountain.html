<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071014">
  <title>Mountain — Point Field</title>
  <style>
    :root { color-scheme: dark; --ink: #e7f2ed; --muted: #91aaa5; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 68%, #183b3b 0%, #0b2025 38%, #050b11 78%);
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay { position: fixed; inset: 0; pointer-events: none; padding: clamp(22px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .eyebrow { margin: 0 0 12px; color: #83b9aa; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 86px); line-height: .95; font-weight: 500; letter-spacing: -.065em; }
    .subtitle { margin: 15px 0 0; color: var(--muted); font-size: clamp(12px, 1.5vw, 15px); letter-spacing: .04em; }
    .back { pointer-events: auto; color: #d5e8df; text-decoration: none; border: 1px solid #8cb4a34d; border-radius: 999px; padding: 10px 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; backdrop-filter: blur(12px); transition: background .25s, border-color .25s; }
    .back:hover { background: #9bd4bd20; border-color: #9bd4bd; }
    .bottom { display: flex; justify-content: space-between; align-items: end; color: #77958f; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .hint { text-align: right; }
    @media (max-width: 600px) { .bottom { font-size: 8px; } .hint { max-width: 130px; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A mountain landscape formed from thousands of glowing points"></canvas>
  <main class="overlay">
    <div class="topline">
      <div>
        <p class="eyebrow">Generative landscape · 001</p>
        <h1>Mountain</h1>
        <p class="subtitle">Layered mountain ranges, formed by a continuous field of points.</p>
      </div>
      <a class="back" href="../index.html">← Experiments</a>
    </div>
    <div class="bottom">
      <span>WebGL / Point field</span>
      <span class="hint">Drag to rotate 390°<br>Move vertically to explore</span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('scene');
      const gl = canvas.getContext('webgl', { antialias: true, alpha: true });
      if (!gl) {
        document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;inset:50% 20px auto;text-align:center;color:white">WebGL is not supported by this browser.</p>');
        return;
      }

      const vertex = `
        attribute vec3 aPosition;
        attribute float aSize;
        attribute vec3 aColor;
        uniform mat4 uProjection;
        uniform mat4 uView;
        uniform float uTime;
        uniform float uPixelRatio;
        varying vec3 vColor;
        void main() {
          vec3 p = aPosition;
          p.y += sin(p.x * 0.42 + uTime * 0.35) * 0.035;
          p.y += cos(p.z * 0.55 + uTime * 0.22) * 0.025;
          vec4 viewPosition = uView * vec4(p, 1.0);
          gl_Position = uProjection * viewPosition;
          gl_PointSize = aSize * uPixelRatio * (20.0 / max(1.0, -viewPosition.z));
          vColor = aColor;
        }`;
      const fragment = `
        precision mediump float;
        varying vec3 vColor;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          if (length(c) > 0.5) discard;
          gl_FragColor = vec4(vColor, 1.0);
        }`;

      function shader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      gl.useProgram(program);

      const positions = [], sizes = [], colors = [];
      const palette = [
        [1.00, 1.00, 1.00], // white
        [0.34, 0.92, 0.48], // green
        [0.66, 0.38, 0.94], // purple
        [0.28, 0.68, 1.00], // blue
        [1.00, 0.42, 0.70], // pink
        [1.00, 0.58, 0.24]  // orange
      ];
      const columns = 340, rows = 230;
      const peaks = [
        [-8.5, -8.0, 3.9, 5.2], [-3.0, -8.0, 5.0, 4.2], [3.4, -8.0, 3.6, 5.0], [8.0, -8.0, 4.3, 4.6],
        [-7.0, 0.0, 4.7, 4.5], [-1.8, 0.0, 3.8, 5.4], [4.2, 0.0, 5.2, 4.2], [8.4, 0.0, 3.6, 4.8],
        [-8.0, 8.0, 3.5, 5.0], [-3.2, 8.0, 4.5, 4.4], [2.4, 8.0, 3.7, 5.2], [7.8, 8.0, 4.8, 4.3]
      ];

      function mountain(x, z) {
        let h = 0;
        for (const [px, pz, height, spread] of peaks) {
          const dx = x - px, dz = z - pz;
          h += height * Math.exp(-(dx * dx * 0.72 + dz * dz * 0.32) / spread);
        }
        const ridge = Math.sin(x * 0.72 + z * 0.19) * 0.2 + Math.sin(x * 1.43 - z * 0.12) * 0.09;
        return Math.max(-0.12, h + (h > 0.3 ? ridge : 0));
      }

      // Three staggered mountain ranges, with continuous point coverage.
      for (let j = 0; j < rows; j++) {
        const z = (j / (rows - 1) - 0.5) * 25;
        for (let i = 0; i < columns; i++) {
          const x = (i / (columns - 1) - 0.5) * 25;
          const y = mountain(x, z);
          positions.push(x, y, z);
          sizes.push(1.0 + Math.random() * 0.55);
          // Keep white dominant (75%); distribute accent colors across the remaining points.
          const roll = Math.random();
          const colorIndex = roll < 0.75 ? 0 : 1 + Math.floor(Math.random() * (palette.length - 1));
          const color = palette[colorIndex];
          colors.push(color[0], color[1], color[2]);
        }
      }
      function buffer(name, data, size) {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      }
      buffer('aPosition', positions, 3);
      buffer('aSize', sizes, 1);
      buffer('aColor', colors, 3);

      const projectionLoc = gl.getUniformLocation(program, 'uProjection');
      const viewLoc = gl.getUniformLocation(program, 'uView');
      const timeLoc = gl.getUniformLocation(program, 'uTime');
      const ratioLoc = gl.getUniformLocation(program, 'uPixelRatio');
      const count = positions.length / 3;
      const pointer = { x: 0, y: 0 };
      let rotation = 0;
      let dragging = false;
      let lastX = 0;
      const maxRotation = 390 * Math.PI / 180;

      canvas.style.touchAction = 'none';
      canvas.style.cursor = 'grab';

      canvas.addEventListener('pointerdown', e => {
        dragging = true;
        lastX = e.clientX;
        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = 'grabbing';
      });

      canvas.addEventListener('pointermove', e => {
        if (dragging) {
          rotation += (e.clientX - lastX) * 0.008;
          rotation = Math.max(-maxRotation / 2, Math.min(maxRotation / 2, rotation));
          lastX = e.clientX;
        }
        pointer.y = (e.clientY / innerHeight - 0.5) * 0.7;
      }, { passive: true });

      function stopDragging() {
        dragging = false;
        canvas.style.cursor = 'grab';
      }
      canvas.addEventListener('pointerup', stopDragging);
      canvas.addEventListener('pointercancel', stopDragging);
      canvas.addEventListener('lostpointercapture', stopDragging);

      function perspective(fov, aspect, near, far) {
        const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
        return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
      }
      function lookAt(eye, target) {
        let [ex,ey,ez] = eye, [tx,ty,tz] = target;
        let zx=ex-tx, zy=ey-ty, zz=ez-tz;
        let l=Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
        let xx=zz, xy=0, xz=-zx; l=Math.hypot(xx,xy,xz); xx/=l; xy/=l; xz/=l;
        const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
        return new Float32Array([
          xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
          -(xx*ex+xy*ey+xz*ez), -(yx*ex+yy*ey+yz*ez), -(zx*ex+zy*ey+zz*ez),1
        ]);
      }
      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniformMatrix4fv(projectionLoc, false, perspective(Math.PI / 3.1, canvas.width / canvas.height, 0.1, 100));
        gl.uniform1f(ratioLoc, dpr);
      }
      window.addEventListener('resize', resize);
      resize();
      gl.disable(gl.BLEND);
      gl.clearColor(0, 0, 0, 0);

      function render(ms) {
        const t = ms * 0.001;
        gl.clear(gl.COLOR_BUFFER_BIT);
        const radius = 19.5;
        const eye = [
          Math.sin(rotation) * radius,
          8.2 + pointer.y * 1.2,
          Math.cos(rotation) * radius
        ];
        gl.uniformMatrix4fv(viewLoc, false, lookAt(eye, [0, 1.2, 0]));
        gl.uniform1f(timeLoc, t);
        gl.drawArrays(gl.POINTS, 0, count);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
