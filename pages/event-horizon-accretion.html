<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Horizon Accretion</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#03050b;color:#e8edf7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#101626 0,#070b14 42%,#03050b 78%);display:grid;place-items:center;padding:28px}
main{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 18px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:#9aa8c2;text-transform:uppercase}h1{font-size:clamp(22px,4vw,36px);font-weight:500;letter-spacing:.025em;margin:8px 0 0}
.stage{position:relative;overflow:hidden;border:1px solid #283246;border-radius:18px;background:#02040a;aspect-ratio:16/9;box-shadow:0 24px 90px #0009}
canvas{display:block;width:100%;height:100%}.caption{display:flex;justify-content:space-between;gap:16px;padding:15px 3px 0;color:#9aa8c2;font-size:12px;letter-spacing:.04em}.status{color:#aab7cc}
@media(max-width:600px){body{padding:16px}.stage{aspect-ratio:4/5}.caption{font-size:10px;flex-direction:column;gap:6px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Astrophysics / WebGPU</div><h1>Event Horizon Accretion</h1></div><div class="eyebrow">01 — 01</div></header>
<section class="stage"><canvas id="scene" aria-label="Event Horizon Accretion animation"></canvas></section>
<div class="caption"><span>Black hole · Accretion disk · Photon ring</span><span class="status" id="status">Initializing WebGPU…</span></div>
</main>
<script type="module">
const shaderCode=`
struct Params { time:f32, width:f32, height:f32 }
@group(0) @binding(0) var<uniform> u:Params;
struct VOut { @builtin(position) position:vec4f }
@vertex fn vs(@builtin(vertex_index) i:u32)->VOut {
 var p=array<vec2f,3>(vec2f(-1.0,-1.0),vec2f(3.0,-1.0),vec2f(-1.0,3.0));
 var o:VOut; o.position=vec4f(p[i],0.0,1.0); return o;
}
fn hash(p:vec2f)->f32 { return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453); }
fn noise(p:vec2f)->f32 {
 let i=floor(p); let f=fract(p); let s=f*f*(3.0-2.0*f);
 return mix(mix(hash(i),hash(i+vec2f(1.0,0.0)),s.x),mix(hash(i+vec2f(0.0,1.0)),hash(i+vec2f(1.0,1.0)),s.x),s.y);
}
fn palette(x:f32)->vec3f { return 0.5+0.5*cos(6.28318*(x+vec3f(0.0,0.33,0.67))); }
@fragment fn fs(@builtin(position) p:vec4f)->@location(0) vec4f {
 let t=u.time;
 let q=(p.xy-vec2f(u.width,u.height)*0.5)/min(u.width,u.height);
 let r=length(q); let a=atan2(q.y,q.x);
 var c=vec3f(0.0);
 {let diskR=length(vec2f(q.x,q.y*2.25));let swirl=a+1.8/(r+0.07)-t*0.42;let turbulence=noise(vec2f(a*2.8,diskR*18.0-t*0.35));let disk=exp(-abs(diskR-(0.285+0.018*sin(swirl*3.0+t)))*42.0);let inner=exp(-abs(diskR-0.19)*28.0);let photon=exp(-abs(r-0.145)*105.0);let hole=1.0-smoothstep(0.105,0.132,r);c=vec3f(0.002,0.003,0.012)+palette(turbulence+swirl*0.055)*disk*0.95+vec3f(1.0,0.42,0.12)*inner*0.55+vec3f(0.45,0.72,1.0)*photon*0.7;c*=1.0-hole;}
 let vignette=1.0-smoothstep(0.42,0.9,r); c*=0.55+0.45*vignette;
 return vec4f(c,1.0);
}`;
const canvas=document.querySelector("#scene"),status=document.querySelector("#status");
let device,context,pipeline,buffer,bindGroup,frame=0,resizeObserver;
function fallback(){status.textContent="WebGPU unavailable";status.style.color="#e5a76d";const ctx=canvas.getContext("2d");function draw(now){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}ctx.setTransform(dpr,0,0,dpr,0,0);const cx=rect.width/2,cy=rect.height/2,r=Math.min(rect.width,rect.height)*.29,t=now*.001;ctx.fillStyle="#03050b";ctx.fillRect(0,0,rect.width,rect.height);ctx.save();ctx.translate(cx,cy);ctx.scale(1,.45);ctx.rotate(t*.18);for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(0,0,r*(1+i*.16),r*(.25+i*.055),0,0,Math.PI*2);ctx.strokeStyle="rgba(255,"+(105+i*22)+","+(35+i*18)+","+(0.12+i*.08)+")";ctx.lineWidth=8-i;ctx.stroke();}ctx.restore();const g=ctx.createRadialGradient(cx,cy,2,cx,cy,r*.55);g.addColorStop(0,"#000");g.addColorStop(.72,"#000");g.addColorStop(.82,"rgba(110,155,220,.65)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*.6,0,Math.PI*2);ctx.fill();frame=requestAnimationFrame(draw);}frame=requestAnimationFrame(draw);}
async function init(){if(!navigator.gpu){fallback();return;}try{const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error("No compatible GPU adapter");device=await adapter.requestDevice();context=canvas.getContext("webgpu");const format=navigator.gpu.getPreferredCanvasFormat();const module=device.createShaderModule({code:shaderCode});const info=await module.getCompilationInfo();const errors=info.messages.filter(m=>m.type==="error");if(errors.length)throw Error(errors.map(e=>"Line "+e.lineNum+": "+e.message).join("\n"));context.configure({device,format,alphaMode:"opaque"});pipeline=device.createRenderPipeline({layout:"auto",vertex:{module,entryPoint:"vs"},fragment:{module,entryPoint:"fs",targets:[{format}]},primitive:{topology:"triangle-list"}});buffer=device.createBuffer({size:12,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});bindGroup=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer}}]});const resize=()=>{const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));};resizeObserver=new ResizeObserver(resize);resizeObserver.observe(canvas);resize();status.textContent="WebGPU · WGSL";const start=performance.now();function draw(now){const w=canvas.width,h=canvas.height;device.queue.writeBuffer(buffer,0,new Float32Array([(now-start)*.001,w,h]));const encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:.002,g:.003,b:.012,a:1},loadOp:"clear",storeOp:"store"}]});pass.setPipeline(pipeline);pass.setBindGroup(0,bindGroup);pass.draw(3);pass.end();device.queue.submit([encoder.finish()]);frame=requestAnimationFrame(draw);}frame=requestAnimationFrame(draw);}catch(error){status.textContent="WebGPU error: "+error.message;console.error(error);fallback();}}
init();window.addEventListener("pagehide",()=>{cancelAnimationFrame(frame);resizeObserver?.disconnect();buffer?.destroy();device?.destroy();});
</script>
</body></html>
