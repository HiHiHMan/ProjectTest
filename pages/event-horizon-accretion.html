<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Horizon Accretion</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;min-width:0;margin:0;overflow:hidden;background:#03050b}
#scene{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh;margin:0;padding:0;border:0;background:#03050b}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module">
const shaderCode=`
struct Params { time:f32, width:f32, height:f32 }
@group(0) @binding(0) var<uniform> u:Params;
struct VOut { @builtin(position) position:vec4f }
@vertex fn vs(@builtin(vertex_index) i:u32)->VOut {
 var p=array<vec2f,3>(vec2f(-1.0,-1.0),vec2f(3.0,-1.0),vec2f(-1.0,3.0));
 var o:VOut; o.position=vec4f(p[i],0.0,1.0); return o;
}
fn hash(p:vec2f)->f32 { return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453); }
fn noise(p:vec2f)->f32 {
 let i=floor(p); let f=fract(p); let s=f*f*(3.0-2.0*f);
 return mix(mix(hash(i),hash(i+vec2f(1.0,0.0)),s.x),mix(hash(i+vec2f(0.0,1.0)),hash(i+vec2f(1.0,1.0)),s.x),s.y);
}
fn palette(x:f32)->vec3f { return 0.5+0.5*cos(6.28318*(x+vec3f(0.0,0.33,0.67))); }
@fragment fn fs(@builtin(position) p:vec4f)->@location(0) vec4f {
 let t=u.time;
 let q=(p.xy-vec2f(u.width,u.height)*0.5)/min(u.width,u.height);
 let r=length(q); let a=atan2(q.y,q.x);
 var c=vec3f(0.0);
 {let diskR=length(vec2f(q.x,q.y*2.25));let swirl=a+1.8/(r+0.07)-t*0.42;let turbulence=noise(vec2f(a*2.8,diskR*18.0-t*0.35));let disk=exp(-abs(diskR-(0.285+0.018*sin(swirl*3.0+t)))*42.0);let inner=exp(-abs(diskR-0.19)*28.0);let photon=exp(-abs(r-0.145)*105.0);let hole=1.0-smoothstep(0.105,0.132,r);c=vec3f(0.002,0.003,0.012)+palette(turbulence+swirl*0.055)*disk*0.95+vec3f(1.0,0.42,0.12)*inner*0.55+vec3f(0.45,0.72,1.0)*photon*0.7;c*=1.0-hole;}
 let vignette=1.0-smoothstep(0.42,0.9,r); c*=0.55+0.45*vignette;
 return vec4f(c,1.0);
}`;
const canvas=document.querySelector("#scene");
let device,context,pipeline,buffer,bindGroup,frame=0,resizeObserver;
function fallback(){const ctx=canvas.getContext("2d");function draw(now){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}ctx.setTransform(dpr,0,0,dpr,0,0);const cx=rect.width/2,cy=rect.height/2,r=Math.min(rect.width,rect.height)*.29,t=now*.001;ctx.fillStyle="#03050b";ctx.fillRect(0,0,rect.width,rect.height);ctx.save();ctx.translate(cx,cy);ctx.scale(1,.45);ctx.rotate(t*.18);for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(0,0,r*(1+i*.16),r*(.25+i*.055),0,0,Math.PI*2);ctx.strokeStyle="rgba(255,"+(105+i*22)+","+(35+i*18)+","+(0.12+i*.08)+")";ctx.lineWidth=8-i;ctx.stroke();}ctx.restore();const g=ctx.createRadialGradient(cx,cy,2,cx,cy,r*.55);g.addColorStop(0,"#000");g.addColorStop(.72,"#000");g.addColorStop(.82,"rgba(110,155,220,.65)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*.6,0,Math.PI*2);ctx.fill();frame=requestAnimationFrame(draw);}frame=requestAnimationFrame(draw);}
async function init(){if(!navigator.gpu){fallback();return;}try{const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error("No compatible GPU adapter");device=await adapter.requestDevice();context=canvas.getContext("webgpu");const format=navigator.gpu.getPreferredCanvasFormat();const module=device.createShaderModule({code:shaderCode});const info=await module.getCompilationInfo();const errors=info.messages.filter(m=>m.type==="error");if(errors.length)throw Error(errors.map(e=>"Line "+e.lineNum+": "+e.message).join("\n"));context.configure({device,format,alphaMode:"opaque"});pipeline=device.createRenderPipeline({layout:"auto",vertex:{module,entryPoint:"vs"},fragment:{module,entryPoint:"fs",targets:[{format}]},primitive:{topology:"triangle-list"}});buffer=device.createBuffer({size:12,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});bindGroup=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer}}]});const resize=()=>{const dpr=Math.min(window.devicePixelRatio||1,1.5);const width=Math.max(1,Math.round(window.innerWidth*dpr));const height=Math.max(1,Math.round(window.innerHeight*dpr));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}};resizeObserver=new ResizeObserver(resize);resizeObserver.observe(document.documentElement);window.addEventListener("resize",resize,{passive:true});resize();const start=performance.now();function draw(now){const w=canvas.width,h=canvas.height;device.queue.writeBuffer(buffer,0,new Float32Array([(now-start)*.001,w,h]));const encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:.002,g:.003,b:.012,a:1},loadOp:"clear",storeOp:"store"}]});pass.setPipeline(pipeline);pass.setBindGroup(0,bindGroup);pass.draw(3);pass.end();device.queue.submit([encoder.finish()]);frame=requestAnimationFrame(draw);}frame=requestAnimationFrame(draw);}catch(error){console.error(error);fallback();}}
init();window.addEventListener("pagehide",()=>{cancelAnimationFrame(frame);resizeObserver?.disconnect();buffer?.destroy();device?.destroy();});
</script>
</body></html>
