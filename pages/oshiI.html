<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080713">
  <title>OshiI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #211a39 0%, #100d20 48%, #080713 100%);
    }

    .egg-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
    }

    .egg-wrap::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 2px;
      transform: translate(-50%, -50%);
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(220, 190, 255, .28) 18%,
        rgba(245, 225, 255, .9) 50%,
        rgba(220, 190, 255, .28) 82%,
        transparent 100%
      );
      box-shadow: 0 0 10px rgba(205, 160, 255, .55);
    }

    .egg-shape {
      position: relative;
      z-index: 1;
      width: min(38vw, 280px);
      height: min(54vw, 400px);
      min-width: 150px;
      min-height: 220px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 34% 27%, rgba(255, 255, 255, .9), transparent 12%),
        radial-gradient(ellipse at 35% 28%, #f8d9ff 0%, #c59be9 32%, #8064bd 68%, #49366f 100%);
      box-shadow:
        inset -18px -24px 38px rgba(24, 13, 48, .34),
        inset 12px 14px 28px rgba(255, 255, 255, .24),
        0 0 55px rgba(174, 126, 255, .24);
    }

    @media (max-width: 600px) {
      .egg-shape {
        width: min(58vw, 250px);
        height: min(82vw, 350px);
      }
    }
  </style>
</head>
<body>
  <main class="egg-wrap">
    <div class="egg-shape" role="img" aria-label="วงรีทรงไข่ตรงกลางหน้าจอ"></div>
  </main>
</body>
</html>
