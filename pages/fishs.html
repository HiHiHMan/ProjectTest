<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07151b">
  <title>Fishs — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 48%, #12313a 0%, #091c25 48%, #050e15 100%);
      color: #d9f4ed;
      font-family: Inter, system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .heading {
      position: fixed; top: 34px; left: 0; width: 100%; z-index: 2;
      text-align: center; pointer-events: none;
    }
    h1 {
      margin: 0; font-size: clamp(13px, 1.5vw, 17px); font-weight: 500;
      letter-spacing: .48em; text-transform: uppercase; color: #c6e9dc;
      opacity: .78;
    }
    .hint {
      margin: 11px 0 0; color: #8cb8b0; opacity: .58;
      font-size: 10px; letter-spacing: .13em;
    }
    .back {
      position: fixed; top: 25px; left: 26px; z-index: 3;
      color: #a8d2c7; text-decoration: none; font-size: 10px;
      letter-spacing: .13em; opacity: .62;
    }
    .back:hover { opacity: 1; }
    @media (max-width: 600px) {
      .heading { top: 28px; }
      .back { top: 16px; left: 16px; }
      .hint { font-size: 9px; }
    }
  </style>
</head>
<body>
  <canvas id="fish-canvas" aria-label="Interactive school of fifteen small top-view fish"></canvas>
  <a class="back" href="../index.html">← PROJECTS</a>
  <header class="heading">
    <h1>Fishs</h1>
    <p class="hint">15 SMALL FISH · TOP VIEW · CLICK TO GUIDE THE SCHOOL</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('fish-canvas');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      if (!ctx) {
        document.querySelector('.hint').textContent = 'Canvas rendering is not supported in this browser';
        return;
      }

      const COUNT = 15;
      const koiPatterns = [
        { main: [0.92, 0.22, 0.08], dark: [0.10, 0.12, 0.13] },
        { main: [0.98, 0.43, 0.08], dark: [0.12, 0.13, 0.14] },
        { main: [0.78, 0.08, 0.10], dark: [0.08, 0.09, 0.10] },
        { main: [0.96, 0.30, 0.12], dark: [0.16, 0.17, 0.18] },
        { main: [0.88, 0.12, 0.08], dark: [0.08, 0.10, 0.12] }
      ];
      const fish = Array.from({ length: COUNT }, (_, i) => ({
        x: 0.22 + Math.random() * 0.56,
        y: 0.22 + Math.random() * 0.56,
        angle: Math.random() * Math.PI * 2,
        size: 15 + Math.random() * 7,
        tailPhase: Math.random() * Math.PI * 2,
        color: [0.91, 0.89, 0.81],
        pattern: koiPatterns[i % koiPatterns.length],
        mode: 'idle',
        startX: 0, startY: 0, targetX: 0, targetY: 0,
        controlX: 0, duration: 0, elapsed: 0, wait: Math.random() * 2
      }));

      let width = 1, height = 1, dpr = 1;
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = Math.max(1, Math.floor(innerWidth * dpr));
        height = Math.max(1, Math.floor(innerHeight * dpr));
        canvas.width = width;
        canvas.height = height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize, { passive: true });
      resize();

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      function beginMove(f, tx, ty, forceCurve) {
        f.startX = f.x;
        f.startY = f.y;
        f.targetX = clamp(tx, 0.045, 0.955);
        f.targetY = clamp(ty, 0.09, 0.91);
        const dx = f.targetX - f.x;
        const dy = f.targetY - f.y;
        // Horizontal-only movement is straight. Any Y displacement must follow a curved arc.
        const dxPx = dx * innerWidth;
        const dyPx = dy * innerHeight;
        const distance = Math.hypot(dxPx, dyPx);
        f.mode = forceCurve || Math.abs(dyPx) > 1 ? 'curve' : 'straight';

        // Place the Bezier control point perpendicular to the travel direction.
        // This also creates a visible curve when the fish moves almost vertically.
        const bendDirection = Math.random() < 0.5 ? -1 : 1;
        const bend = (32 + Math.random() * 72) * bendDirection;
        const perpendicularX = distance > 0 ? -dyPx / distance : 0;
        const perpendicularY = distance > 0 ? dxPx / distance : 1;
        f.controlX = (f.startX + f.targetX) * 0.5 + (perpendicularX * bend) / innerWidth;
        f.controlY = (f.startY + f.targetY) * 0.5 + (perpendicularY * bend) / innerHeight;
        f.duration = clamp(distance / (70 + Math.random() * 55), 1.8, 7.5);
        f.elapsed = 0;
      }

      function guideSchool(nx, ny) {
        fish.forEach((f, i) => {
          const angle = (i / COUNT) * Math.PI * 2;
          const radius = 0.025 + (i % 4) * 0.012;
          const tx = nx + Math.cos(angle) * radius * (innerHeight / innerWidth);
          const ty = ny + Math.sin(angle) * radius;
          beginMove(f, tx, ty, false);
          f.wait = 0;
        });
      }
      canvas.addEventListener('pointerdown', event => {
        const rect = canvas.getBoundingClientRect();
        guideSchool((event.clientX - rect.left) / rect.width, 1 - (event.clientY - rect.top) / rect.height);
      });

      function update(f, dt) {
        if (f.mode === 'idle') {
          f.wait -= dt;
          if (f.wait <= 0) {
            const tx = 0.08 + Math.random() * 0.84;
            const ty = 0.13 + Math.random() * 0.74;
            beginMove(f, tx, ty, false);
          }
          return;
        }
        f.elapsed += dt;
        const t = clamp(f.elapsed / f.duration, 0, 1);
        const eased = t * t * (3 - 2 * t);
        let nx, ny;
        if (f.mode === 'straight') {
          nx = f.startX + (f.targetX - f.startX) * eased;
          ny = f.startY + (f.targetY - f.startY) * eased;
        } else {
          const one = 1 - eased;
          nx = one * one * f.startX + 2 * one * eased * f.controlX + eased * eased * f.targetX;
          ny = one * one * f.startY + 2 * one * eased * f.controlY + eased * eased * f.targetY;
        }
        const vx = nx - f.x;
        const vy = ny - f.y;
        if (Math.hypot(vx, vy) > 0.00001) f.angle = Math.atan2(vy * innerHeight, vx * innerWidth);
        f.x = nx;
        f.y = ny;
        if (t >= 1) {
          f.mode = 'idle';
          f.wait = 0.5 + Math.random() * 2.6;
        }
      }

      function drawKoi(f, now) {
        const s = f.size * 1.45;
        const tailBeat = Math.sin(now * 0.0085 + f.tailPhase);
        const bodyWave = Math.sin(now * 0.007 + f.tailPhase) * 0.055;
        const red = f.pattern.main;
        const black = f.pattern.dark;
        const rgb = c => `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`;

        ctx.save();
        ctx.translate(f.x * innerWidth, (1 - f.y) * innerHeight);
        ctx.rotate(-f.angle);
        ctx.scale(s, s);

        // Soft shadow beneath the fish.
        ctx.save();
        ctx.translate(0.035, 0.045);
        ctx.fillStyle = 'rgba(0,0,0,.42)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.91, 0.285, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Forked tail flexing from its root.
        ctx.save();
        ctx.translate(-0.69, 0);
        ctx.rotate(tailBeat * 0.30);
        const tailGrad = ctx.createLinearGradient(-0.42, 0, 0.12, 0);
        tailGrad.addColorStop(0, 'rgba(226,205,174,.92)');
        tailGrad.addColorStop(1, 'rgba(255,245,222,.98)');
        ctx.fillStyle = tailGrad;
        ctx.strokeStyle = 'rgba(125,105,88,.42)';
        ctx.lineWidth = 0.018;
        ctx.beginPath();
        ctx.moveTo(0.10, 0);
        ctx.bezierCurveTo(-0.02, -0.08, -0.22, -0.39, -0.46, -0.40);
        ctx.bezierCurveTo(-0.39, -0.22, -0.30, -0.10, -0.19, 0);
        ctx.bezierCurveTo(-0.30, 0.10, -0.39, 0.22, -0.46, 0.40);
        ctx.bezierCurveTo(-0.22, 0.39, -0.02, 0.08, 0.10, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();

        // Paired translucent pectoral fins with fine rays.
        function fin(side) {
          ctx.save();
          ctx.scale(1, side);
          ctx.fillStyle = 'rgba(219,194,157,.76)';
          ctx.strokeStyle = 'rgba(119,99,78,.55)';
          ctx.lineWidth = 0.012;
          ctx.beginPath();
          ctx.moveTo(0.08, 0.16);
          ctx.quadraticCurveTo(-0.12, 0.25, -0.34, 0.47);
          ctx.quadraticCurveTo(-0.25, 0.17, -0.12, 0.08);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,246,222,.62)';
          ctx.lineWidth = 0.008;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(-0.08, 0.15);
            ctx.quadraticCurveTo(-0.19 - i * 0.025, 0.25, -0.29 - i * 0.012, 0.39);
            ctx.stroke();
          }
          ctx.restore();
        }
        fin(1); fin(-1);

        const bodyPath = () => {
          ctx.beginPath();
          ctx.moveTo(0.91, 0);
          ctx.bezierCurveTo(0.75, 0.17, 0.38, 0.285, -0.12, 0.265);
          ctx.bezierCurveTo(-0.39, 0.25, -0.60, 0.13, -0.72, bodyWave);
          ctx.bezierCurveTo(-0.60, -0.13, -0.39, -0.25, -0.12, -0.265);
          ctx.bezierCurveTo(0.38, -0.285, 0.75, -0.17, 0.91, 0);
          ctx.closePath();
        };
        const bodyGrad = ctx.createLinearGradient(0, -0.30, 0, 0.30);
        bodyGrad.addColorStop(0, '#fffdf1');
        bodyGrad.addColorStop(0.28, '#f4eee0');
        bodyGrad.addColorStop(0.62, '#d9cfbd');
        bodyGrad.addColorStop(1, '#a99e8c');
        bodyPath();
        ctx.fillStyle = bodyGrad;
        ctx.shadowColor = 'rgba(0,0,0,.25)';
        ctx.shadowBlur = 0.10;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.save();
        bodyPath(); ctx.clip();

        // Natural irregular red and sumi patches.
        const patch = (x, y, rx, ry, color, rotation = 0) => {
          ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
          const g = ctx.createRadialGradient(-rx * .15, -ry * .18, 0.015, 0, 0, rx);
          g.addColorStop(0, color); g.addColorStop(0.72, color);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        };
        patch(0.47, -0.015, 0.25, 0.18, rgb(red), -0.2);
        patch(-0.10, 0.11, 0.28, 0.15, rgb(red), 0.25);
        patch(-0.38, -0.08, 0.12, 0.095, rgb(black), -0.4);

        // Overlapping scale arcs and pearl-like highlights.
        for (let row = -3; row <= 3; row++) {
          for (let col = -7; col <= 8; col++) {
            const x = col * 0.105 + (row % 2) * 0.052;
            const y = row * 0.067 + Math.sin(col * 0.55) * 0.008;
            ctx.beginPath();
            ctx.arc(x, y, 0.058, 0.12, Math.PI - 0.12);
            ctx.strokeStyle = 'rgba(126,111,91,.19)';
            ctx.lineWidth = 0.008;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x, y + 0.006, 0.052, Math.PI + 0.18, Math.PI * 2 - 0.18);
            ctx.strokeStyle = 'rgba(255,255,255,.38)';
            ctx.lineWidth = 0.009;
            ctx.stroke();
          }
        }
        const shine = ctx.createLinearGradient(0, -0.24, 0, 0.08);
        shine.addColorStop(0, 'rgba(255,255,255,.72)');
        shine.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = shine;
        ctx.beginPath();
        ctx.ellipse(0.12, -0.11, 0.59, 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Gill, mouth and glossy eyes.
        ctx.strokeStyle = 'rgba(105,91,78,.48)';
        ctx.lineWidth = 0.014;
        ctx.beginPath(); ctx.arc(0.48, 0, 0.17, -1.18, 1.18); ctx.stroke();
        ctx.strokeStyle = 'rgba(91,75,65,.62)';
        ctx.beginPath(); ctx.moveTo(0.87, 0); ctx.quadraticCurveTo(0.94, 0.025, 0.96, 0.005); ctx.stroke();
        for (const side of [-1, 1]) {
          ctx.beginPath(); ctx.arc(0.69, side * 0.105, 0.032, 0, Math.PI * 2);
          ctx.fillStyle = '#b58b50'; ctx.fill();
          ctx.beginPath(); ctx.arc(0.696, side * 0.105, 0.021, 0, Math.PI * 2);
          ctx.fillStyle = '#111719'; ctx.fill();
          ctx.beginPath(); ctx.arc(0.702, side * 0.105 - 0.008, 0.007, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();
        }
        ctx.restore();
      }

      function render(now) {
        const dt = Math.min((now - (render.last || now)) / 1000, 0.04);
        render.last = now;
        fish.forEach(f => update(f, dt));

        const water = ctx.createRadialGradient(innerWidth * 0.5, innerHeight * 0.46, 20, innerWidth * 0.5, innerHeight * 0.5, Math.max(innerWidth, innerHeight) * 0.78);
        water.addColorStop(0, '#17404a');
        water.addColorStop(0.52, '#0a2732');
        water.addColorStop(1, '#04121b');
        ctx.fillStyle = water;
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        ctx.save();
        ctx.globalAlpha = 0.075;
        ctx.strokeStyle = '#9bd6c9';
        ctx.lineWidth = 1;
        for (let i = 0; i < 9; i++) {
          const y = (i / 9) * innerHeight + Math.sin(now * 0.00035 + i) * 12;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(innerWidth * 0.28, y - 18, innerWidth * 0.65, y + 20, innerWidth, y - 8);
          ctx.stroke();
        }
        ctx.restore();

        fish.forEach(f => drawKoi(f, now));
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
