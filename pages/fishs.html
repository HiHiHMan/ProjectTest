<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07151b">
  <title>Fishs — ProjectTest</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 48%, #12313a 0%, #091c25 48%, #050e15 100%);
      color: #d9f4ed;
      font-family: Inter, system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .heading {
      position: fixed; top: 34px; left: 0; width: 100%; z-index: 2;
      text-align: center; pointer-events: none;
    }
    h1 {
      margin: 0; font-size: clamp(13px, 1.5vw, 17px); font-weight: 500;
      letter-spacing: .48em; text-transform: uppercase; color: #c6e9dc;
      opacity: .78;
    }
    .hint {
      margin: 11px 0 0; color: #8cb8b0; opacity: .58;
      font-size: 10px; letter-spacing: .13em;
    }
    .back {
      position: fixed; top: 25px; left: 26px; z-index: 3;
      color: #a8d2c7; text-decoration: none; font-size: 10px;
      letter-spacing: .13em; opacity: .62;
    }
    .back:hover { opacity: 1; }
    @media (max-width: 600px) {
      .heading { top: 28px; }
      .back { top: 16px; left: 16px; }
      .hint { font-size: 9px; }
    }
  </style>
</head>
<body>
  <canvas id="fish-canvas" aria-label="Interactive school of fifteen small top-view fish"></canvas>
  <a class="back" href="../index.html">← PROJECTS</a>
  <header class="heading">
    <h1>Fishs</h1>
    <p class="hint">15 SMALL FISH · TOP VIEW · CLICK TO GUIDE THE SCHOOL</p>
  </header>
  <script>
    (() => {
      const canvas = document.getElementById('fish-canvas');
      const gl = canvas.getContext('webgl2', { alpha: false, antialias: true, powerPreference: 'high-performance' });
      if (!gl) {
        document.querySelector('.hint').textContent = 'WebGL 2 is not supported in this browser';
        return;
      }

      const vertexSource = `#version 300 es
        in vec2 aPosition;
        in vec3 aColor;
        out vec3 vColor;
        void main() {
          gl_Position = vec4(aPosition, 0.0, 1.0);
          vColor = aColor;
        }`;
      const fragmentSource = `#version 300 es
        precision highp float;
        in vec3 vColor;
        out vec4 outColor;
        void main() {
          outColor = vec4(vColor, 1.0);
        }`;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(shader));
          return null;
        }
        return shader;
      }
      const vs = compile(gl.VERTEX_SHADER, vertexSource);
      const fs = compile(gl.FRAGMENT_SHADER, fragmentSource);
      if (!vs || !fs) return;
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
      }

      const COUNT = 15;
      const colors = [
        [0.42,0.88,0.79], [0.53,0.78,0.94], [0.76,0.91,0.78],
        [0.35,0.73,0.76], [0.78,0.87,0.94], [0.47,0.86,0.87],
        [0.68,0.91,0.84], [0.42,0.72,0.86], [0.83,0.91,0.78],
        [0.46,0.82,0.75], [0.60,0.83,0.94], [0.77,0.88,0.84],
        [0.39,0.77,0.81], [0.68,0.85,0.92], [0.51,0.90,0.80]
      ];
      const fish = Array.from({ length: COUNT }, (_, i) => ({
        x: 0.22 + Math.random() * 0.56,
        y: 0.22 + Math.random() * 0.56,
        angle: Math.random() * Math.PI * 2,
        size: 10 + Math.random() * 5,
        tailPhase: Math.random() * Math.PI * 2,
        color: colors[i],
        mode: 'idle',
        startX: 0, startY: 0, targetX: 0, targetY: 0,
        controlX: 0, duration: 0, elapsed: 0, wait: Math.random() * 2
      }));

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      const VERTICES_PER_FISH = 51;\n      gl.bufferData(gl.ARRAY_BUFFER, COUNT * VERTICES_PER_FISH * 5 * Float32Array.BYTES_PER_ELEMENT, gl.DYNAMIC_DRAW);
      const stride = 5 * Float32Array.BYTES_PER_ELEMENT;
      const positionLoc = gl.getAttribLocation(program, 'aPosition');
      const colorLoc = gl.getAttribLocation(program, 'aColor');
      gl.enableVertexAttribArray(positionLoc);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, stride, 0);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, stride, 2 * Float32Array.BYTES_PER_ELEMENT);

      let width = 1, height = 1, dpr = 1;
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = Math.max(1, Math.floor(innerWidth * dpr));
        height = Math.max(1, Math.floor(innerHeight * dpr));
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
      addEventListener('resize', resize, { passive: true });
      resize();

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      function beginMove(f, tx, ty, forceCurve) {
        f.startX = f.x;
        f.startY = f.y;
        f.targetX = clamp(tx, 0.045, 0.955);
        f.targetY = clamp(ty, 0.09, 0.91);
        const dx = f.targetX - f.x;
        const dy = f.targetY - f.y;
        // Horizontal-only movement is straight. Any Y displacement must follow a curved arc.
        const dxPx = dx * innerWidth;
        const dyPx = dy * innerHeight;
        const distance = Math.hypot(dxPx, dyPx);
        f.mode = forceCurve || Math.abs(dyPx) > 1 ? 'curve' : 'straight';

        // Place the Bezier control point perpendicular to the travel direction.
        // This also creates a visible curve when the fish moves almost vertically.
        const bendDirection = Math.random() < 0.5 ? -1 : 1;
        const bend = (32 + Math.random() * 72) * bendDirection;
        const perpendicularX = distance > 0 ? -dyPx / distance : 0;
        const perpendicularY = distance > 0 ? dxPx / distance : 1;
        f.controlX = (f.startX + f.targetX) * 0.5 + (perpendicularX * bend) / innerWidth;
        f.controlY = (f.startY + f.targetY) * 0.5 + (perpendicularY * bend) / innerHeight;
        f.duration = clamp(distance / (70 + Math.random() * 55), 1.8, 7.5);
        f.elapsed = 0;
      }

      function guideSchool(nx, ny) {
        fish.forEach((f, i) => {
          const angle = (i / COUNT) * Math.PI * 2;
          const radius = 0.025 + (i % 4) * 0.012;
          const tx = nx + Math.cos(angle) * radius * (innerHeight / innerWidth);
          const ty = ny + Math.sin(angle) * radius;
          beginMove(f, tx, ty, false);
          f.wait = 0;
        });
      }
      canvas.addEventListener('pointerdown', event => {
        const rect = canvas.getBoundingClientRect();
        guideSchool((event.clientX - rect.left) / rect.width, 1 - (event.clientY - rect.top) / rect.height);
      });

      function update(f, dt) {
        if (f.mode === 'idle') {
          f.wait -= dt;
          if (f.wait <= 0) {
            const tx = 0.08 + Math.random() * 0.84;
            const ty = 0.13 + Math.random() * 0.74;
            beginMove(f, tx, ty, false);
          }
          return;
        }
        f.elapsed += dt;
        const t = clamp(f.elapsed / f.duration, 0, 1);
        const eased = t * t * (3 - 2 * t);
        let nx, ny;
        if (f.mode === 'straight') {
          nx = f.startX + (f.targetX - f.startX) * eased;
          ny = f.startY + (f.targetY - f.startY) * eased;
        } else {
          const one = 1 - eased;
          nx = one * one * f.startX + 2 * one * eased * f.controlX + eased * eased * f.targetX;
          ny = one * one * f.startY + 2 * one * eased * f.controlY + eased * eased * f.targetY;
        }
        const vx = nx - f.x;
        const vy = ny - f.y;
        if (Math.hypot(vx, vy) > 0.00001) f.angle = Math.atan2(vy * innerHeight, vx * innerWidth);
        f.x = nx;
        f.y = ny;
        if (t >= 1) {
          f.mode = 'idle';
          f.wait = 0.5 + Math.random() * 2.6;
        }
      }

      const vertices = new Float32Array(COUNT * VERTICES_PER_FISH * 5);
      function render(now) {
        const dt = Math.min((now - (render.last || now)) / 1000, 0.04);
        render.last = now;
        fish.forEach(f => update(f, dt));
        let offset = 0;

        function vertex(f, lx, ly, tint, angle = f.angle) {
          const cos = Math.cos(angle), sin = Math.sin(angle);
          const px = lx * f.size, py = ly * f.size;
          const rx = px * cos - py * sin;
          const ry = px * sin + py * cos;
          vertices[offset++] = f.x * 2 - 1 + (rx * dpr / width) * 2;
          vertices[offset++] = f.y * 2 - 1 + (ry * dpr / height) * 2;
          vertices[offset++] = tint[0];
          vertices[offset++] = tint[1];
          vertices[offset++] = tint[2];
        }

        function triangle(f, a, b, c, tint, angle = f.angle) {
          vertex(f, a[0], a[1], tint, angle);
          vertex(f, b[0], b[1], tint, angle);
          vertex(f, c[0], c[1], tint, angle);
        }

        function tailVertex(f, lx, ly, tint, wag) {
          const pivotX = -0.49;
          const rotatedX = (lx - pivotX) * Math.cos(wag) - ly * Math.sin(wag) + pivotX;
          const rotatedY = (lx - pivotX) * Math.sin(wag) + ly * Math.cos(wag);
          vertex(f, rotatedX, rotatedY, tint, f.angle);
        }

        function tailTriangle(f, a, b, c, tint, wag) {
          tailVertex(f, a[0], a[1], tint, wag);
          tailVertex(f, b[0], b[1], tint, wag);
          tailVertex(f, c[0], c[1], tint, wag);
        }

        fish.forEach(f => {
          const base = f.color;
          const light = base.map(v => Math.min(1, v * 1.16 + 0.08));
          const dark = base.map(v => v * 0.66);
          const tailTint = base.map(v => v * 0.82);
          const wag = Math.sin(now * 0.009 + f.tailPhase) * 0.34;
          // Forked tail swings around its root, not around the fish center.
          tailTriangle(f, [-0.49, 0], [-1.08, 0.43], [-0.82, 0.015], tailTint, wag);
          tailTriangle(f, [-0.49, 0], [-0.82, -0.015], [-1.08, -0.43], tailTint, wag);
          tailTriangle(f, [-0.52, 0], [-0.78, 0.015], [-0.78, -0.015], light, wag);

          // Paired pectoral fins visible from above.
          triangle(f, [0.02, 0.20], [-0.30, 0.48], [-0.20, 0.12], dark);
          triangle(f, [0.02, -0.20], [-0.20, -0.12], [-0.30, -0.48], dark);

          // Tapered, rounded body drawn as a small triangle fan.
          const outline = [
            [0.88, 0], [0.63, 0.17], [0.28, 0.27], [-0.16, 0.25],
            [-0.52, 0.12], [-0.52, -0.12], [-0.16, -0.25],
            [0.28, -0.27], [0.63, -0.17]
          ];
          for (let i = 0; i < outline.length; i++) {
            triangle(f, [0.12, 0], outline[i], outline[(i + 1) % outline.length],
              i < 4 ? light : base);
          }

          // Dorsal fin and tiny eyes clarify the fish silhouette and head direction.
          triangle(f, [-0.22, 0.20], [-0.02, 0.36], [0.20, 0.22], dark);
          const eye = [0.035, 0.035, 0.045];
          triangle(f, [0.59, 0.105], [0.66, 0.13], [0.63, 0.075], eye);
          triangle(f, [0.59, -0.105], [0.63, -0.075], [0.66, -0.13], eye);
        });

        gl.clearColor(0.018, 0.055, 0.071, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(program);
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
        gl.drawArrays(gl.TRIANGLES, 0, COUNT * VERTICES_PER_FISH);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
